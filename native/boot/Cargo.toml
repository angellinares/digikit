[package]
name = "elektron-native-boot"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Bounded Oracle cold-boot diagnostic runner"

[lib]
name = "elektron_native_boot"
crate-type = ["rlib", "cdylib"]

[features]
default = []
# Differential/debug build: keep the reset RAM clear on the interpreter.
reference-ram-clear = []
diagnostic-profile = []
diagnostic-events = []
diagnostic-trace = []
diagnostics = ["diagnostic-profile", "diagnostic-events", "diagnostic-trace"]

[dependencies]
coldfire = { path = "../coldfire" }
device-profile = { path = "../device-profile" }
dt2-firmware-loader = { path = "../loader" }
emmc-card = { path = "../card" }
machine = { path = "../machine" }
plusdrive-format = { path = "../plusdrive" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
