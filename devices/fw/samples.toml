# samples: the stock sample pool (DT2 1.17 loader, worker queue, slot tables; finding 109)
# Names follow <cpu>.<subsystem>.<kind>.<name>; was = former names, for reading older docs, never resolved (docs/design/firmware-decls.md).
# The path open, close and stored-metadata functions are in storage.toml. DN2 has no stock pool borrow: core/sample-pool owns an allocator there
# and runs its page transport as a job on the same worker (worker.get and worker.queue are declared for both devices).

[[fn]]
name = "cf.samples.fn.loader.load"
cpu = "cf"
sig = "i32 (const u32 *key, u32 slot)"
devices = ["dt2"]
rule = { kind = "cf_func", hash = "9c2d8bd886e5db34a4da5fc4f84560f6", offset = 0x0, len = 4 }
mark = "D"
users = ["core/sample-pool"]
doc = "The stock sample loader (finding 109 section 2): slot <= 0x3ff and (slot & 0x7f) != 0; releases the slot's old block, deduplicates by the 16-byte key, appends to the pool, 0 = ok, -1 = pool full. Writes RAM tables only; never the project settings. Call it on the SampleLoaderBgWorker."

[[fn]]
name = "cf.samples.fn.slot.release"
cpu = "cf"
sig = "void (u32 slot)"
devices = ["dt2"]
rule = { kind = "cf_func", hash = "dc40a364e367135add72b2eabf2974d6", offset = 0x0, len = 4 }
mark = "D"
users = ["core/sample-pool"]
doc = "Release one slot (finding 109 section 2; the loader calls it first): drops the slot from its record, frees the record when no slot shares it, rebuilds the slot map, resets the slot's key to -1. Moves only 0x34-byte records, never PCM. Same locking as the loader: call it on the SampleLoaderBgWorker."

[[fn]]
name = "cf.samples.fn.worker.get"
cpu = "cf"
sig = "u32 ()"
devices = ["dt2", "dn2"]
rule = { kind = "cf_func", hash = "14b8cdec104500e269af8c0f10c7095c", ordinal = 1, offset = 0x0, len = 4 }
mark = "D"
users = ["core/sample-pool"]
doc = "Getter of the SampleLoaderBgWorker singleton (finding 109 section 3); its task id is the word at +0x20."

[[fn]]
name = "cf.samples.fn.worker.queue"
cpu = "cf"
sig = "u32 (u32 worker, const char *name, void *job, void *done)"
devices = ["dt2", "dn2"]
rule = { kind = "cf_func", hash = "2deda5ff5cc76433776f2e649f57f0c1", offset = 0x0, len = 4 }
mark = "D"
users = ["core/sample-pool"]
doc = "Queue a job on a worker: `job` and `done` are std::function objects (storage, manager, invoker), as ReloadAllSamples passes them. The job runs in the worker task."

[[site]]
name = "cf.samples.site.slot.keys"
bind = "static"
cpu = "cf"
devices = ["dt2"]
rule = { kind = "cf_func", hash = "e8897b1c26df0b8930f8598e2c3db5d9", offset = 0x3e, len = 4 }
mark = "D"
users = ["core/sample-pool"]
doc = "The 4-byte address literal of the key array of the loader, 16 bytes per slot (0x400 slots). Word 0 is 0xffffffff after a slot is released or the pool is reset (finding 109 section 3)."

[[site]]
name = "cf.samples.site.slot.map"
bind = "static"
cpu = "cf"
devices = ["dt2"]
rule = { kind = "cf_func", hash = "47bd46c21c297d29e10096fd67231757", offset = 0xe, len = 4 }
mark = "D"
users = ["core/sample-pool"]
doc = "The 4-byte address literal of the slot to record index map, one i32 per slot. Valid only while the slot is loaded: it reads 0 (not -1) after a reset, so loss is not detected with it."

[[site]]
name = "cf.samples.site.slot.stereo"
bind = "static"
cpu = "cf"
devices = ["dt2"]
rule = { kind = "cf_func", hash = "ec8e15811cd4d08a5a6b624683503863", offset = 0x6, len = 4 }
mark = "D"
users = ["core/sample-pool"]
doc = "The 4-byte address literal of the stereo flags of loaded slots, one byte per slot (the stock accessor reads it)."

[[site]]
name = "cf.samples.site.record.vector"
bind = "static"
cpu = "cf"
devices = ["dt2"]
rule = { kind = "cf_func", hash = "47bd46c21c297d29e10096fd67231757", offset = 0x24, len = 4 }
mark = "D"
users = ["core/sample-pool"]
doc = "The 4-byte address literal of the record vector (the pointer pair: begin and end); record stride 0x34: +0x10 pool block offset, +0x14 rounded extent, +0x30 count of sharing slots (finding 109 section 1)."
