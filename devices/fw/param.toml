# param: parameter tables, references and bounds
# Names follow <cpu>.<subsystem>.<kind>.<name>; was = former names, for reading older docs, never resolved (docs/design/firmware-decls.md).

[[data]]
name = "cf.param.data.descriptor_table"
was = ["cf.param.data.t1", "cf.params.t1"]
cpu = "cf"
devices = ["dt2", "dn2"]
rule = { kind = "cf_params_t1" }
mark = "D"
users = ["core/params"]
doc = "the parameter table (60-byte rows), by the signature of its reader"

[[data]]
name = "cf.param.data.descriptor_table.master_sidechain_filter"
was = ["cf.param.data.master_sidechain_filter", "cf.param.master_sidechain_filter"]
cpu = "cf"
rule = { kind = "cf_words", words = ["*", 0x42, 0x0, 0x7f00, 0x5000, 0x0, 0x75ffff, 0x116, "*", 0x0, "*", "*", "*", "*", "*"] }
mark = "D"
doc = "The descriptor row (60 bytes) of that parameter: mirror index 66, range 0..0x7f00, default 0x5000."

[[fn]]
name = "cf.param.fn.set_value"
cpu = "cf"
sig = "u32 (const u8 *obj, u32 code, i32 raw, u32 track, u32 notify, u32 record, u32 redraw)"
rule = { kind = "cf_func", hash = "89d965df70565c490efde3016d66a843", offset = 0x0, len = 4 }
mark = "D"
users = ["core/runtime"]
doc = "The absolute parameter setter the stock page uses after a turn and the sample list uses after a pick: (obj, code, raw, track, 1, 1, 1). Clamps raw to the row range, stores it in the sound, notifies the project and the observers. obj is the parameter object of the page (view vtable 0xc4 (view, code, track)). DT2 0x4003b570, DN2 0x40037326."

[[fn]]
name = "cf.param.fn.value_class"
was = ["cf.param.fn.t2", "cf.params.t2"]
cpu = "cf"
rule.dt2 = { kind = "cf_func", hash = "254d9fca9141d9a4f7f2308730fafa3a", offset = 0x0, len = 10 }
rule.dn2 = { kind = "cf_func", hash = "ad9a012d7c22efe3de4430746f3ad4cf", offset = 0x0, len = 10 }
mark = "D"
users = ["core/params"]
doc = "the accessor of the second per-code table (0x44-byte value-class objects built at boot): `move.l 4(sp),D0; cmpi.l #0x113,D0`"

[[sites]]
name = "cf.param.sites.descriptor_table.bound"
was = ["cf.param.sites.bound", "cf.params.bound"]
cpu = "cf"
devices = ["dt2", "dn2"]
rule = { kind = "cf_params_bounds", exclude_anchors = ["cf.param.fn.value_class"] }
mark = "D"
users = ["core/params"]
doc = "Every clamp bound of the descriptor table's readers (a 7-byte `cmpi.l #count` compare, the row count as the immediate at +2), except the one in the value_class accessor; core/params raises them."

[[sites]]
name = "cf.param.sites.descriptor_table.ref"
was = ["cf.param.sites.ref", "cf.params.ref"]
cpu = "cf"
devices = ["dt2", "dn2"]
rule = { kind = "cf_params_refs" }
mark = "D"
users = ["core/params"]
doc = "every absolute reference into the table (a 32-bit word) and every clamp bound of its readers (7 bytes, the immediate at +2), in address order; the bounds inside the accessor above are left out (the hook handles it)"

[[hook]]
name = "cf.param.hook.value_class"
site = "cf.param.fn.value_class"
offset = 4
cpu = "cf"
mode = "before"
regs = { in = ["d0"], clobbers = ["d0"] }   # d0 rewritten on purpose; the displaced cmpi.l sets the flags again
devices = ["dt2", "dn2"]
mark = "D"
users = ["core/params"]
doc = "Accessor of the second per-code table `move.l 4(sp),D0; cmpi.l #count,D0`; the hook sits on the compare and maps an added parameter code in d0 to its template's code."
