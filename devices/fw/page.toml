# ---- the machine's SRC page (Digitakt II SourcePageView, Digitone II MultiSourcePageView): the encoder click ----
[[fn]]
name = "cf.page.fn.source_key"
cpu = "cf"
rule.dt2 = { kind = "cf_func", hash = "ad9ba58a44b65973c8df406df251a462", offset = 0x0, len = 8 }
rule.dn2 = { kind = "cf_func", hash = "31077f691362b318983bb20482d9b46f", offset = 0x0, len = 8 }
mark = "D"
users = ["core/runtime"]
doc = "Key handler (vfunc_2) of the machine's parameter page: `SourcePageView::vfunc_2` on the Digitakt II, `MultiSourcePageView::vfunc_2` on the Digitone II. Stack: 4(sp) = the view, 8(sp) = the key event (code at +0xc, flags at +0x10: 0x01 press, 0x02 chord, 0x08 repeat, 0x10 release; encoder clicks are codes 0x29 to 0x30). Entry: `link.w A6,-0x34; movem.l ...` (DT2) or `lea -0x24(SP),SP; movem.l ...` (DN2), 8 bytes (the hook displaces both instructions)."

[[fn]]
name = "cf.page.fn.source_turn"
cpu = "cf"
rule.dt2 = { kind = "cf_func", hash = "640ca8f509ff9bcae3b20384529fec6f", offset = 0x0, len = 8 }
rule.dn2 = { kind = "cf_func", hash = "bdaf946934665f13a8e4e649ae285624", offset = 0x0, len = 8 }
mark = "D"
users = ["core/runtime"]
doc = "Encoder turn handler (vfunc_17) of the machine's parameter page (`SourcePageView` on the Digitakt II, `MultiSourcePageView` on the Digitone II). Stack: 4(sp) = the view, 8(sp) = the event; the encoder is `event[3] - 1` (0 to 7). Entry: `link.w A6,-0x34; movem.l ...` (DT2) or `lea -0x30(SP),SP; movem.l ...` (DN2), 8 bytes (the hook displaces both instructions)."

[[fn]]
