# ---- Digitone II 1.12 (the same sites, found by their own hashes; the shapes are the Digitakt II's, finding 61 "The Digitone II") ----
# The page accessor FUN_400c25d8: `moveq 0x24,D1; move.l 4(SP),D0` (the bound: pages 0 .. 36 are stock).
