mark = "D"
users = ["core/fxpages"]
doc = "Common exit of the kit's effect value array initialiser, `movem.l (SP),{D2 A2-A5}; lea (0x20,SP),SP` (8 bytes; a2 = the array); core/fxpages gives each effect row its defaults here."

