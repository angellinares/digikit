# Hook points. Contracts are read from the core/fxpages stubs (mark D). All resume at the site end or another address in
# the function, not at a tail.

[[hook]]
name = "cf.page.hook.page_desc"
site = "cf.page.fn.page_desc"
cpu = "cf"
mode = "replace"
regs = { in = [], clobbers = ["d0", "d1", "a0", "a1", "ccr"] }   # page at 4(sp); own pages rts, others re-enter at site+6
devices = ["dt2", "dn2"]
mark = "D"
users = ["core/fxpages"]
doc = "Page descriptor accessor `row = f(int page)`, entry `moveq FX_PAGE_FIRST-1,D1; move.l 4(SP),D0` (6 bytes); the hook answers the run-time effect pages and the send page with its own rows."

[[hook]]
