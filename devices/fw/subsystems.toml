# The allowed subsystem words of a declaration name <cpu>.<subsystem>.<kind>.<name>, with their meaning.
# Each subsystem has one file: devices/fw/<subsystem>.toml for ColdFire, devices/fw/dsp/<subsystem>.toml for the DSP.

[cf]
rtos = "tasks, queues, mutexes, idle, interrupts, the reset and boot path"
mem = "heap, operator new and free"
storage = "block device reads and writes, the boot record"
samples = "the stock sample pool: loader, worker queue, slot tables and records"
project = "the project object, kits, tracks, serialisation"
midi = "MIDI send and receive"
input = "key and encoder decoding"
view = "Brain, ViewController, View, redraw, the UI loop"
menu = "Menu, MenuItem, menu views, the SETTINGS menu"
list = "list views"
window = "popups and dialogs"
string = "std::string, std::function and shared_ptr helpers"
draw = "pixels, rectangles, bitmaps, the screen"
text = "fonts and text drawing"
param = "parameter tables, references and bounds"
machine = "the machine framework: dispatch, names, per-type tables, the run-time registry"
page = "parameter and FX pages"
link = "the ColdFire side of the DSP link: block interrupt, frame call, records"
test = "anchors used only by test fixtures"
util = "anything that fits nowhere else"

[dsp]
cache = "cache configuration and startup ranges"
frame = "the frame orchestrator"
voice = "voice rendering"
fx = "the effect chain: sends, returns, buses"
master = "the master stage"
link = "the DSP side of the link"
machine = "machine selection tables"
