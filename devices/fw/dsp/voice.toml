# ---- DN2 stereo: the pan loop ----
[[site]]
name = "dsp.voice.site.pan_slot"
cpu = "sharc"
devices = ["dn2"]
rule = { kind = "sharc_func", reloc_hash = "09fe195e8b260c0e03e917b6430ae3f7ccc952741729580632f7b97e3bc007cc", offset = 0xc05, len = 6 }
mark = "D"
users = ["core/dsp-voice"]
doc = "DN2 1.12 0x1c9af6, the multiply `F4 = F2 * F8; modify(I1, M4)` of plane A's first sample in the pan loop 0x1c9aea to 0x1c9b30 (outer loop of 16 slots, 7th instruction; the loop's restrictions on branches concern its last instructions, docs/design/dn2-stereo.md 1.1)."

[[site]]
name = "dsp.voice.site.pan_slot.next"
cpu = "sharc"
devices = ["dn2"]
rule = { kind = "sharc_func", reloc_hash = "09fe195e8b260c0e03e917b6430ae3f7ccc952741729580632f7b97e3bc007cc", offset = 0xc08, len = 2 }
mark = "D"
users = ["core/dsp-voice"]
doc = "DN2 1.12 0x1c9af9: the instruction after the pan loop's hook site (the store of plane A's first sample); the hook runs the displaced multiply and jumps here."

[[site]]
name = "dsp.voice.site.pan_slot.end"
cpu = "sharc"
devices = ["dn2"]
rule = { kind = "sharc_func", reloc_hash = "09fe195e8b260c0e03e917b6430ae3f7ccc952741729580632f7b97e3bc007cc", offset = 0xc3f, len = 6 }
mark = "D"
users = ["core/dsp-voice"]
doc = "DN2 1.12 0x1c9b30, the last instruction of the pan loop (`I5 = modify(I5, 8)`); a stereo slot jumps here as the stock loop does at 0x1c9b07."

[[hook]]
name = "dsp.voice.hook.pan_slot"
site = "dsp.voice.site.pan_slot"
cpu = "sharc"
mode = "replace"
devices = ["dn2"]
regs = { in = ["r0", "r2", "r8", "r9", "i2-i5", "i6", "m4"], clobbers = ["r1", "r3-r7", "r10-r11", "r13-r15", "i0-i1", "i3", "i8-i11", "astat"] }
mark = "D"
users = ["core/dsp-voice"]
doc = "A stamped slot: plane B from the slot's R buffer; every other slot runs the displaced instruction and the stock loop."

[[site]]
name = "dsp.voice.site.pan_pre"
cpu = "sharc"
devices = ["dn2"]
rule = { kind = "sharc_func", reloc_hash = "09fe195e8b260c0e03e917b6430ae3f7ccc952741729580632f7b97e3bc007cc", offset = 0xbbe, len = 6 }
mark = "D"
users = ["core/dsp-voice"]
doc = "DN2 1.12 0x1c9aaf, `BIT SET MODE1 0x200000`: the first instruction after the conditional fade loop 0x1c9a59 to 0x1c9aac, before the metadata clear (which zeroes the fade's flags) and the pan loop."

[[site]]
name = "dsp.voice.site.pan_pre.next"
cpu = "sharc"
devices = ["dn2"]
rule = { kind = "sharc_func", reloc_hash = "09fe195e8b260c0e03e917b6430ae3f7ccc952741729580632f7b97e3bc007cc", offset = 0xbc1, len = 4 }
mark = "D"
users = ["core/dsp-voice"]
doc = "DN2 1.12 0x1c9ab2, `M4 = 0x20`: the instruction after the hook site above; the hook runs the displaced MODE1 write and jumps here."

[[hook]]
name = "dsp.voice.hook.pan_pre"
site = "dsp.voice.site.pan_pre"
cpu = "sharc"
mode = "replace"
devices = ["dn2"]
regs = { in = ["r9", "r11", "i0", "i6", "m5", "m7", "m13"], clobbers = ["r0-r8", "r10", "r12-r15", "i1-i5", "astat"] }
mark = "D"
users = ["core/dsp-voice"]
doc = "R of each stamped slot through the engine's block ramp and fade; every other slot is untouched."

