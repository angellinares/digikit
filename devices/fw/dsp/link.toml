# link: the DSP side of the link
# Names follow <cpu>.<subsystem>.<kind>.<name>; was = former names, for reading older docs, never resolved (docs/design/firmware-decls.md).

# The second last instruction of the block handler's common tail, `DM(<ring toggle>) = R1`: every command path of the
# handler ends there, after the handler has built the record. The same relocation-insensitive hash on both devices.
[[site]]
name = "dsp.link.site.block_tail"
was = ["dl.dsp.block_tail"]
cpu = "sharc"
rule = { kind = "sharc_func", reloc_hash = "64b66b0db31c9fe533e67c75374b1041e22aae334bc3cd8743a491ab2448ecde", offset = 0xf4, len = 6 }
mark = "D"
users = ["core/dsp-link"]
doc = "The second last instruction of the DSP block handler's common tail, `DM(<ring toggle>) = R1`; every command path ends there after the record is built."

[[hook]]
name = "dsp.link.hook.block_tail"
site = "dsp.link.site.block_tail"
cpu = "sharc"
mode = "before"
regs = { in = ["i4", "i6"], clobbers = ["r10-r11", "r13-r15", "i2-i3", "i5", "astat"] }   # from the stub's "free" list; it saves r0, r3-r6, m5, m6, l2, l3
devices = ["dt2", "dn2"]
mark = "D"
users = ["core/dsp-link"]
doc = "Second last instruction of the block handler's common tail, after the record is built; the hook point for the code channel's receiver and acknowledgement."

[[fn]]
name = "dsp.link.fn.lp0_open"
cpu = "sharc"
devices = ["dn2"]
rule = { kind = "sharc_func", reloc_hash = "40e00ec6446327c2784bd7beb7652d454dd33a080823fa40617cc961222dfe4e", offset = 0x0, len = 6 }
mark = "D"
users = ["core/dsp-lp0-proof", "core/sample-pool"]
doc = "DN2 1.12 generic link-port open (finding 92): R4=0, R8=1, R12=aligned private state (128 bytes); stack state size and handle output. Requires task context and an unowned, inactive port before invocation."

