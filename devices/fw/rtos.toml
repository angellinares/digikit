# rtos: tasks, queues, mutexes, idle, interrupts, the reset and boot path
# Names follow <cpu>.<subsystem>.<kind>.<name>; was = former names, for reading older docs, never resolved (docs/design/firmware-decls.md).

[[fn]]
name = "cf.rtos.fn.create_main"
was = ["health.fw.create_main"]
cpu = "cf"
rule.dt2 = { kind = "cf_ptr", hash = "fc798b27d0ff965379f46717b367f05b", offset = 0x484, len = 4 }
rule.dn2 = { kind = "cf_ptr", hash = "ca0006cf073207083d26359db1321886", offset = 0x454, len = 4 }
mark = "D"
users = ["core/health"]
doc = "The function that creates the main-OS task, the target of the boot thread's last `jsr`; core/health calls it from its idle hook before it starts counting."

[[fn]]
name = "cf.rtos.fn.sleep_us"
cpu = "cf"
sig = "void (u32 us)"
devices = ["dn2"]
rule = { kind = "cf_func", hash = "113f4261cb994d31a918bb90032ffe45", offset = 0x0, len = 4 }
mark = "D"
users = ["core/sample-pool"]
doc = "DN2 1.12 stock short sleep (DT2 pair 0x40136544): locks its own mutex, loads timer DTIM1 (prescaler 0x84, about 1 MHz) with `us` and blocks the task on a semaphore until the timer interrupt. Task context only. Eight stock callers; the LP0 sender waits 100 after each page with it."

[[fn]]
name = "cf.rtos.fn.queue_pop"
was = ["dkrt.fw.queue_pop"]
cpu = "cf"
rule = { kind = "cf_func", hash = "5545f84fcc633b347034f629aa4858b9", offset = 0x0, len = 2 }
mark = "D"
users = ["core/runtime"]
doc = "The stock queue pop (blocking pend on the queue, returns the next item), the function the hook call goes to."

[[fn]]
name = "cf.rtos.fn.reset.init_calls"
was = ["cf.reset.init_calls", "cf.rtos.fn.reset_init_calls"]
cpu = "cf"
rule = { kind = "cf_reset_init_calls" }
mark = "D"
users = ["core/expansion"]
doc = "The reset code's two consecutive calls `jsr copy; jsr clear` (the .data copy and bss clear helpers, 8 bytes); core/expansion rewrites them to `jsr pk_loader.l; nop`."

# The firmware's default exception handler (the code every vector points at until a specific handler is installed; DT2 1.16 0x40001252, not a
# function of its own): `move #0x2700,sr; move.l sp,<save>; lea -16(sp),sp; movem.l d0-d1/a0-a1,(sp); movea.l <hook word>,a0; tst.l a0; beq +10;
# move.l <save>,-(sp); jsr (a0); ...; rte`. The anchor is the 4-byte literal of `movea.l (<hook word>).l,a0` (finding 37: the word holds the function
# that prints EXCEPTION and halts); the runtime points the word at its own hook, which records the fault and soft-resets (finding 46). The
# words are the code with the two address operands (they differ per firmware) and the `jsr`'s displaced bytes left open.
[[site]]
name = "cf.rtos.site.exc_hook_lit"
was = ["dkrt.fw.exc_hook_lit"]
bind = "static"
cpu = "cf"
rule = { kind = "cf_words", as = "code", words = [0x270023cf, "*", 0x4feffff0, 0x48d70303, "*", "*", 0x670a2f39, "*", 0x4e90588f, 0x4cd70303, 0x4fef0010], offset = 0x12, len = 4 }
mark = "D"
users = ["core/runtime"]
doc = "The firmware's default exception handler (the code every vector points at until a specific handler is installed; DT2 1.16 0x40001252, not a function of its own): `move #0x2700,sr; move.l sp,<save>; lea -16(sp),sp; movem.l d0-d1/a0-a1,(sp); movea.l <hook word>,a0; tst.l a0; beq +10; move.l <save>,-(sp); jsr (a0); ...; rte`."

# The boot thread: DT2 FUN_400cc864 (1.16; 1.17 0x400cc9c8), DN2 FUN_400cec98 (1.11; 1.12 0x400cedfc), the same code in both versions.
[[site]]
name = "cf.rtos.site.idle"
was = ["health.hook.idle"]
cpu = "cf"
rule.dt2 = { kind = "cf_func", hash = "fc798b27d0ff965379f46717b367f05b", offset = 0x482, len = 6 }
rule.dn2 = { kind = "cf_func", hash = "ca0006cf073207083d26359db1321886", offset = 0x452, len = 6 }
mark = "D"
users = ["core/health"]
doc = "The boot thread's last call, a 6-byte `jsr <create the main-OS task>`, after which the thread idles; core/health replaces it."

[[site]]
name = "cf.rtos.site.main_os_task"
was = ["cf.rtos.site.boot", "dkrt.hook.boot"]
cpu = "cf"
rule.dt2 = { kind = "cf_words", as = "code", words = ["*", 0xff5848d7, 0x3cfc49f9, "*", "*", "*", "*", 0x4e944e93, 0x2d40ff80, 0x4eb9400d], offset = 0x2, len = 8 }
rule.dn2 = { kind = "cf_words", as = "code", words = [0x4e56ff58, 0x48d73cfc, 0x45f94018, "*", "*", 0x4e924e93, 0x2d40ff80, 0x4eb9400d], offset = 0x0, len = 8 }
mark = "D"
users = ["core/runtime"]
doc = "The entry of the main-OS task (`link a6,#-0xa8; movem.l ...; ...; jsr (a4); jsr (a3); move.l d0,-0x80(a6); jsr <next singleton>`), found by the words of its first 28 bytes: Digitakt II (the entry is 2 mod 4: the first word of the row is half of the previous function) and Digitone II (4-aligned)."

[[value]]
name = "cf.rtos.value.reset.clear_helper"
was = ["cf.reset.clear_helper", "cf.rtos.value.reset_clear_helper"]
cpu = "cf"
rule = { kind = "cf_reset_helper", which = "clear" }
mark = "D"
users = ["core/expansion"]
doc = "Address of the reset code's bss clear helper, the second call of cf.rtos.fn.reset.init_calls; the expansion loader calls it after it copies its segments."

[[value]]
name = "cf.rtos.value.reset.copy_helper"
was = ["cf.reset.copy_helper", "cf.rtos.value.reset_copy_helper"]
cpu = "cf"
rule = { kind = "cf_reset_helper", which = "copy" }
mark = "D"
users = ["core/expansion"]
doc = "Address of the reset code's .data copy helper, the first call of cf.rtos.fn.reset.init_calls; the expansion loader calls it after it copies its segments."

[[hook]]
name = "cf.rtos.hook.main_os_task"
site = "cf.rtos.site.main_os_task"
cpu = "cf"
mode = "before"
regs = { in = [], clobbers = ["ccr"] }
handler = { sig = "void ()", args = [] }
devices = ["dt2", "dn2"]
mark = "D"
users = ["core/runtime"]
doc = "Entry of the main-OS task, before the task builds its singletons; the hook point for boot-time module loading."

[[hook]]
name = "cf.rtos.hook.idle"
site = "cf.rtos.site.idle"
cpu = "cf"
mode = "replace"
regs = { in = [], clobbers = [] }   # never continues into firmware code
devices = ["dt2", "dn2"]
mark = "D"
users = ["core/health"]
doc = "The boot thread's last call (create the main-OS task), after which the thread idles; the hook makes that call itself and then counts idle iterations forever."
