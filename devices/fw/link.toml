doc = "The stock block-frame driver, called by the block interrupt handler with `jsr abs.l` at +0x68; core/dsp-link keeps it as the stock sender."

# The firmware's own DSP block counter (finding 37, "Safe mode after the first UI pass"): the tail of the block interrupt handler (vector 191,
# the function core/dsp-link and core/health find by these hashes) adds the block to its clocks with `addq.l #1,<counter>` and nothing else
# touches the word, so it counts blocks (1500 per second) from boot. The anchor is the 4-byte address literal of that instruction
# (`52b9 <lit>`): offset 0x1654 in the Digitakt II function, 0x1d4e in the Digitone II one, the same in both versions of each.
[[site]]
name = "cf.link.site.block_isr.counter_lit"
was = ["cf.storage.site.block_counter_lit", "dkrt.fw.block_counter_lit"]
bind = "static"
cpu = "cf"
rule.dt2 = { kind = "cf_func", hash = "e17112316e2cef97a3ebdd4ec57cc849", offset = 0x1654, len = 4 }
rule.dn2 = { kind = "cf_func", hash = "f44b8037b4b199d47efc3899eb659b74", offset = 0x1d4e, len = 4 }
mark = "D"
users = ["core/runtime"]
doc = "The 4-byte address literal of `addq.l #1,<counter>` in the block interrupt handler's tail: the firmware's DSP block counter, 1500 per second from boot. core/runtime reads it."

# ColdFire anchors. The block-frame sender is an interrupt handler (finding 04: vector 191; DT2 vector_191_handler, DN2 the
# handler at 0x40025e36 in 1.11 and 1.12). It calls the stock driver with `jsr abs.l` at 104 bytes into the handler, in all
# four images; the driver is found by its masked hash, and the literal `lea <tx queue>,a0` inside it gives the queue's address.
# Digitakt II:
# Digitone II:
