name = "cf.link.fn.block_isr"
was = ["health.hook.block"]
cpu = "cf"
rule.dt2 = { kind = "cf_func", hash = "e17112316e2cef97a3ebdd4ec57cc849", offset = 0x0, len = 8 }
rule.dn2 = { kind = "cf_func", hash = "f44b8037b4b199d47efc3899eb659b74", offset = 0x0, len = 8 }
mark = "D"
users = ["core/health"]
doc = "The block interrupt handler (vector 191), found by the hashes of core/dsp-link. `cf.link.site.reply_copy_lit` is the literal of its first `pea` (the address of the record copy: the DSP's last reply, 0xabc bytes; its first word is the DSP's cycle count)."

[[fn]]
