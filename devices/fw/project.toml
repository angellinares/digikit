# The firmware's own per-track machine type, read through three accessors (the debug log's machine-change watch; they are the functions the hot-reload
# runtime used for "is this machine in use", tag digikit-hot-reload-v1): the Project singleton `Project *f(void)` (DT2 1.16 0x401988a2, DN2 1.11
# 0x4018a97a), the active kit of a project `Kit *f(Project *)`, and the machine type of a track of a kit `int f(Kit *, int track)` (-1: no such track).
# The kit and track functions have the same hash on both devices' versions; the Project getters differ per image.
[[fn]]
name = "cf.project.fn.singleton"
was = ["cf.project.fn.get", "dkrt.fw.project"]
cpu = "cf"
sig = "u32 ()"
rule.dt2 = { kind = "cf_func", hash = "ec70a039cd46fc8071a7e84112decfb1", offset = 0x0, len = 4 }
rule.dn2 = { kind = "cf_func", hash = "e722721313b9899418dac1e1d039205c", offset = 0x0, len = 4 }
mark = "D"
users = ["core/runtime"]
doc = "The Project singleton getter `Project *f(void)`; its code differs per image. core/runtime reads it for the machine-change watch."

