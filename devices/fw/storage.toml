[[fn]]
name = "cf.storage.fn.file.link"
cpu = "cf"
sig = "i32 (const u8 *old_path, const u8 *new_path)"
devices = ["dt2"]
rule = { kind = "cf_func", hash = "dd4ad82c45a9e99e488a59cac28ea00b", offset = 0x0, len = 4 }
mark = "D"
users = ["core/plusdrive-write"]
doc = "Add a second directory entry for an existing file (FUN_40156b00 with limit check 1; the sibling of file.rename that does not remove the old entry): the inode's link count goes 1 to 2 and is written through before the entry. 0 or -1. A name of a file whose count is 2 can be deleted with file.delete without freeing the data (finding 120). The adapter calls it only to make the two-names state for its power-cut test."

