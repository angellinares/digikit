[package]
name = "digiemu-desktop"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Local-only DN2 coupling: generated DSP code must never be distributed.
coupled-audio = ["digi-coupled/coupled-audio", "digi-control/coupled-audio"]
# Both devices' generated cores in one binary (SHARC_GEN_DIR and SHARC_GEN_DIR_2): a firmware of either device boots coupled.
second-core = ["coupled-audio", "digi-coupled/second-core"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.9.1", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
midir = "0.11"
elektron-native-boot = { path = "../../../packages/emulator/boot" }
emmc-card = { path = "../../../packages/emulator/card" }
digi-coupled = { path = "../../../packages/emulator/coupled" }
digi-control = { path = "../../../packages/emulator/control" }
device-profile = { path = "../../../packages/emulator/device-profile" }
patchkit = { path = "../../../packages/patchkit" }
dkmidi = { path = "../../../packages/dkmidi" }

[dev-dependencies]
sha2 = "0.10"
