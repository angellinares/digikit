# A power cut inside one sector write of the first writes to a blank card (docs/findings/46-digikit-debug.md, "Residual risk"). The claim
# writes header B, then header A. A torn header B (A blank) reads as a blank card, and the next upload claims it again. A torn header A
# with a whole header B reads as ours. A torn selection copy reads as blank. Only a torn header A with a blank header B leaves the card
# read-only: that needs the two claim writes to reach the card out of order.
[scenario]
name = "card-torn"
kind = "card"
devices = ["dt2", "dn2"]
tier = "quick"

[card]
part = "torn"
