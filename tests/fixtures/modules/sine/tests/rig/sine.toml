# test/sine on the SHARC-only rig (replaces tests/patchkit/test_sine.py). Every case also holds the implicit rules of the kit:
# every call returns, the context registers and the runtime guard are fine, the module writes only its own memory, the output is finite.

[[case]]
name = "follows note 12 within a cent"
device = ["dt2", "dn2"]
context = "friendly"

[[case.step]]
note = 12
vel = 100
params = { level = 0x7F00 }
blocks = 386

[[case.check]]
kind = "pitch-hz"
note = 12
cents = 1.0

[[case.check]]
kind = "peak"
min = 0.35
max = 0.40

