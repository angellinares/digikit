[[case]]
name = "tune shifts the pitch by semitones"
device = ["dt2"]
context = "friendly"

[[case.step]]
note = 60
vel = 100
params = { level = 0x7F00, tune = 0x4100 }
blocks = 101

[[case.check]]
kind = "pitch-hz"
note = 61
cents = 1.0

[[case]]
name = "level 0x3F80 halves the amplitude (dt2)"
device = ["dt2"]
context = "friendly"

[[case.step]]
note = 60
vel = 100
params = { level = 0x3F80 }
blocks = 101

[[case.check]]
# 100 / 127 * 0.5 = 0.3937 at full level: a ratio of 0.5 within 0.01 is 0.1929 to 0.2008
kind = "peak"
min = 0.1929
max = 0.2008

