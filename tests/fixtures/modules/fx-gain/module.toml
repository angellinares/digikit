[module]
id = "test/fx-gain"
version = "0.1.0"
name = "FX gain"
category = "test"
type = "fx"
author = "digikit"
status = "experimental"
summary = "Test effect of core/fx: scales the master block by 0.5, patched into the chain; for tests only."
ports = ["dt2-1.17", "dn2-1.12"]
requires = ["core/fx"]
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

[[object]]
path = "build/fx-gain-dsp.dko.json"
sources = ["src/dsp/fx_gain.s"]
place = "dsp.l2"

# One row in the chain of core/fx: the process routine, its dk_fx_desc and its state block (<dk/fx/fx.h>).
[[entry]]
registry = "fx"
id = "gain"
pc = "_fg_process"
desc = "_fg_desc"
state = "_fg_state"
