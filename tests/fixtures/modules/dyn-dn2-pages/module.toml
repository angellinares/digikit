[module]
id = "test/dyn-dn2-pages"
version = "0.1.0"
name = "DYN-DN2-PAGES"
category = "test"
type = "machine"
author = "digikit"
status = "experimental"
summary = "A Digitone II machine added at run time with two parameter pages (three and two parameters), to prove that the SYN key cycles the pages of a run-time machine."
dynamic = true
ports = ["dn2-1.12"]
requires = []
conflicts = []

[targets]
"dn2-1.12" = "experimental"

# Test fixture, derived from test/dyn-dn2 (which stays as it is: the dynreg Digitone II PCM pin depends on it). One machine of its own type (the runtime assigns the number)
# with two pages, declared by builder calls in init (src/module.c). The DSP is test/sine's, read from its folder; its symbols start with `sn`, so `dsp` names the prefix.
[[machine]]
id = "dyn_pages"
dsp = "sn"

[[object]]
path = "build/dyn-dn2-pages-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

[[object]]
path = "build/dyn-dn2-pages-dsp.dko.json"
sources = ["../sine/src/dsp/sine.s"]
place = "dsp.l2"

# `mise run module:check test/dyn-dn2-pages` rewrites this block. record_bytes is 124 + 80 for each parameter + 96 for each page (read off the other fixtures).
[uses.dn2]
machine_rows = 1
param_rows = 5
page_rows = 2
record_bytes = 716

[uses.dt2]
machine_rows = 8
param_rows = 16
page_rows = 0
record_bytes = 0
