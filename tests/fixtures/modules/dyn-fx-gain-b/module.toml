[module]
id = "test/dyn-fx-gain-b"
version = "0.1.0"
name = "FX gain B (run time)"
category = "test"
type = "fx"
author = "digikit"
status = "experimental"
summary = "Second test effect of the FX contract, loaded at run time on the Digitakt II: the same gain as test/dyn-fx-gain under another module id (so another effect ID) and with other defaults (GAIN 0.25, MIX 64), for the persistence scenario."
dynamic = true
ports = ["dt2-1.17", "dn2-1.12"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# `patchkit pack test/dyn-fx-gain-b --device dt2 -o fx-gain-b.dkm` makes the .dkm. The digikit runtime sends the DSP object to the DSP and
# publishes a free effect row of core/dynfx for the effect (state reserved behind the image, p0 at its default).
# The effect is declared by builder calls in init (src/module.c). The id `gain` is what the keys hash. The DSP is the one of test/dyn-fx-gain (symbols start with `dg`); this module is a second effect identity.
[[fx]]
id = "gain"
dsp = "dg"

[[object]]
path = "build/dyn-fx-gain-b-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

[[object]]
path = "build/dyn-fx-gain-b-dsp.dko.json"
sources = ["../dyn-fx-gain/src/dsp/dyn_fx_gain.s"]
place = "dsp.l2"
devices = ["dt2", "dn2"]

[uses.dt2]
machine_rows = 0
param_rows = 0
page_rows = 0
record_bytes = 436

[uses.dn2]
machine_rows = 0
param_rows = 0
page_rows = 0
record_bytes = 436
