# PLUCK on the Digitone II: the 5th entry of the machine list (before MIDI); YES commits type 9 (the audio mirror, SRAM
# 0x8000487c, first byte, after a TRIG); the SYN page is PLUCK's own page (DECAY, PICK, BRIGHT, COLOR on knobs B, C, E, F); a
# trig sounds (a plucked string) and encoder E (BRIGHT) changes the page.

[test]
name = "select_pluck_dn2"
devices = ["dn2"]
quick = true

[[step]]
wait_ms = 1500
[[step]]
tap = ["FUNC", "SRC"]
[[step]]
wait_ms = 300
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
expect_frame = "list"
[[step]]
tap = "YES"
[[step]]
wait_ms = 300
[[step]]
tap = "YES"
[[step]]
wait_ms = 300
[[step]]
tap = "SYN"
[[step]]
wait_ms = 400
[[step]]
expect_frame = "syn_page"
[[step]]
tap = "TRIG 1"
[[step]]
wait_ms = 500
[[step]]
expect_mem = { addr = 0x8000487c, mask = 0xff000000, eq = 0x9000000 }
[[step]]
expect_pcm_db = { min = -60, max = -3 }
[[step]]
expect_no_fault = true
[[step]]
turn = "ENC E"
by = 4
events = 30
[[step]]
wait_ms = 100
[[step]]
expect_frame = "bright_moved"
differs_from = "syn_page"
[[step]]
expect_no_fault = true
