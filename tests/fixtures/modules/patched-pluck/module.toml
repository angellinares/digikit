[module]
id = "test/patched-pluck"
version = "0.1.0"
name = "Pluck"
category = "machines"
type = "machine"
author = "digikit"
status = "experimental"
summary = "A plucked-string synth machine with decay, pick position, brightness and colour."
ports = ["dt2-1.17", "dn2-1.12"]
requires = ["core/dsp-voice", "core/machines", "core/params"]
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# A patched-in machine with plucked-string DSP, a copy of a run-time machine's source kept here so that this fixture reads nothing outside its folder: the same declaration,
# type 9 of core/machines. The DSP routines render the permanent type number of this machine, one body for both devices: a machine of
# the SDK contract (<dk/machine/machine.h>), `desc` holds its voices, state and clear bytes.
[[object]]
path = "build/pluck-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

[[object]]
path = "build/pluck-dsp.dko.json"
sources = ["src/dsp/pluck.s"]
place = "dsp.l2"
