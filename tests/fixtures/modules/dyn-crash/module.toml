[module]
id = "test/dyn-crash"
version = "0.1.0"
name = "Crashing module"
category = "test"
type = "raw"
author = "digikit"
status = "experimental"
summary = "Test fixture: the one fault injector. A store file sets what it does: an illegal instruction, a division by zero, a reset or a hang in the UI loop after a number of DSP blocks, a reset in init, or a fault in the boot animation callback (crash capture, safe mode)"
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# C. `init` reads the store file `cfg/crash-after.bin` (the format is in src/c/dyn_crash.c: delay, mode, place) and `tick` or the boot animation's
# frame callback faults as it says. Modes: illegal instruction, division by zero, reset, hang in the UI task, reset in `init`. Every test that uses
# it writes the file and asserts that the fault happened: without the file the module never faults.
[[object]]
path = "build/dyn-crash.dko.json"
sources = ["src/c/dyn_crash.c"]
place = "cf.expansion"
