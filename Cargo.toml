# One workspace for the native crates that build together, so they share a
# Cargo.lock, one set of profiles (cargo reads profiles only from the root)
# and, above all, one compiled copy of the ~80 MB generated core (sharc-gen)
# per target dir. See packages/emulator/README.md for the target-dir convention.
[workspace]
resolver = "3"
members = [
    "packages/emulator/boot",
    "packages/emulator/bootstrap",
    "packages/emulator/card",
    "packages/emulator/coldfire",
    "packages/emulator/control",
    "packages/emulator/coupled",
    "packages/emulator/device-profile",
    "packages/emulator/live",
    "packages/emulator/loader",
    "packages/emulator/machine",
    "packages/emulator/periph",
    "packages/emulator/plusdrive",
    "packages/emulator/sharc",
    "packages/emulator/sharc-2",
    "packages/emulator/sharc-fast-cl",
    "packages/emulator/sharc-fast-cl-2",
    "packages/emulator/sharc-fast-wasm",
    "packages/emulator/sharc-gen",
    "packages/emulator/sharc-gen-2",
    "packages/emulator/sharc-rt",
    "packages/emulator/sharc-stats",
    "packages/dkneeds",
    "packages/dkupload",
    "packages/dkmidi",
    "packages/dkbulk",
    "packages/dksample",
    # the digikit runtime's SDK (no_std): its tests run on the host
    "modules/core/runtime/sdk",
    "modules/core/runtime/fit",
    # host test harness for <dk/ui.h> (fake dk_ui_* calls, driver, C sample)
    "modules/core/adapters/ui/host",
    "modules/core/fw/rs",
    "packages/patchkit",
    "apps/desktop/src-tauri",
]
exclude = [
    # Agent worktrees live inside the main tree; keep cargo from treating
    # their (older, workspace-less) crates as members of this one.
    ".claude",
]

[workspace.package]
license = "AGPL-3.0-or-later"
repository = "https://github.com/ElekLabs/digikit"

# Timing and shipping profile. Matches what the desktop app has always been
# built with (default codegen units, unwinding panics): changing it moves the
# PGO baseline.
[profile.release]
opt-level = 3
debug = false
incremental = false

# The Selache assembler (patchkit's SHARC+ build) and the regex it shares with the guards run once per module build: size over speed, so the
# browser's patchkit.wasm stays small. Nothing of the emulator core is listed.
[profile.release.package.selas]
opt-level = "z"
[profile.release.package.selinstr]
opt-level = "z"
[profile.release.package.selelf]
opt-level = "z"
[profile.release.package.regex-lite]
opt-level = "z"

# No cheaper profile for correctness-only runs: measured on sharc-gen, an
# opt-level 1 override costs ~2.5x the CPU of release (wall 5.5 min vs 2.9 on
# the same loaded machine), and opt-level 0 compiles in ~1.4 min but runs the
# coupled_ready_exactness workload in 150 s instead of ~1.3 s (and needs
# RUST_MIN_STACK to avoid a stack overflow). Use release.
