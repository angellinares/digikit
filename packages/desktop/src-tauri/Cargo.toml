[package]
name = "digiemu-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[features]
diagnostics = ["elektron-native-boot/diagnostic-profile", "elektron-native-boot/diagnostic-events"]
# Local-only DN2 coupling: generated DSP code must never be distributed.
coupled-audio = ["elektron-native-boot/sharc", "elektron-native-boot/play", "dep:sharc-fast-cl"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.9.1", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
elektron-native-boot = { path = "../../../native/boot" }
emmc-card = { path = "../../../native/card" }
sharc-fast-cl = { path = "../../../native/sharc-fast-cl", optional = true }

[dev-dependencies]
sha2 = "0.10"
