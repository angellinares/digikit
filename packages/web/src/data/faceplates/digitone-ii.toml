# Front-panel drawing for Digitone II, read by emu/faceplate.py.
#
# Positions are centres in millimetres from the panel's top-left corner.
# Legends are the printed silkscreen; the firmware's own control names
# still come from its factory-test table (emu/symbols.py). `code` is the
# control code from ../digitone-ii.toml.

[faceplate]
device = "digitone-ii.toml"
width = 215.0
height = 176.0
accent = "#6fc7d1"
func_legend = "#2f7f88"
wordmark = "Digiemu"

[display]
bezel = [31.1, 21.7, 105.0, 72.9]
glass = [37.5, 28.3, 98.8, 62.0]
wordmark = [37.3, 67.6]

[leds]
x = [186.0, 192.0, 197.9, 203.9]
y = [96.0, 101.9]
r = 1.5

[controls]
screws = [
  { x = 9.7, y = 5.0 },
  { x = 100.3, y = 5.0 },
  { x = 205.1, y = 5.0 },
  { x = 10.0, y = 171.0 },
  { x = 116.3, y = 170.4 },
  { x = 205.1, y = 171.0 },
]
# style: jack (connector labels), label, sub (accent), dim, icon
