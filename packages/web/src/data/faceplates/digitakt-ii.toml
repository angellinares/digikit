# Front-panel drawing for Digitakt II, read by emu/faceplate.py.
#
# Positions are centres in millimetres from the panel's top-left corner.
# Legends are the printed silkscreen; the firmware's own control names
# still come from its factory-test table (emu/symbols.py). `code` is the
# control code from ../digitakt-ii.toml.

[faceplate]
device = "digitakt-ii.toml"
width = 215.0
height = 176.0
accent = "#f3b52c"
func_legend = "#9c6f0c"
wordmark = "Digiemu"

[display]
bezel = [31.0, 21.7, 104.9, 73.1]
glass = [39.4, 28.3, 98.6, 60.6]
wordmark = [37.4, 67.6]

[leds]
x = [186.0, 192.0, 198.1, 204.1]
y = [96.0, 102.0]
r = 1.5

[controls]
screws = [
  { x = 9.8, y = 5.0 },
  { x = 99.8, y = 5.0 },
  { x = 205.0, y = 5.0 },
  { x = 9.8, y = 170.9 },
  { x = 100.3, y = 170.9 },
  { x = 205.0, y = 170.9 },
]
# style: jack (connector labels), label, sub (accent), dim, icon
