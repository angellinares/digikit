[package]
name = "patchkit"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Firmware modules for Digitakt II and Digitone II: port lockfiles, linker, patch apply, verify"

[lib]
name = "patchkit"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "patchkit"
path = "src/main.rs"

# The patch-time tool: no generated SHARC core, no toolchain. Builds in seconds and for wasm32.
[dependencies]
dt2-firmware-loader = { path = "../emulator/loader" }
coldfire = { path = "../emulator/coldfire" }
dkneeds = { path = "../dkneeds" }
dkupload = { path = "../dkupload" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9.12"
# `patchkit build`: reads the ELF objects of the ColdFire toolchain. Read-only, no_std features: builds for wasm32.
object = { version = "0.37", default-features = false, features = ["read_core", "elf"] }
# `patchkit build` for SHARC+: the public Selache assembler as a library, at the commit tools/patchkit/pk_toolchains.py pins
# (SELACHE_REV; a test keeps the two equal). Pure Rust, std only: builds for wasm32.
selas = { git = "https://github.com/ElekLabs/selache", rev = "02d6d785b8e3a125ab237a00bb89503aff835f5d" }
selelf = { git = "https://github.com/ElekLabs/selache", rev = "02d6d785b8e3a125ab237a00bb89503aff835f5d" }
selinstr = { git = "https://github.com/ElekLabs/selache", rev = "02d6d785b8e3a125ab237a00bb89503aff835f5d" }
# The instruction decoder of the SHARC+ runtime (public ISA table): the re-decode of every assembled instruction. No dependencies.
sharc-rt = { path = "../emulator/sharc-rt" }
regex-lite = "0.1"
# The settings record's decoder (the code the runtime uses); no_std, builds for every target.
dkrt-sdk = { path = "../../modules/core/runtime/sdk" }
# The fit rule (the code the DIGIKIT menu runs); no_std, builds for every target.
dkrt-fit = { path = "../../modules/core/runtime/fit" }

# `patchkit store dump` reads card images, `patchkit flash` sends to a MIDI port: the binary only (not wasm32).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
midir = "0.11"
plusdrive-format = { path = "../emulator/plusdrive" }
emmc-card = { path = "../emulator/card" }

[dev-dependencies]
machine = { path = "../emulator/machine" }
