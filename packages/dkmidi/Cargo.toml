[package]
name = "dkmidi"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "A real MIDI port for the digikit SysEx protocol: shared by the desktop workbench and the dkmidi stdin/stdout bridge"

[lib]
name = "dkmidi"
path = "src/lib.rs"

[[bin]]
name = "dkmidi"
path = "src/main.rs"

[dependencies]
midir = "0.11"
