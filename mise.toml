# Toolchains for the native SHARC core (native/). Python stays on uv.
# Tasks are in mise-tasks.toml. Task groups: setup, workbench and emu:*, ui:*, web:*, wasm:*, scenario:*, check:*, clean:*, test:*, lint:*,
# perf:*, gen:*, dev:*, module:*, patch:*, dk:*. `mise run TASK -- --help` prints a tool's options.

[settings]
activate_aggressive = true

[tools]
rust = "1.98.1"
node = "24.15.0"
pnpm = "12.8.2"
"aqua:WebAssembly/binaryen" = "version_133"
wasm-tools = "1.261.0"
"github:mstange/samply" = "samply-v0.13.1"
"github:nextest-rs/nextest" = "cargo-nextest-0.9.144"

[task_config]
includes = ["mise-tasks.toml"]
