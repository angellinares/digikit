# The module contract: version numbers, log kinds and the SysEx protocol numbers. `patchkit gen` writes
# modules/core/runtime/sdk/src/gen_sdk.rs, tools/device/dklog_kinds.py, tools/device/dkproto.py and
# packages/dkupload/src/gen_proto.rs, packages/dk-session/src/gen_proto.ts, sdk/asm/dk_machine.inc, sdk/asm/dk_fx.inc,
# sdk/include/dk/gen/machine_consts.h, fx_consts.h, machine.h, fx.h and api.h from this file (`patchkit gen --check` fails when they are stale).

[runtime]           # the digikit runtime release (semantic version; packed major<<16 | minor<<8 | patch)
version = "0.5.9"   # 0.x: MINOR may break (contract major, store format, SysEx protocol), PATCH = features and fixes

[contract]          # [major, minor] per contract (docs/design/module-sdk.md 11.5 D3). The runtime refuses a module that declares a
                    # contract (major != 0) when its major differs from the runtime's or its minor is above the runtime's. Major 0 = not implemented.
                    # An appended Api function is a minor bump; a changed or removed one is a major bump.
api = [1, 10]       # the ColdFire Api table (every module, `raw` included); minor 10: file_create/write/close/abort/delete (store files), io_post/io_cancel/io_wake (the I/O task), hash32_init/update/finish; minor 9: settings_client/get/put/remove (module settings), intro_take (boot animation); minor 1: `log_lv` appended; minor 2: `register_cmds` appended; minor 3: sample bank API appended; minor 4: read-only listing; minor 5: stereo sample pool (per module, 16 entries); minor 6: sample_pool_path/param_get/param_set/sample_pool_set; minor 7: sample_pool_peaks; minor 8: job_post/job_cancel (background jobs)
machine = [1, 6]    # minor 1: source track; 2: stereo; 3: executable parameter latches; 4: opt-in native callback page v1; 5: two replacement callback pages v2; 6: note gate appended to voice_in (DK_MACHINE_GATE); voice states start zeroed after a load
fx = [1, 0]         # run-time effects (sdk/include/dk/gen/fx.h, DSP section version 4 of a .dkm); 0.4.0; effect pages (register kind 4) 0.5.0
service = [1, 0]

# The table a .dkm module gets in dkm_init (`patchkit gen` writes the Rust `Api` in gen_sdk.rs and sdk/include/dk/gen/api.h from it). Fields are only
# appended, each is 4 bytes; a new field is a minor bump of `[contract] api` and gets `since` = that minor. `type` is `u32`, `addr` (the
# address of a helper: usize in Rust, `<name>_addr` in C) or a function signature `<ret> (<type> <name>, ...)` with the types u8 u16 u32
# i8 i16 i32 bool void char float, pointers, `const` and the names of [api.types].
[api]
fields = [
    { name = "version", type = "u32", doc = "Version of the `Api` table layout (`API_VERSION`)." },
    { name = "size", type = "u32", doc = "`size_of::<Api>()` in the runtime that built it." },
    { name = "device", type = "u32", doc = "The device's `[digikit] id`." },
    { name = "runtime", type = "u32", doc = "The runtime version, packed major << 16 | minor << 8 | patch." },
    { name = "import", type = "u32 (const u8 *name)", doc = "Address of a firmware function or runtime helper by name (NUL-terminated); 0 when the image has none." },
    { name = "alloc", type = "u8 *(u32 size)", doc = "16-byte aligned block from the module arena (zero is not guaranteed); null when full." },
    { name = "free", type = "void (u8 *p)", doc = "Give back a block of `alloc`." },
    { name = "store_read", type = "i32 (const u8 *path, u8 *dst, u32 cap)", doc = "Read a store file into `dst` (at most `cap` bytes); returns the file size, or a negative code." },
    { name = "log", type = "void (const u8 *msg, u32 value)", doc = "Append `msg` (NUL-terminated, 24 bytes kept) and `value` to the runtime's log ring." },
    { name = "memcpy", type = "addr", doc = "Address of the runtime's memcpy." },
    { name = "memset", type = "addr", doc = "Address of the runtime's memset." },
    { name = "memcmp", type = "addr", doc = "Address of the runtime's memcmp." },
    { name = "muldi3", type = "addr", doc = "Address of the runtime's __muldi3." },
    { name = "udivdi3", type = "addr", doc = "Address of the runtime's __udivdi3." },
    { name = "umoddi3", type = "addr", doc = "Address of the runtime's __umoddi3." },
    { name = "log_lv", type = "void (u32 level, const u8 *msg, u32 value)", doc = "Like `log`, with a level: 0 error, 1 warn, 2 info, 3 debug, 4 trace (above 4: 4).", since = 1 },
    { name = "register_cmds", type = "i32 (u32 first, u32 count, service_cmd handler)", doc = "Register the SysEx commands `first .. first + count` with `handler` (docs/design/module-sdk.md, \"Service commands\"). The range must lie inside one of the ranges sdk/sdk.toml `[protocol.ranges]` reserves and overlap no registered one; else it returns `proto::E_CMD_RANGE`. Call it from `init`; the range is released when the module's `fini` has run. Returns 0.", since = 2 },
    { name = "sample_bank", type = "i32 (u32 local_id)", doc = "In init, resolve the module-owned sample bank to a positive opaque handle, or a negative DK_SAMPLE_E_* error.", since = 3 },
    { name = "sample_load", type = "i32 (u32 handle, const u8 *path)", doc = "Queue one load from a NUL-terminated device sample path using a handle resolved in init. May be called from init or a service callback; copies the path without file IO. Returns 0 or a negative DK_SAMPLE_E_* error. The bank is retained once delivery starts.", since = 3 },
    { name = "sample_status", type = "i32 (u32 handle)", doc = "Return DK_SAMPLE_UNUSED, QUEUED, LOADING, READY or a negative DK_SAMPLE_E_* error.", since = 3 },
    { name = "files_client", type = "i32 ()", doc = "Init-only: acquire this module's listing client; positive handle or negative error. Retired before teardown/failed-init free.", since = 4 },
    { name = "files_list", type = "i32 (u32 client, u32 root, const u8 *path, file_event notify, u8 *context)", doc = "Copy a canonical root-relative directory request; positive ticket or negative error. Supersedes prior results. Optional deferred UI-task notify/context remain module-owned until retirement quiesces. No I/O here.", since = 4 },
    { name = "files_poll", type = "i32 (u32 client, u32 ticket, u8 *out, u32 capacity)", doc = "No I/O: 0 pending, 1 copied 304-byte dk_file_entry, 2 end, negative error. Validate output/capacity before consumption; output unchanged unless 1. Stored metadata is not content validation or a lease.", since = 4 },
    { name = "files_cancel", type = "i32 (u32 client, u32 ticket)", doc = "Invalidate matching request/results/queued notification without waiting for active work or callback. Does not free the module-owned client.", since = 4 },
    { name = "sample_tracks", type = "i32 (u32 local_id)", doc = "In init, resolve the module's 16-entry sample pool table (DK_SAMPLE_TRACKS) to a positive opaque handle, or a negative DK_SAMPLE_E_* error. A module that also declares a bank gets DK_SAMPLE_E_CONTRACT.", since = 5 },
    { name = "sample_pool_add", type = "i32 (u32 handle, const u8 *path)", doc = "Add a stereo-capable sample file to the module's 16-entry pool (copies the path, no file IO here; the load runs later). Returns the pool index 0..15: the first free entry, or the entry that already holds this path (a file added twice is one entry; one with a sticky error is selected again). Indexes are stable: clearing an entry leaves a hole and never moves another. DK_SAMPLE_E_POOL when all 16 are in use (-16); DK_SAMPLE_E_SEL_PATH for an empty or too long path; no sample backing in the image: DK_SAMPLE_E_CONTRACT.", since = 5 },
    { name = "sample_pool_clear", type = "i32 (u32 handle, u32 index)", doc = "Close the entry's generation (its notes end), drop its reference and set it UNUSED, a hole in the pool. Returns 0 or a negative DK_SAMPLE_E_* error (index >= 16: DK_SAMPLE_E_CONTRACT).", since = 5 },
    { name = "sample_pool_status", type = "i32 (u32 handle, u32 index)", doc = "Return DK_SAMPLE_UNUSED, QUEUED, LOADING, READY or a negative DK_SAMPLE_E_* error; an error is sticky until the entry is added again or cleared.", since = 5 },
    { name = "sample_pool_info", type = "i32 (u32 handle, u32 index, u8 *out)", doc = "Copy a 16-byte dk_sample_info (frames, rate, channels, token; <dk/sample_track.h>) of a READY entry; otherwise a negative error and `out` is untouched.", since = 5 },
    { name = "sample_pool_path", type = "i32 (u32 handle, u32 index, u8 *buf, u32 cap)", doc = "Copy the root-relative path (as a DK_FILES_SAMPLES listing row gives it, NUL-terminated) of the entry into `buf` and return its length without the NUL. Works in every state except UNUSED (E_NOT_FOUND), so a sticky error still names its file. `cap` too small (length + 1 does not fit): DK_SAMPLE_E_SEL_PATH and `buf` is untouched.", since = 6 },
    { name = "param_get", type = "i32 (u32 track, u32 word)", doc = "Raw value (unit * 256, as DK_PARAM min/max/default) of parameter word `word` of the calling module on `track` (0 to 15). UI task only, and only in the flow of a click: from the DK_PARAM_ACTION callback until the page gets its next key or turn (so a list the callback opened may call it), else DK_PARAM_E_STATE. `word` counts the module's DK_PARAM rows in declaration order; a word the module does not own or a track above 15 is DK_PARAM_E_ARG. The value is the one the page shows.", since = 6 },
    { name = "param_set", type = "i32 (u32 track, u32 word, i32 raw)", doc = "Set parameter word `word` of the calling module on `track` to `raw` (unit * 256) with the stock setter of a knob turn: clamped to the row range, stored in the sound, observers notified. UI task only, in the same click flow as param_get. Returns 0, DK_PARAM_E_STATE (outside the flow), DK_PARAM_E_ARG (word or track) or DK_PARAM_E_HELD (a mode key such as TRIG or FUNC is held: nothing is written, so a click never records a p-lock).", since = 6 },
    { name = "sample_pool_set", type = "i32 (u32 handle, u32 index, const u8 *path)", doc = "Load a sample file into pool entry `index` (0..15), replacing what was there: the old file is released, the new one queues like sample_pool_add (copies the path, no file IO here). Other indexes never move. A file already held by another entry is shared, not loaded twice. Returns 0; DK_SAMPLE_E_CONTRACT for an index above 15 or no sample backing in the image; DK_SAMPLE_E_SEL_PATH for an empty or too long path.", since = 6 },
    { name = "sample_pool_peaks", type = "i32 (u32 handle, u32 index, u32 token, u8 *out, u32 capacity)", doc = "Copy bounded PCM16 min/max overview pairs of a READY pool entry matching token. Returns bin count (1..512), negative error otherwise; capacity is bytes, output unchanged on refusal. Each bin spans ceil(frames/512) frames, combines channels and includes zero. No file IO or PCM scan. UI task only. See dk/sample_track.h.", since = 7 },
    { name = "job_post", type = "i32 (job_step step, job_done done, u8 *ctx)", doc = "Run `step(ctx)` on the background worker until it returns 0 or a negative error (DK_JOB_MORE: call again; <dk/job.h>). `done(ctx, status)` is called once in the UI task with the final status, or DK_JOB_E_CANCELLED. Returns a job id > 0, or a negative error (E_BUSY when 8 jobs are queued, E_CONTRACT for a null step).", since = 8 },
    { name = "job_cancel", type = "i32 (u32 id)", doc = "Cancel a job of this module: a queued job never runs and a running one stops after its current step; `done` gets DK_JOB_E_CANCELLED. Returns 0, or E_NOT_FOUND for an unknown id.", since = 8 },
    { name = "sample_pool_peaks_window", type = "i32 (u32 handle, u32 index, u32 token, u32 first, u32 frames, u32 columns, u8 *out, u32 capacity)", doc = "Min/max of `columns` equal parts of the frames [first, first + frames) of a READY pool entry matching token, computed in the background. Returns `columns` when ready (out holds int16 min, max pairs; capacity is bytes, at least columns * 4; columns is 1..DK_SAMPLE_WINDOW_MAX), 0 while it is computed, or a negative error. Another request replaces a pending one. Poll from the draw callback. UI task only. See dk/sample_track.h.", since = 8 },
    { name = "settings_client", type = "i32 ()", doc = "Init-only: acquire this module's settings handle; positive handle, or a negative error outside `dkm_init`. The same module always gets the same handle.", since = 9 },
    { name = "settings_get", type = "i32 (u32 client, const char *key, void *out, u32 cap)", doc = "Read the value of `key` (NUL-terminated, own key space) into `out` (`cap` bytes): returns its length (0 is valid), E_SET_NOKEY when there is none, E_SET_VALUE when `cap` is too small (nothing is written), E_SET_KEY for a stale handle or a bad key, E_SET_OFF when the settings store is off. In `dkm_init` and in the UI task.", since = 9 },
    { name = "settings_put", type = "i32 (u32 client, const char *key, const void *value, u32 len)", doc = "Set `key` to the `len` bytes (0 to 1024) at `value`; the card is written 2 s after the last change. Returns 0, E_SET_KEY (stale handle or bad key), E_SET_VALUE, E_SET_FULL or E_SET_OFF. The runtime stores the key as `<module name>/<key>`; the module name and the key together are at most 47 characters. UI task only, not a service command handler.", since = 9 },
    { name = "settings_remove", type = "i32 (u32 client, const char *key)", doc = "Remove `key`: returns 0 (also when it was not there), E_SET_KEY (stale handle or bad key) or E_SET_OFF. UI task only, not a service command handler.", since = 9 },
    { name = "intro_take", type = "i32 (intro_frame frame, intro_done done, void *ctx, u32 ticks)", doc = "Init-only: replace the stock boot animation. `frame(tick, ctx)` returns the 1024-byte native bitmap of tick 0 .. ticks-1 (30 ticks a second), or NULL to end the animation (the last frame stays); it runs on the intro task, must not block and must not call any dk_api function. `done(ctx)` (may be NULL) runs once in the UI task at the first UI pass: free the buffer there. `ticks` is 1 to 300. Returns 0, E_NOT_FOUND outside `dkm_init`, E_CONTRACT (no frame, bad ticks), E_BUSY (taken already) or E_BOOT_ONLY (the intro is over). See dk/intro.h.", since = 9 },
    { name = "file_create", type = "i32 (u32 root, const char *path, u32 size, const u8 *hash4, u32 flags)", doc = "I/O step only (E_CONTEXT in any other task, including a module's code running in the UI or MIDI task while a step waits): open the one write session for the file `path` of `size` bytes under `root` (DK_FILES_STORE; DK_FILES_SAMPLES is the store's samples/ folder on the Digitone II and the stock +Drive on the Digitakt II, which needs core/plusdrive-write: E_CONTRACT without it). `hash4`: NULL, or the expected file hash (`hash|1`, 4 bytes big-endian: dk/hash32.h); file_close then checks it. `flags`: 0 or DK_FILE_REPLACE (1). Without DK_FILE_REPLACE an existing file is E_EXISTS. With it the old file stays readable until file_close swaps in the new one (a power cut or file_abort leaves the old file); E_FILE_IN_USE while a reader still reads the old file. Returns a handle > 0 owned by this module, or E_BUSY (a write session is open, or the store stayed in use for about 3 s: try again). A session with no write for 20 s is aborted by the runtime, E_PATH, E_FULL, E_NOSTORE, E_INUSE, E_WRITE. See dk/file.h.", since = 10 },
    { name = "file_write", type = "i32 (i32 h, u32 offset, const u8 *buf, u32 len)", doc = "I/O step only: write `len` bytes at `offset`, the next byte of the file. `buf` is 16-byte aligned; `len` a multiple of 512 except for the last piece of the file (the tail sector is padded with zeros). Any length: it is split into 32 KiB writes. Returns 0, E_STATE (no such session), E_OFFSET, E_LENGTH (past `size`, or a short piece before the end), E_WRITE, E_CONTRACT (unaligned buf), or E_BUSY (the store stayed in use for about 3 s: nothing of this call was written; call again). The store lock is held for the whole call, so once a piece is written E_BUSY is never returned.", since = 10 },
    { name = "file_close", type = "i32 (i32 h, u8 *hash_out)", doc = "I/O step only: end the file. All `size` bytes must have been written (E_LENGTH) and match `hash4` when it was given (E_HASH); the table is committed (power-cut safe). `hash_out` (4 bytes, may be NULL) gets the file hash of the bytes written, checks or not. The session is closed whatever the result, except for E_BUSY (try again). Returns 0 or a status.", since = 10 },
    { name = "file_abort", type = "i32 (i32 h)", doc = "I/O step only: drop the session and the partial file (it was never in the table). Returns 0 or E_STATE.", since = 10 },
    { name = "file_delete", type = "i32 (u32 root, const char *path)", doc = "I/O step only: remove a file or folder entry. Returns 0, E_NOFILE, E_FILE_IN_USE (a reader, such as the sample pool loading it, still reads the file: try again later), E_BUSY (a write session is open, or the store is in use) or a path or store status.", since = 10 },
    { name = "io_post", type = "i32 (io_step step, io_done done, u8 *ctx)", doc = "Run `step(ctx)` on the runtime's I/O task (priority 3, its own stack; <dk/io.h>). The step may block and call file_*. It returns DK_IO_MORE (run again), DK_IO_WAIT (sleep until io_wake), 0 (done) or a negative error. `done(ctx, status)` runs once in the UI task. Task context only (not an ISR). Returns a job id > 0, E_CONTRACT (no step) or E_BUSY (8 jobs).", since = 10 },
    { name = "io_cancel", type = "i32 (i32 id)", doc = "Cancel a job of this module: a queued job never runs, a running one stops after its step returns; `done` gets DK_IO_E_CANCELLED. Returns 0 or E_NOT_FOUND.", since = 10 },
    { name = "io_wake", type = "void (i32 id)", doc = "Wake a job whose step returned DK_IO_WAIT. Callable from an interrupt handler, an adapter or any task. Unknown ids are ignored.", since = 10 },
    { name = "hash32_init", type = "void (u8 *state)", doc = "Start the file hash (the Elektron +Drive content hash, dk/hash32.h) in the caller's 28-byte `dk_hash32`.", since = 10 },
    { name = "hash32_update", type = "void (u8 *state, const u8 *p, u32 n)", doc = "Feed `n` bytes.", since = 10 },
    { name = "hash32_finish", type = "u32 (u8 *state)", doc = "The file hash `hash|1`: the value the store keeps (4 bytes big-endian in a table slot). The state is spent.", since = 10 },
]

# Function types by name. As a parameter or field a name is a nullable pointer to the function (`Option<ServiceCmd>` in Rust, `dk_service_cmd *` in C).
[api.types]
# A service command handler (`Api.register_cmds`). It runs in the firmware's MIDI task: short, no waiting. `body` is the request body
# (`len` bytes, at most 160); the reply body goes to `out` (at most 879 bytes). Returns the number of reply bytes (0 or more: status ok), or a
# negative status (a `proto::E_*` code or its own: sent as the reply's status with no body).
service_cmd = "i32 (u32 cmd, u32 seq, const u8 *body, u32 len, u8 *out)"
file_event = "void (u32 client, u32 request, i32 state, u8 *context)"
# A background job step (`Api.job_post`). It runs in the worker task: it computes on its own memory and calls no dk_api function.
# Returns DK_JOB_MORE (1) to be called again, 0 when finished, or a negative error.
job_step = "i32 (u8 *ctx)"
# The end of a background job, in the UI task, once. `status` is the last step's result, or DK_JOB_E_CANCELLED.
job_done = "void (u8 *ctx, i32 status)"
# One frame of a boot animation (`Api.intro_take`), on the intro task: the 1024-byte native bitmap of `tick`, or NULL to end the animation. No dk_api calls.
intro_frame = "const u8 *(u32 tick, void *ctx)"
# The end of a boot animation, in the UI task, once, at the first UI pass.
intro_done = "void (void *ctx)"
# A step of an I/O job (`Api.io_post`), in the runtime's I/O task: it may block and call file_*. Returns DK_IO_MORE (1), DK_IO_WAIT (2), 0 or a negative error.
io_step = "i32 (u8 *ctx)"
# The end of an I/O job, in the UI task, once. `status` is the last step's result, or DK_IO_E_CANCELLED.
io_done = "void (u8 *ctx, i32 status)"

# The machine contract's numbers (sdk/include/dk/gen/machine.h is the generated C view; it includes the generated sdk/include/dk/gen/machine_consts.h).
# `patchkit gen` writes sdk/asm/dk_machine.inc and sdk/include/dk/gen/machine_consts.h from this table: the constants, then the byte and word offsets of the fields (all 4 bytes).
[machine]
consts = [
    { name = "DK_MACHINE_V1", value = 1, doc = "Contract version." },
    { name = "DK_BLOCK", value = 32, doc = "Samples per call, 48 kHz, both devices." },
    { name = "DK_MAX_PARAMS", value = 8, doc = "Hard cap (the device profile gives the real maximum)." },
    { name = "DK_MAX_VOICES", value = 16, doc = "Voices a machine runs at once on any device." },
    { name = "DK_OK", value = 0, doc = "Returned by render: block written, voice continues." },
    { name = "DK_DONE", value = 1, doc = "Returned by render: block written (may be silence), voice has ended." },
    { name = "DK_STEREO", value = 2, doc = "Or-ed into the status of render by a stereo machine (contract 1.2): `out_r` was written this block. DK_OK | DK_STEREO and DK_DONE | DK_STEREO. Without it the adapter treats the block as mono (L copied to R)." },
    { name = "DK_MACHINE_STEREO", value = 256, doc = "Or-ed into dk_machine_desc.contract by a stereo machine (contract 1.2): the major number is the low byte (DK_MACHINE_V1)." },
    { name = "DK_MACHINE_GATE", value = 512, doc = "Or-ed into dk_machine_desc.contract by a machine that reads `gate` in dk_voice_in (contract 1.6)." },
    { name = "DK_P_PERCENT", value = 0, doc = "Word 0 .. 0x7f00, UI 0 .. 127." },
    { name = "DK_P_BIPOLAR", value = 1, doc = "0x4000 at rest, UI -64 .. +63." },
    { name = "DK_P_ENUM", value = 2, doc = "n steps, word = step * 256." },
    { name = "DK_P_PITCH", value = 3, doc = "Semitone offset, 0x4000 at rest, the adapter adds it to `pitch`." },
    { name = "DK_LEVEL_BOUND_BITS", value = 1090519040, doc = "|sample| above DK_LEVEL_BOUND is a fault (+18 dB over full scale)." },  # 8.0f
    { name = "DK_MAGIC", value = 1145785665, doc = "'DKMA', the first word of dk_machine_desc." },             # 'DKMA' = 0x444b4d41
]
voice_in = ["pitch", "velocity", "block", "out", "track", "out_r", "gate"]           # struct dk_voice_in, DK_IN_*
desc = [
    "magic", "contract", "n_params", "voices", "state_bytes",
    "state_clear_bytes", "max_cycles_block", "max_cycles_note_on", "max_call_depth", "stack_bytes",
]                                                          # struct dk_machine_desc, DK_DESC_*

# The typed C view that `patchkit gen` writes sdk/include/dk/gen/machine.h from: `"<type> <name> // doc"` per field (4 bytes each; the names must equal
# `voice_in` and `desc` above, in order) and `"<ret> <name>(<args>) // doc"` per entry point. Types: u32 i32 float, pointers, `const`.
[machine.c]
intro = '''The numbers are in sdk/sdk.toml [machine], from which `patchkit gen` writes sdk/include/dk/gen/machine_consts.h (included here) and
   sdk/asm/dk_machine.inc for assembly. Each constant is documented in the consts header.'''
desc_doc = "One per module in read-only data, found by the manifest's symbol. No function pointers: the manifest names the entry symbols."
rules = '''Entry points (symbols named in the manifest). SHARC+ assembly, v1: the adapter enters with `I13 = return address;
   JUMP (M13, I12)` and the module returns with `JUMP (M13, I13)`. Arguments R4 = state, R8 = in, R12 = params; result R0.
   May clobber R0-R15, I0-I5, M1-M4, B3; must keep I6-I15, M0, M5-M15, L0-L7, MODE1.'''
voice_in = [
    "i32 pitch // semitones << 8 (MIDI note 60 = 60 << 8), the device's tune added",
    "i32 velocity // 0 .. 127 << 8",
    "u32 block // blocks since note-on, 0 on the note-on block",
    "float *out // render writes DK_BLOCK floats here",
    "u32 track // source track 0 .. 15, latched at note_on; machine contract 1.1",
    "float *out_r // machine contract 1.2: a stereo machine writes the right channel, DK_BLOCK floats, and returns DK_STEREO; a mono machine never touches it",
    "u32 gate // machine contract 1.6, read only by a machine that sets DK_MACHINE_GATE: 1 from the note-on until the note is released, then 0 (Digitakt II; Digitone II: always 1)",
]
desc = [
    "u32 magic // DK_MAGIC",
    "u32 contract // DK_MACHINE_V1 (low byte); a stereo machine (contract 1.2) or-s in DK_MACHINE_STEREO; a machine that reads `gate` (contract 1.6) or-s in DK_MACHINE_GATE",
    "u32 n_params // 0 .. DK_MAX_PARAMS, the manifest's `params` order",
    "u32 voices // 1 .. DK_MAX_VOICES the module supports",
    "u32 state_bytes // per voice, a multiple of 4; a voice's state is zeroed when its track first plays a note after the module loads (contract 1.6), then only state_clear_bytes at each note-on",
    "u32 state_clear_bytes // leading bytes zeroed at note-on, <= state_bytes",
    "u32 max_cycles_block // worst-case instructions of one render call",
    "u32 max_cycles_note_on // the same for the note-on block (note_on + render)",
    "u32 max_call_depth // nested CALLs the module uses",
    "u32 stack_bytes // data stack the module uses",
]
fns = [
    "i32 note_on(void *state, const dk_voice_in *in, const i32 *params) // At note-on, after `state_clear_bytes` are zeroed; no sound. params: DK_MAX_PARAMS words. Returns 0, or a negative number (a fault). Entered with I13 = return address (R4 state, R8 in, R12 params; result R0).",
    "i32 render(void *state, const dk_voice_in *in, const i32 *params) // Once per block while the voice runs, including the note-on block after note_on. Writes DK_BLOCK floats to in->out. params: DK_MAX_PARAMS words; DK_PARAM_LATCHED words retain the effective clamped note_on value, all other words are live. Returns dk_status.",
]

# The FX contract's numbers (sdk/include/dk/gen/fx.h is the generated C view; it includes the generated sdk/include/dk/gen/fx_consts.h).
# `patchkit gen` writes sdk/asm/dk_fx.inc and sdk/include/dk/gen/fx_consts.h from this table. Do not include it together with dk_machine.inc (DK_BLOCK and DK_LEVEL_BOUND_BITS are in both).
[fx]
consts = [
    { name = "DK_FX_V1", value = 1, doc = "Contract version." },
    { name = "DK_BLOCK", value = 32, doc = "Samples per channel and call, 48 kHz, both devices." },
    { name = "DK_FX_BLOCK", value = 64, doc = "Floats of a block, planar: 32 left, then 32 right." },                  # floats of the master block: 32 left, then 32 right
    { name = "DK_FX_MAX_PARAMS", value = 8, doc = "Hard cap on parameter words (the 7 knobs of a page are p0 to p6, v1 rows had 4; MIX is not one: the adapter owns it)." },
    { name = "DK_FX_MAX", value = 4, doc = "Effects in the chain (a device's `[limits] fx_slots` is at most this)." },                     # effects in the chain
    { name = "DK_FX_OK", value = 0, doc = "Returned by process: out written; a negative number is a fault: the block plays dry." },
    { name = "DK_LEVEL_BOUND_BITS", value = 1090519040, doc = "|sample| above DK_LEVEL_BOUND is a fault (+18 dB over full scale)." },  # 8.0f
    { name = "DK_FX_MAGIC", value = 1145783896, doc = "'DKFX', the first word of dk_fx_desc." },          # 'DKFX' = 0x444b4658
]
fx_in = ["in", "out", "block"]                             # struct dk_fx_in, DK_FX_IN_*
desc = [
    "magic", "contract", "n_params", "state_bytes", "max_cycles_block", "max_call_depth", "stack_bytes",
]                                                          # struct dk_fx_desc, DK_FX_DESC_*

# The typed C view of sdk/include/dk/gen/fx.h (as [machine.c]).
[fx.c]
intro = '''An effect processes the final stereo block of the device (the master, before the USB pack and the DAC converter).
   The numbers are in sdk/sdk.toml [fx], from which `patchkit gen` writes sdk/include/dk/gen/fx_consts.h (included here) and sdk/asm/dk_fx.inc for assembly.
   Do not include dk_fx.inc and dk_machine.inc in one assembly file (DK_BLOCK and DK_LEVEL_BOUND_BITS are in both).'''
desc_doc = '''One per module in read-only data, found by the module's registry row (patched in) or its DK_FX record (run-time, DSP section version 4
   of the .dkm). The row holds DK_FX_MAX_PARAMS parameter words, p0 to p7: word i of `params` is p_i, all 0 unless the row says otherwise (a run-time
   effect's record gives defaults). The adapter passes the words as they are; n_params says how many the effect reads. No function pointers.'''
rules = '''Entry point. SHARC+ assembly, v1: the adapter enters with `I13 = return address; JUMP (M13, I12)` and the module returns with
   `JUMP (M13, I13)`. Arguments R4 = state, R8 = in (dk_fx_in), R12 = params; result R0. Register rules as dk_machine.h:
   may clobber R0-R15, I0-I5, M1-M4, B3; must keep I6-I15, M0, M5-M15, L0-L7, MODE1.'''
fx_in = [
    "const float *in // the block before this effect, DK_FX_BLOCK floats, read only",
    "float *out // process writes DK_FX_BLOCK floats here (adapter scratch)",
    "u32 block // blocks since the start of the DSP, wraps at 2^32",
]
desc = [
    "u32 magic // DK_FX_MAGIC",
    "u32 contract // DK_FX_V1",
    "u32 n_params // 0 .. DK_FX_MAX_PARAMS",
    "u32 state_bytes // one instance, a multiple of 4; zeroed when the effect switches on",
    "u32 max_cycles_block // worst-case instructions of one process call",
    "u32 max_call_depth // nested CALLs the module uses",
    "u32 stack_bytes // data stack the module uses",
]
fns = [
    "i32 process(void *state, const dk_fx_in *in, const i32 *params) // Block entry point. params: DK_FX_MAX_PARAMS words. Returns dk_fx_status; a negative number is a fault: the block plays dry. Entered as note_on of dk_machine.h.",
]

# Descriptor records: what a module declares with the DK_* macros of <dk/fx.h> and <dk/machine.h>. The macros place them in the
# `.dk.desc` section of the module's ColdFire object. `patchkit` reads them when it loads the module and lowers them to the register
# records of the .dkm or to the registry rows of a patched-in module; they never reach the device. `patchkit gen` writes
# sdk/include/dk/gen/desc.h from this table.
# Fields are 4 bytes (big-endian) or char arrays whose length is a multiple of 4: text is printable ASCII, NUL-padded.
[desc]
section = ".dk.desc"
consts = [
    { name = "DK_DESC_SAMPLE_BANK", value = 6, doc = "Record kind of dk_desc_sample_bank." },
    { name = "DK_DESC_SAMPLE_TRACKS", value = 7, doc = "Record kind of dk_desc_sample_tracks." },
    { name = "DK_DESC_FX", value = 1, doc = "Record kind of dk_desc_fx." },
    { name = "DK_DESC_MACHINE", value = 2, doc = "Record kind of dk_desc_machine." },
    { name = "DK_DESC_PARAM", value = 3, doc = "Record kind of dk_desc_param." },
    { name = "DK_DESC_PAGE", value = 4, doc = "Record kind of dk_desc_page." },
    { name = "DK_DESC_FX_PARAM", value = 5, doc = "Record kind of dk_desc_fx_param." },
    { name = "DK_DESC_PARAM_ACTION", value = 8, doc = "Record kind of dk_desc_param_action." },
    { name = "DK_DESC_PARAM_GLYPH", value = 9, doc = "Record kind of dk_desc_param_glyph." },
    { name = "DK_DESC_PARAM_LATCHED", value = 10, doc = "Record kind of dk_desc_param_latched (machine contract 1.3)." },
    { name = "DK_DESC_NATIVE_PAGE", value = 11, doc = "Record kind of dk_desc_native_page (machine contract 1.4)." },
    { name = "DK_DESC_NATIVE_PAGE_V2", value = 12, doc = "Record kind of dk_desc_native_page_v2 (machine contract 1.5)." },
    { name = "DK_GLYPH_ENCODER", value = 0, doc = "Glyph (the dk_glyph values): a plain encoder knob, values 0 .. 127 (the default)." },
    { name = "DK_GLYPH_FADER", value = 1, doc = "Glyph: a fader, values 0 .. 127." },
    { name = "DK_GLYPH_PAN", value = 2, doc = "Glyph: a pan knob, values 0 .. 127 (centre 64, shows L/R)." },
    { name = "DK_GLYPH_ONOFF", value = 3, doc = "Glyph: an on/off switch, values 0 .. 1." },
    { name = "DK_GLYPH_TUNE", value = 4, doc = "Glyph: a tune knob, values 4 .. 124 (centre 64, one unit = one semitone)." },
    { name = "DK_GLYPH_PLAY", value = 5, doc = "Glyph: a play-mode knob, values 0 .. 3 (REV, REV.L, FWD.L, FWD on the Digitakt II; the Digitone II shows 0 .. 3)." },
    { name = "DK_PAGE_KNOBS", value = 8, doc = "Encoders on a page." },
    { name = "DK_POS_AUTO", value = 255, doc = "The knob takes the lowest free position." },
    { name = "DK_PERCENT", value = 1, doc = "A knob shown as 0 .. 127 (the default)." },
    { name = "DK_BIPOLAR", value = 2, doc = "A knob shown as -64 .. +63." },
    { name = "DK_ROUTE_MASTER", value = 1, doc = "The effect runs on the master block." },
    { name = "DK_ROUTE_SEND", value = 2, doc = "The effect runs on a send bus (one amount per track)." },
]

