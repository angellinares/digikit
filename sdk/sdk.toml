# The names a module may import. The runtime's table (modules/core/runtime/src/rs/src/lib.rs `IMPORTS`) holds those without `requires`, in this
# order; those with `requires` are symbols of another module that the runtime links by name (`optional` in its module.toml). `kind` `helper`: a
# compiler helper that gcc calls by itself, or a call whose prototype is in another header (<dk/ui.h>), so none in <dk/gen/api.h>; `fw`: a firmware
# function. `requires`: the module whose absence makes the address 0 (the import is then not found). `absent`: with `requires`, the runtime hands
# out a stub instead of 0 and the module loads: the stub returns this value ("0", "-1") or nothing ("void"), and the signature must agree.
[[import]]
name = "fw_block_read"
sig = "i32 (u32 sector, u32 bytes, u8 *buf)"
doc = "The firmware's eMMC block read; 0 = ok."
kind = "fw"

[[import]]
name = "fw_alloc"
sig = "u8 *(u32 size)"
doc = "The firmware's operator new (the 32 MiB buddy allocator)."
kind = "fw"

[[import]]
name = "fw_free"
sig = "void (u8 *p)"
doc = "The firmware's free, paired with fw_alloc."
kind = "fw"

[[import]]
name = "memcpy"
sig = "u8 *(u8 *d, const u8 *s, u32 n)"
doc = "The runtime's memcpy."
kind = "helper"

[[import]]
name = "memset"
sig = "u8 *(u8 *d, i32 c, u32 n)"
doc = "The runtime's memset."
kind = "helper"

[[import]]
name = "memcmp"
sig = "i32 (const u8 *a, const u8 *b, u32 n)"
doc = "The runtime's memcmp."
kind = "helper"

[[import]]
name = "__muldi3"
doc = "The runtime's 64-bit multiply."
kind = "helper"

[[import]]
name = "__udivdi3"
doc = "The runtime's unsigned 64-bit divide."
kind = "helper"

[[import]]
name = "__umoddi3"
doc = "The runtime's unsigned 64-bit remainder."
kind = "helper"

[[import]]
name = "input_key"
sig = "i32 (u32 code, u32 down)"
doc = "Press or release a panel key."
requires = "core/input"

[[import]]
name = "input_turn"
sig = "i32 (u32 encoder, i32 delta)"
doc = "Turn an encoder by `delta`."
requires = "core/input"

[[import]]
name = "usb_bulk_enable"
sig = "i32 (i32 io_id)"
doc = "Add the vendor bulk interface (interface 2, EP2 OUT and IN, 512-byte packets) to USB MIDI mode and re-enumerate. `io_id` is the I/O job that usb_bulk_* wakes when a receive buffer is full. Idempotent for the same job; another job gets E_BUSY (one owner). Task context. 0, or a negative error (E_STATE: the device is not in USB MIDI mode (USB CONFIG), nothing was changed, E_CONTRACT: the firmware's USB tables are not the stock ones, E_NOMEM: no free slot on the runtime's per-pass list). See <dk/usb_bulk.h>."
requires = "core/usb-bulk"

[[import]]
name = "usb_bulk_disable"
sig = "i32 (i32 io_id)"
doc = "The job that called usb_bulk_enable goes away (call it in dkm_fini): the adapter stops waking it and another job may enable the interface. The interface stays in the USB configuration until the next boot. 0, or E_STATE for another job."
requires = "core/usb-bulk"

[[import]]
name = "usb_bulk_take"
sig = "i32 (u8 **buf, u32 *len)"
doc = "The next full receive buffer, in arrival order: 1 and `*buf`, `*len` set (the buffer is yours until usb_bulk_release), or 0 when none is full. Never blocks. A buffer holds the bytes of one USB transfer: up to 16 KiB, ended by a short packet or a full buffer, so a message of a multiple of 512 bytes must be followed by a zero-length packet from the host."
requires = "core/usb-bulk"

[[import]]
name = "usb_bulk_release"
sig = "i32 (u8 *buf)"
doc = "Give a buffer from usb_bulk_take back: it is queued for the next transfer. 0, or E_STATE for a pointer that is not a taken buffer."
requires = "core/usb-bulk"

[[import]]
name = "usb_bulk_send"
sig = "i32 (const u8 *buf, u32 len)"
doc = "Send `len` bytes (1 to 16384) to the host on EP2 IN. The bytes are copied: `buf` is free when the call returns. 0, E_BUSY when both send slots are in flight (the job is woken when one completes), E_AGAIN (-72) when nothing is in flight and the engine refused the transfer (the job is woken within a few milliseconds to try again), E_STATE when the host is not connected or the bus was reset during the call, E_LENGTH."
requires = "core/usb-bulk"

[[import]]
name = "usb_bulk_takeover"
sig = "i32 ()"
doc = "Take the USB port over for the bulk link, or renew a take-over (call it again at least every 20 s while the host works: any bulk transfer counts too). In USB AUDIO/MIDI the adapter switches the device to USB MIDI in RAM about 50 ms later, from its tick (USB audio pauses; the USB CONFIG setting is not written, so a reboot returns to it); in USB MIDI it succeeds at once without a switch. 0, E_STATE in Overbridge or another USB mode, E_NOMEM (no free slot on the runtime's per-pass list). Callable from a command handler: it only records the request. Then call usb_bulk_enable until it stops returning E_STATE. The adapter gives back by itself after the host's disconnect or suspend, after 30 s without host activity, and drops the take-over when the USB mode changes by another route (the user's menu choice wins). See <dk/usb_bulk.h>."
requires = "core/usb-bulk"

[[import]]
name = "usb_bulk_giveback"
sig = "i32 ()"
doc = "End a take-over: about 50 ms later the adapter switches back to the USB mode the device had. 0, also when nothing is taken over. Callable from a command handler."
requires = "core/usb-bulk"

[[import]]
name = "usb_bulk_state"
sig = "u32 ()"
doc = "State word: bit 0 enabled, bit 1 connected (the host configured interface 2), bit 2 wrong mode (the device is not in USB MIDI mode; read live), bit 3 taken over (usb_bulk_takeover is active), bits 8..15 receive buffers full, bits 16..23 send slots in flight, bits 24..31 the reset count (it changes when the USB bus is reset or the host disconnects; a transfer in progress is void then)."
requires = "core/usb-bulk"

[[import]]
name = "dk_ui_has"
sig = "i32 (i32 cap)"
doc = "1 when this device has the UI capability `cap` (DK_UI_CAP_*), else 0. See <dk/ui.h>."
kind = "helper"
requires = "core/ui"
absent = "0"

[[import]]
name = "dk_ui_menu_new"
sig = "u8 *(const u8 *desc)"
doc = "Make a menu from a dk_ui_menu_desc; 0 when out of memory. See <dk/ui.h>."
kind = "helper"
requires = "core/ui"
absent = "0"

[[import]]
name = "dk_ui_open"
sig = "i32 (u8 *menu)"
doc = "Fill and show a menu on top of the current view; -1 when it cannot. See <dk/ui.h>."
kind = "helper"
requires = "core/ui"
absent = "-1"

[[import]]
name = "dk_ui_close"
sig = "void (u8 *menu)"
doc = "Close a menu. See <dk/ui.h>."
kind = "helper"
requires = "core/ui"
absent = "void"

[[import]]
name = "dk_ui_select"
sig = "void (u8 *menu, i32 row)"
doc = "Put the cursor of a menu or list on a row (clamped); call before dk_ui_open to start on the current choice. See <dk/ui.h>."
kind = "helper"
requires = "core/ui"
absent = "void"

[[import]]
name = "dk_ui_is_open"
sig = "i32 (const u8 *menu)"
doc = "1 when the menu is open. See <dk/ui.h>."
kind = "helper"
requires = "core/ui"
absent = "0"

[[import]]
name = "dk_ui_refresh"
sig = "void (u8 *menu)"
doc = "Fill an open menu again. See <dk/ui.h>."
kind = "helper"
requires = "core/ui"
absent = "void"

[[import]]
name = "dk_ui_action"
sig = "void (u8 *menu, const char *text, u8 *run, u8 *ctx, i32 arg)"
doc = "Add a row that runs `fn(ctx, arg)` on YES. See <dk/ui.h>."
kind = "helper"
requires = "core/ui"
absent = "void"

[[import]]
name = "dk_ui_submenu"
sig = "void (u8 *menu, const char *text, u8 *sub)"
doc = "Add a row that opens another menu. See <dk/ui.h>."
kind = "helper"
requires = "core/ui"
absent = "void"

[[import]]
name = "dk_ui_text"
sig = "void (u8 *menu, const char *text)"
doc = "Add a row of text without an action. See <dk/ui.h>."
kind = "helper"
requires = "core/ui"
absent = "void"

[[import]]
name = "dk_ui_toggle"
sig = "void (u8 *menu, const char *text, i32 *value, u8 *changed, u8 *ctx)"
doc = "Add an ON/OFF row. See <dk/ui.h>."
kind = "helper"
requires = "core/ui"
absent = "void"

[[import]]
name = "dk_ui_value"
sig = "void (u8 *menu, const char *text, i32 *value, i32 min, i32 max, u8 *changed, u8 *ctx)"
doc = "Add a number row changed by the encoder. See <dk/ui.h>."
kind = "helper"
requires = "core/ui"
absent = "void"

[[import]]
name = "dk_ui_check"
sig = "void (u8 *list, i32 row, i32 on)"
doc = "Set the check mark of a list row. See <dk/ui.h>."
kind = "helper"
requires = "core/ui"
absent = "void"

[[import]]
name = "dk_ui_checked"
sig = "i32 (const u8 *list, i32 row)"
doc = "1 when the list row is checked. See <dk/ui.h>."
kind = "helper"
requires = "core/ui"
absent = "0"

[[import]]
name = "dk_ui_confirm"
sig = "i32 (const char *title, const char *text, u8 *done, u8 *ctx)"
doc = "A YES/NO dialog; -1 when it cannot be shown. See <dk/ui.h>."
kind = "helper"
requires = "core/ui"
absent = "-1"

[[import]]
name = "dk_ui_choice"
sig = "i32 (const char *title, u8 *items, i32 n, u8 *done, u8 *ctx)"
doc = "A choice of n items; -1 when it cannot be shown. See <dk/ui.h>."
kind = "helper"
requires = "core/ui"
absent = "-1"

[[import]]
name = "dk_ui_toast"
sig = "i32 (const char *text)"
doc = "A short message on the main screen; -1 when it cannot be shown. See <dk/ui.h>."
kind = "helper"
requires = "core/ui"
absent = "-1"

[[import]]
name = "dk_ui_tick"
sig = "i32 (u8 *cb, u8 *ctx, u32 period_ms)"
doc = "Call `cb(ctx)` about every `period_ms` in the UI task (period 0 removes it); 0 when set, -1 when it cannot be (no core/ui, table full). See <dk/ui.h>."
kind = "helper"
requires = "core/ui"
absent = "-1"

[[import]]
name = "dl_set_tick_cb"
sig = "void (u8 *cb)"
doc = "Set the one per-block callback of core/dsp-link (0: off): `void cb(const volatile u16 *rec)`, called every block in the block interrupt with the copy of the previous DSP reply record. Keep it short: a plain C function, no allocation, no logging. Clear it in `fini`. Without core/dsp-link the call does nothing."
requires = "core/dsp-link"
absent = "void"

[[import]]
name = "dkrt_blocks"
sig = "u32 ()"
doc = "The 1500 Hz block clock, for a module that wants to measure time."

[[import]]
name = "dkrt_log_sink_set"
sig = "void (u8 *sink, u8 *tick)"
doc = "Set (or, with 0, clear) the one log sink and its tick: `void sink(const dk_log_ev *e)` receives every event the runtime logs, before any filter, in whatever task logs, with interrupts masked (short, no waiting, no logging). `dk_log_ev` is 32 bytes: `u32 seq` (0 here), `u32 time` (block counter), `u16 kind`, `u16 flags`, `u32 a[5]`. At the call the sink gets the events of the runtime's small ring (the boot and the errors so far), oldest first. `tick` (0: none) is `void tick(void)`, called once per pass of the UI task with this module as the source, outside the interrupt mask: it keeps the module off slot 0, which only one module can hold. The runtime clears a sink or a tick that points into a module's memory after its `fini`. Used by digikit/debug."

[[import]]
name = "dkrt_log_ev"
sig = "void (u32 kind, u32 flags, const u32 *a)"
doc = "Log one event as the runtime's own call does (the sink and the small ring see it): `kind` and `flags` as in `dk_log_ev`, `a` five words. The source is the module that is running unless `flags` holds one. For a module that logs a kind of its own."

[[import]]
name = "dkrt_peek_range"
sig = "u32 (u32 i, u32 *out)"
doc = "The RAM ranges `[lo, hi)` of the device file's `[digikit] peek`: returns how many there are, and for `i` below that writes `lo, hi` to `out[0..2]`. For a module that implements PEEK."

[[import]]
name = "dkrt_track_type"
sig = "i32 (u32 track)"
doc = "The machine type of track 0 to 15 of the active kit, read from the firmware (read-only); -1 for a track the firmware has no type for, -2 when there is no project yet."

[[import]]
name = "dkrt_selected_params"
sig = "i32 (i16 *out, u32 n)"
doc = "The selected track and its Sound parameter words (read-only, from the firmware's own accessors). Writes the first `n` s16 words of that track's Sound array to `out` (words past the device's count are 0) and returns the track, 0 to 15. Returns -2 when there is no project yet and -3 when the track has no Sound record (a kit is loading): `out` is not written then. The index of a word is the mirror index of the firmware's parameter table, not a parameter code. Used by digikit/debug."

# The entry points of a .dkm (docs/design/digikit-dkm.md); `api` is the dk_api table. At least one must exist.
[dkm]
init = { sig = "i32 (const api *api)", doc = "Runs once after the copy, relocation and cache flush. Returns 0 = ok; the module is unloaded otherwise." }
fini = { sig = "void (const api *api)", doc = "Runs when the module is unloaded." }
menu = { doc = "Optional: the module's settings. Runs when the user opens the module's SETTINGS... in the DIGIKIT menu, and adds the rows of a menu (core/ui must be in the image)." }
slot = { sig = "void (const api *api)", doc = "Slots: function pointers the firmware hooks call. A module binds one by exporting dkm_slot_<n>. Slot 0 runs once per pass of the UI task's event loop (about 120 Hz).", count = 8 }

