[protocol]          # the digikit SysEx protocol (F0 7D 64 6B ...); docs/design/digikit-upload.md
version = 1         # the request version byte; a request with another version gets E_PROTO

[protocol.limits]   # sizes of the upload protocol; every host and the runtime take them from here
max_chunk = 32768   # bytes of one PUT chunk (DATA body); the runtime's BEGIN reply sends it
read_max = 768      # bytes of one READ (and SETTINGS) reply
peek_max = 512      # bytes of one PEEK reply
max_request_wire = 40960  # the largest request on the wire, SysEx-encoded (40 KiB)
max_reply_wire = 1024     # the largest reply on the wire, SysEx-encoded

[protocol.commands] # command numbers; never reuse or renumber (additive only)
INFO = 0x01
LIST = 0x02
MODULES = 0x03      # the loaded modules with their ranges, types and faults
CAPACITY = 0x04     # per resource: the limit, what is used and the largest free piece (kinds in [capacity.kinds])
BEGIN = 0x10
DATA = 0x11
END = 0x12
DELETE = 0x13
CLEAR = 0x14
ABORT = 0x15
READ = 0x16         # a byte range of a store file: path, u32 offset, u32 length (at most 768); reply: u32 file size, the bytes
VERIFY = 0x17       # re-read a store file from the card and hash it: path; reply: sha256[32]
MKDIR = 0x18        # make a folder (a folder entry with nothing in it): path; ok when it exists
SETTINGS = 0x19     # read-only: the active settings record (docs/design/digikit-store.md, "The settings record"): u32 offset, u16 length (at most 768); reply: u8 copy (0 A, 1 B), u32 seq, u32 used, the bytes
FAULT = 0x23        # dev: make the runtime fail on purpose to test the fault path; body byte 0 = 1: a Rust panic (a bounds check)
SELECT = 0x30
RESTART = 0x31

[protocol.ranges]   # command numbers a run-time module may register with Api.register_cmds (a request number is 6 bits: bit 6 of the command byte marks a reply)
remote = [0x38, 0x3d]   # digikit/remote: key and turn of the panel (docs/plans/remote-control.md)
remote_state = [0x3e, 0x3f]   # digikit/remote: the state
probe = [0x32, 0x35]   # digikit/probe: collector status, raw reads, reset (docs/plans/debug-mode-and-probes.md)
debug = [0x20, 0x22]   # digikit/debug: LOG, PEEK, LOGCFG (docs/findings/46-digikit-debug.md)

[protocol.service]  # the commands of run-time service modules, by name; each lies in a range above (a module registers them with Api.register_cmds)
REMOTE_KEY = 0x38      # digikit/remote: code (u8), down (u8)
REMOTE_TURN = 0x39     # encoder (u8), delta (s8); the reply body is the delta taken (s8, at most 30 either way)
REMOTE_RELEASE = 0x3a  # release every key the module holds
LOG = 0x20             # digikit/debug: body u32 from_seq; reply u32 oldest, u32 newest, u8 n, then n events of 32 bytes
PEEK = 0x21            # digikit/debug: body u32 addr, u16 len (1 to 512, inside the device file's `[digikit] peek` ranges); reply u32 addr, u16 len, the bytes
LOGCFG = 0x22          # digikit/debug: body u8 op (0 get, 1 set: u8 default, 8 module levels); reply u8 default, 8 module levels, u8 debug_on (1 while loaded)
REMOTE_STATE = 0x3e    # reply: enabled (u8, always 1 while the module is loaded), state format (u8), turn limit (u8)

[protocol.status]   # reply status codes of the upload commands (0 = ok); never renumber
E_MSG = { code = -50, text = "body too short or malformed" }
E_PATH = { code = -51, text = "path breaks the store rules" }
E_FULL = { code = -52, text = "not enough free sectors in the store" }
E_STATE = { code = -53, text = "no upload open (or not in this state)" }
E_OFFSET = { code = -54, text = "offset is neither the next byte nor a retry" }
E_LENGTH = { code = -55, text = "bad chunk length, or the file would pass its size" }
E_HASH = { code = -56, text = "the staged file does not match the file hash of BEGIN" }
E_WRITE = { code = -57, text = "the firmware's block write failed" }
E_READ = { code = -58, text = "the firmware's block read failed" }
E_NOFILE = { code = -59, text = "that path is not in the store" }
E_PROTO = { code = -60, text = "unknown protocol version, command or option" }
E_NOSTORE = { code = -61, text = "the store header is unreadable (CLEAR still works)" }
E_INUSE = { code = -62, text = "the card's store area is not ours and not blank" }
E_PEEK = { code = -63, text = "PEEK range not allowed, or length 0 or over 512" }
E_CMD_RANGE = { code = -64, text = "command range not reserved, taken, or empty" }
E_SET_KEY = { code = -66, text = "a settings key breaks the rules (1 to 47 printable ASCII characters)" }
E_SET_FULL = { code = -67, text = "the settings area is full" }
E_SET_NOKEY = { code = -68, text = "no such settings key (or no settings record)" }
E_SET_VALUE = { code = -69, text = "a settings value is too long, or the buffer is too small" }
E_SET_OFF = { code = -70, text = "settings store off: an older store reaches its area, or no store" }

[protocol.caps]     # INFO capability bits (bit numbers of the `caps` word)
LOG = 0
PEEK = 1
LOGCFG = 2
SELECT = 3
RESTART = 4
MODULES = 5
CAPACITY = 6
READ = 7
VERIFY = 8
SERVICE_CMDS = 9    # modules register commands (Api.register_cmds)
FOLDERS = 10        # LIST takes a prefix, MKDIR, CAPACITY kind STORE
SETTINGS = 11       # the SETTINGS command (read the settings record), CAPACITY kind SETTINGS
FILEHASH = 12       # store format 4: the 32-byte hash of BEGIN, END, LIST and VERIFY is the content hash (4 bytes, big-endian, then 28 zeros), not a SHA-256

[capacity.kinds]   # the `kind` byte of a CAPACITY entry (u8 kind, u32 limit, u32 used, u32 largest); additive: a number is never reused
MODULES = 1         # module records; used: loaded; largest: 0
SELECTION = 2       # paths of the selection record; used: paths this boot loaded
ARENA = 3           # ColdFire arena bytes; used: taken (headers included); largest: the largest free block's payload
STAGE = 4           # the staging buffer: the largest .dkm file; used: 0
DSP_AREA = 5        # DSP run-time area bytes; used: taken, alignment gaps counted as free; largest: the largest free range
MACHINE_ROWS = 6    # run-time machine types (registry machine rows) in use
VOICE_ROWS = 7      # DSP voice rows in use
PARAM_ROWS = 8      # parameter rows core/dynreg reserves, in use
PAGE_ROWS = 9       # page rows core/dynreg reserves (Digitone II), in use
FX_SLOTS = 10       # effects in the chain: the device's limit (`[limits] fx_slots`); used: run-time effects claimed (the effect rows of core/dynfx); largest: 0
MAP_ENTRIES = 11    # sticky machine-type map entries in use
STORE = 12          # the module and sample store, in KiB (a store can be 22 GiB); used: KiB taken; largest: 0 (BEGIN says E_FULL with the free bytes)
SETTINGS = 13       # the settings record, in bytes: limit: the area of one copy (`[settings]`); used: the record's bytes (header and entries); largest: 0
SEND_SLOTS = 14     # effects that run on a send bus: the device's limit (`[limits] send_slots`, 0 when the image has no send page); used: loaded effects with the send route; largest: 0

[limits.max]        # contract maxima (capacity plan, docs/plans/capacity-isolation.md): a device's `[limits]` value in devices/*.toml may not exceed them
                    # (`patchkit gen` refuses it). Names are the keys of `[limits]` and, for dsp_area_bytes, of `[digikit]`.
modules = 8         # module records: the selection record holds SEL_MAX = 8 paths (record format, modules/core/runtime/sdk/src/lib.rs)
map_entries = 8     # sticky machine-type map entries: MAP_N = 8 (record format: bytes 28-31 and 480-507)
fx_slots = 4        # effects in the chain: DK_FX_MAX of [fx] (kept equal by packages/patchkit/tests/sdkgen.rs)
send_slots = 2      # effects on a send bus: the Sound array's free indices a send page can use, [fx] send_indices (at most SEND_MAX = 2 in core/fxpages)
dsp_area_bytes = 524288  # the 17-bit word offset of a core/dsp-link chunk reaches 2^17 words
param_rows = 16     # parameter rows core/dynreg reserves (tied to its manifest by packages/patchkit/tests/devdata.rs)
page_rows = 8       # page rows core/dynreg reserves (Digitone II)
machine_rows = 8    # run-time machine types core/dynreg reserves (tied to its manifest by packages/patchkit/tests/devdata.rs)
stage_bytes = 65536  # the runtime's staging buffer: the largest .dkm file (patchkit refuses a larger one)

[limits.format]     # format limits of the `.dkm` loader (packages/dkneeds, modules/core/runtime/src/rs/src/loader.rs, dsp.rs, arena.rs); generated into every language
                    # (`patchkit gen`: dkneeds::NAME, dkproto.py, gen_proto.ts). Also generated, from other keys: SLOTS ([dkm.slot] count),
                    # MAX_VOICES ([limits.max] machine_rows) and MAX_FX ([limits.max] fx_slots).
dkm_header = 160    # 0xa0: the header of a `.dkm` with no tables (a module with a `dkm_menu` has 4 bytes more); `dkneeds::HEADER`
dsp_header = 64     # 0x40: the header of the DSP section
max_records = 32    # records of the `register` table
max_relocs = 4096   # ColdFire relocations
max_imports = 32    # imports of the DSP section
max_cf_imports = 64  # imports of the ColdFire import table (a different table from the DSP section's)
max_state_voices = 64  # voice states of one voice record
max_state_bytes = 16777216  # bytes of one voice state (1 << 24, the loader's most: the DSP area)
granule = 64        # the DSP area's placement granule
dsp_slack = 8       # bytes the DSP range may start before its alignment
arena_hdr = 16      # the arena's block header

# The settings store (docs/design/digikit-store.md, "The settings record"): one record in two copies in the store range, next to the selection
# record. `sectors` is the size of ONE copy; the runtime keeps the record in RAM and writes the copy that is not current. The area is part of the
# store's tail (`store::TAIL`), and `[card.store] settings_sectors` of the device files must equal `copies * sectors` (patchkit gen refuses another value).
[settings]
copies = 2
sectors = 16        # per copy: 8 KiB
key_max = 47        # bytes of a key (printable ASCII 0x21 to 0x7e)
value_max = 1024    # bytes of a value

# The keys by owner. A key that starts with `prefix` is owned by that part of digikit; `value` names the decoding that the host readers
# (`patchkit store dump`, tools/device/dksettings.py) print: `u8` one byte, `route` one byte (0 master, 1 send), `u8x16` sixteen bytes (one per track).
# A run-time module will own `<module id>/...` (reserved, not built: no module API yet).
[[settings.key]]
prefix = "fx/route/"    # + the module id: where the effect runs
value = "route"

[[settings.key]]
prefix = "fx/send/"     # + the module id: the send amounts of the 16 tracks, 0 to 127
value = "u8x16"

