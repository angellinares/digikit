E_SEL_WRITE = { code = -42, text = "the firmware's block write failed" }
E_CARD_BUSY = { code = -43, text = "a card transfer is in flight" }
E_SAFE_MODE = { code = -44, text = "this boot is in safe mode: no module was loaded" }
E_BOOT_ONLY = { code = -45, text = "the module set is fixed after the boot hook" }
E_RANGE = { code = -46, text = "a card write outside the store range" }
E_CARD_RO = { code = -47, text = "the card's store area is not ours and not blank" }
