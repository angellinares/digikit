[module]
id = "core/overdrive"
version = "0.1.0"
name = "Overdrive types"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "experimental"
summary = "Seven more curves for the tracks' overdrive (TNH4, HARD, SOFT, TUBE, FOLD, FUZZ, SQR), chosen with the FX page's OVR TYPE knob together with pre / post filter."
ports = ["dt2-1.17"]
requires = ["core/params"]
conflicts = []

# Test status per firmware; patchkit does not read it.
[targets]
"dt2-1.17" = "experimental"

# src/dsp/split.inc, consts.inc and k.inc are generated by src/dsp/gen_split.py.
[[object]]
path = "build/overdrive-dsp.dko.json"
sources = ["src/dsp/overdrive.s"]
place = "dsp.l2"
devices = ["dt2"]

[object.externs]
_fw_frame = "dsp.voice.value.frame_base"
_fw_sat = "dsp.voice.fn.overdrive"
_od_tail = "hook.dsp.frame.site.frame_rx.copy_cond.tail"
_od_tail2 = "hook.dsp.frame.site.frame_rx.copy_block.tail"

# OVR TYPE's value text: PRE or PST, then the curve
[[object]]
path = "build/overdrive-fmt.dko.json"
sources = ["src/cf/fmt.s"]
place = "cf.expansion"
devices = ["dt2"]

# The stock OVR Routing parameter (0x103) becomes OVR TYPE: the value is curve << 9 | post << 8 (0 and 0x100 are the stock
# values). Its knob cell keeps drawing the class of 0xd1, a plain value, so it shows the formatter's text.
[[entry]]
registry = "param_edits"
id = "ovr_type"
code = 0x103
max = 0xf00
formatter = "od_type_fmt"
name = "OVR Type"
short = "OD.TY"
class = 0xd1
devices = ["dt2"]

# After each of the two frame copies of a block: keep each track's curve and leave only the routing bit for the stock code.
[[op]]
op = "hook"
hook = "dsp.frame.hook.frame_rx.copy_cond"
to = "_od_split"
devices = ["dt2"]

[[op]]
op = "hook"
hook = "dsp.frame.hook.frame_rx.copy_block"
to = "_od_split2"
devices = ["dt2"]

# The two per-track calls of the overdrive stage; the master's calls stay stock.
[[op]]
op = "hook"
hook = "dsp.voice.hook.chain.overdrive_call"
to = "_od_sat"
devices = ["dt2"]

[[op]]
op = "hook"
hook = "dsp.voice.hook.chain_ool.overdrive_call"
to = "_od_sat"
devices = ["dt2"]
