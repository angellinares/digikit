[module]
id = "core/ui"
version = "0.1.0"
name = "UI"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "experimental"
summary = "The UI adapter behind <dk/platform/ui.h>: menus, text pages, lists with a side panel, rows, confirm and choice dialogs and toasts, on the firmware's own views"
requires = ["core/runtime"]
conflicts = []
ports = ["dt2-1.17", "dn2-1.12"]

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# One C source for both devices: every firmware call is a generated anchor (modules/core/fw/include/dk_fw_*.h), so the object has no
# externs table for C. The assembly shim maps its own symbol below. The dk_ui_* functions are plain global symbols that other
# modules which require core/ui import by name. The module's one firmware hook is the end of the SETTINGS item list rebuild: it calls the app's optional dk_app_settings_rows (dk_ui_core.h).
[[object]]
path = "build/ui.dko.json"
sources = ["src/ui.c", "src/shim.s"]
place = "cf.expansion"
optional = ["dk_app_settings_rows"]

[object.externs]
_dk_tail = "hook.cf.menu.site.settings_list.tail.tail"

# Hook before the last step of the rebuild (the selection restore); the displaced instructions run in the tail.
[[op]]
op = "hook"
hook = "cf.menu.hook.settings_list.tail"
to = "dk_hook"

[[claim]]
resource = "cf.menu.site.settings_list.tail"
