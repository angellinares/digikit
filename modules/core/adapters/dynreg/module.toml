[module]
id = "core/dynreg"
version = "0.2.0"
name = "Run-time registry"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "experimental"
summary = "Reserves machine, parameter and (Digitone II) page rows that modules loaded at run time by the digikit runtime fill (emulator only)"
requires = ["core/runtime", "core/machines", "core/params"]
conflicts = []
ports = ["dt2-1.17", "dn2-1.12"]

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# Patch-time half of the run-time registry (docs/design/digikit-registry.md). It adds no behaviour by itself:
#
# - 8 machine rows (the type numbers dynamic_first ..= last of core/machines types.toml, 16 to 23) and 16 parameter rows
#   that look like the rows of a built-in machine with no name. The machine rows are listed (position = the end), so the
#   firmware's list, rank and name tables span them; a row whose name is empty is skipped when the list is returned.
# - `dynreg_copy` retargets the copy at the end of the machine list getter (`std::copy` of the sorted static list into the
#   returned vector) and leaves out the types whose row is still empty.
# - `dynreg_info` is the table of addresses and row layout that the runtime's registry reads (core/runtime, optional link).
#
# Digitone II: the same, and a page row per machine: a machine with a page row is its own type for the page and draw code
# (core/machines), the knobs are the page's columns. Eight page rows are reserved (their `machine` is a value no type has).
#
# Archived with hot reload (docs/plans/digikit-hot-reload.md, tag digikit-hot-reload-v1): the view hook (`dynreg_view_hook`, the
# `cf.dynreg.msv_build` anchor) and the in-use anchors (`cf.dynreg.project`, `kit_of`, `track_type`). At boot the rows are in place
# before the stock builder reads the list, so nothing rebuilds the view.
#
# The runtime fills and clears the rows. With this module the rows read as gap rows (clone of type 0, no name), which is
# also what a project that names an unloaded run-time machine gets.

# Device id, area size and the number of reserved types from the device files and core/machines types.toml, written by
# `patchkit gen` (docs/design/device-data.md). This module reserves DYN_TYPES rows: keep the `[[entry]]` rows below at that number
# (packages/patchkit/tests/devdata.rs checks it).
[[gen]]
kind = "gas"
path = "build/gen/device-{dev}.inc"

[[object]]
path = "build/dynreg-dt2.dko.json"
sources = ["src/cf/dt2/dynreg.s"]
place = "cf.expansion"
devices = ["dt2"]

[object.externs]
_dr_rows = "machines.rows"
_dr_row_size = "machines.row_size"
_dr_first = "machines.first"
_dr_count = "machines.count"
_dr_dyn0 = "machines.dyn16.index"
_dr_names = "mf_names"
_dr_permit = "mf_permit"
_dr_pertype = "mf_pertype"
_dr_p_table = "pf_table"
_dr_p_rows = "params.rows"
_dr_p_row_size = "params.row_size"
_dr_p_first = "params.first"
_dr_p_count = "params.count"
_dr_p_dyn0 = "params.dp0.index"


[[object]]
path = "build/dynreg-dn2.dko.json"
sources = ["src/cf/dn2/dynreg.s"]
place = "cf.expansion"
devices = ["dn2"]

[object.externs]
_dr_rows = "machines.rows"
_dr_row_size = "machines.row_size"
_dr_first = "machines.first"
_dr_count = "machines.count"
_dr_dyn0 = "machines.dyn16.index"
_dr_names = "mf_names"
_dr_permit = "mf_permit"
_dr_p_table = "pf_table"
_dr_p_rows = "params.rows"
_dr_p_row_size = "params.row_size"
_dr_p_first = "params.first"
_dr_p_count = "params.count"
_dr_p_dyn0 = "params.dp0.index"
_dr_pg_rows = "pages.rows"
_dr_pg_row_size = "pages.row_size"
_dr_pg_first = "pages.first"
_dr_pg_dyn0 = "pages.dpg0.index"
_dr_t_copy = "cf.machine.site.list.copy"

# the copy at the end of the machine list getter: `jsr copy(begin, end, dest)`, result in d0 = the end of the copy
[[op]]
op = "hook"
hook = "cf.machine.hook.list.copy_target"
to = "dynreg_copy"
devices = ["dt2"]

# Digitone II: the getter calls its library copy through `jsr (A3)`, so the call and the store after it (six bytes) are
# replaced by a jump to a routine that does both (the displaced bytes are not run)
[[op]]
op = "hook"
hook = "cf.machine.hook.list.copy_call"
to = "dynreg_list_hook"
devices = ["dn2"]

[[claim]]
resource = "cf.machine.site.list.copy"

