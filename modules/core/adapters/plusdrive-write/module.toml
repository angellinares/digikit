[module]
id = "core/plusdrive-write"
version = "0.1.0"
name = "+Drive write"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "experimental"
summary = "File writes to the stock +Drive for the runtime's file_* calls on the samples root (Digitakt II): the firmware's own file code, staged and moved into place"
ports = ["dt2-1.17"]
requires = ["core/runtime"]
conflicts = []

[targets]
"dt2-1.17" = "experimental"

# The +Drive write plug-in point (modules/core/runtime/include/dkrt_pdw.h, docs/plans/usb-fast.md 3.1). The runtime lists the dkpw_* symbols as
# optional imports; without this module the SDK's file_* calls on DK_FILES_SAMPLES return E_CONTRACT on the Digitakt II. No hook, no claim: the
# runtime calls the adapter from its I/O task, and the adapter calls the firmware's file functions (finding 120). Files are written under the hidden
# folder /.dkstage and renamed into place after the firmware's close hash. The folder stays for an upload session; the runtime's UI pass runs the
# recovery of that folder at boot and removes the empty folder 2 s after the last write session.
[[object]]
path = "build/plusdrive-write.dko.json"
sources = ["src/cf/dt2/pdw.c"]
place = "cf.expansion"
devices = ["dt2"]
