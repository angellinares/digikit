[module]
id = "core/fxpages"
version = "0.1.0"
name = "Effect pages"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "experimental"
summary = "Reserves the FX view pages and the parameter rows of run-time effects: one page after CHO for each effect row, answered by the page accessor, listed in the FX view; the digikit runtime fills them from the module's effect record. Keeps the effects' knob values with the kit (hooks on the kit loader, saver and initialiser)"
requires = ["core/runtime", "core/params", "core/dynreg", "core/dynfx"]
conflicts = []
ports = ["dt2-1.17", "dn2-1.12"]

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# Patch-time half of the effect pages (docs/design/digikit-registry.md "Effect pages", docs/findings/61-fx-pages.md). It adds no behaviour by itself: with no
# effect loaded the FX view has the three stock pages, DEL, REV and CHO, drawn as before.
#
# The image holds data only: the table `fxpages_info` (version 3: the firmware's addresses, the device numbers, the value indices and where each hook continues in the
# stock code) and 24 parameter rows (`params.fp0` ..), 8 for each effect slot (7 knobs and the MIX of the page) and 2 for the send page. The hooks are in the service
# file `fx.dks` (modules/core/services/fx/dks): it takes the nine firmware sites of the effect pages when it is loaded and reads this table through the core
# (`dkc_info`). Without the file the FX view is the stock one and kits are stock bytes; the runtime refuses an effect module that needs the service.
# - The firmware's page descriptor table (33 rows of 0x2c bytes) lives in RAM, built at start; it has no free row and a bound of 33 in its accessor. The page numbers
#   `[fx] page_first` and up (one for each effect slot, `[limits] fx_slots`) answer with a row of the service's own table; every other number gets the stock code.
# - The kit's effect values (finding 61): the stock tables are not touched (the lock map shares them); the spare halfwords of the kit's storage record hold the values.
# - `fxpages_info` is the table the service reads (`CoreApi::info`).

[[gen]]
kind = "gas"
path = "build/gen/device-{dev}.inc"
uses = ["DEVICE_ID", "LIMIT_FX_SLOTS", "FX_KIT_PTR", "FX_ARRAY_OFF", "FX_PAGE_FIRST", "FX_TPL_PERCENT", "FX_TPL_BIPOLAR",
    "FX_TPL_MIX", "FX_STORE_OFF", "FX_MARK_INDEX", "FX_TAIL_OFF", "FX_VALUES_N", "FX_TRACK_PAGE", "FX_SOUND_OFF",
    "FX_SOUND_STRIDE", "FX_SEND_TEMPLATE", "LIMIT_SEND_SLOTS", "FX_VALUE_*", "FX_SEND_IDX_*"]

[[object]]
path = "build/fxpages-dt2.dko.json"
sources = ["src/cf/fxpages-dt2.s"]
place = "cf.expansion"
devices = ["dt2"]

[object.externs]
_fp_acc = "cf.page.fn.page_desc"
_fp_label = "cf.page.site.tab_label_test"
_fp_graph = "cf.page.site.filter_graph_test"
_fp_list = "cf.page.site.fx_view_list.load"
_fp_stock = "cf.page.data.fx_view_list"
_fp_stock_n = "cf.page.site.fx_view_list.count"
_fp_p_first = "params.fp0.index"
_fp_load = "cf.page.site.fx_array.load"
_fp_save = "cf.page.site.fx_array.save"
_fp_init = "cf.page.site.fx_array.init_exit"
_fp_keylist = "cf.page.site.fx_key_list.load"
_fp_keystock = "cf.page.data.fx_key_list"
_fp_sound = "cf.page.site.sound_load_exit"
_fp_p_send = "params.fs0.index"

[[object]]
path = "build/fxpages-dn2.dko.json"
sources = ["src/cf/fxpages-dn2.s"]
place = "cf.expansion"
devices = ["dn2"]

[object.externs]
_fp_acc = "cf.page.fn.page_desc"
_fp_label = "cf.page.site.tab_label_test"
_fp_graph = "cf.page.site.filter_graph_test"
_fp_list = "cf.page.site.fx_view_list.load"
_fp_stock = "cf.page.data.fx_view_list"
_fp_stock_n = "cf.page.site.fx_view_list.count"
_fp_p_first = "params.fp0.index"
_fp_load = "cf.page.site.fx_array.load"
_fp_save = "cf.page.site.fx_array.save"
_fp_init = "cf.page.site.fx_array.init_exit"
_fp_keylist = "cf.page.site.fx_key_list.load"
_fp_keystock = "cf.page.data.fx_key_list"
_fp_sound = "cf.page.site.sound_load_exit"
_fp_p_send = "params.fs0.index"


# The data table of this adapter, exported to the image's info table (`dkrt_info_table`): the fx service file finds it by the hash of its name (`CoreApi::info`).
[[info]]
name = "fxpages_info"
devices = ["dt2", "dn2"]

# ---- reserved parameter rows ---------------------------------------------------------------------------------------------------
# 8 for each effect slot (fp0 .. fp7 are effect row 0, ...): 7 knobs and the page's level slot (MIX). The template is a placeholder (Delay "Feedback HPF"); the runtime
# writes the row from the effect's record: template by display, range, names, and the value index of `[fx] value_indices`.
# tests/patchkit/test_limits.py checks the number of rows against `[limits] fx_slots`.

[[entry]]
registry = "params"
id = "fp0"
name = ""
short = ""
template = 0x75
slot = 0
min = 0
max = 0
default = 0
devices = ["dt2", "dn2"]

