[module]
id = "core/machines"
version = "0.2.0"
name = "Machine types"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "experimental"
summary = "Framework that adds machine types to the Digitakt II and Digitone II MAIN OS: ordinary ColdFire assembly that looks the registry up at run time, hooks at the firmware's machine sites, and copies of the stock tables with one row appended per machine"
requires = []
conflicts = []

# Content modules list `core/machines` in `requires` and add machines with
#
#     [[entry]]
#     registry = "machines"
#     id = "pluck"
#     name = "Pluck"           # the machine list (the UI upper-cases it)
#     short = "PLK"            # the SRC page header
#     clone_of = 0             # stock type whose permission, per-type byte, name hint and DSP selector it copies
#     position = 2             # index in the displayed list (default: the end)
#     f0 = 0xca ... f8 = 0x0a  # the nine descriptor ID fields; a parameter of core/params as "params.<id>.index"
#     own_dsp = 1              # Digitone II: the DSP is told the machine's own type
#
# The type of an entry is its permanent number in types.toml (key "<module id>:<entry id>", per device; the file
# also holds the highest supported number); patchkit refuses an entry without a number. Symbols: machines.first,
# .count (rows incl. gaps), .entries (rows that are machines), .rows, .row_size, machines.<id>.index (the type number a
# DSP object or a voice entry names).
# Row layout (offsets in src/cf/*/machines.s): the order of the fields below, every field one 32-bit word.
# Digitone II: a machine with own parameter pages adds `[[entry]] registry = "pages"` rows (documented at the registry
# below) and, for its knobs, `registry = "params"` rows of core/params; without page rows it is a clone of `clone_of`.
# Contract, evidence and limits: finding 02, "core.machines" and "DN2 own parameter pages: built".

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# ---- the registry --------------------------------------------------------------------------------------------------

[[registry]]
name = "machines"
first = "image.u8(cf.machine.fn.dispatch + 1) + 1"   # `moveq #last,D1` of the dispatch: the stock type count
max = 32
region = "cf.expansion"
# Permanent type numbers (types.toml, finding 02 "Stable machine type numbers"): a machine's type is its number in that
# table, never "the k-th selected machine". A number nobody selected is a gap row: a clone of type 0 that the machine
# list does not show (position 0xffffffff) and nobody can pick; a stored project that names it plays as type 0.
index_table = "types.toml"

[registry.gap]
clone_of = 0
position = 0xffffffff
own_dsp = 0
name = ""
short = ""

# 0, 1: the dispatch descriptor's long and short name (std::string characters), built at run time from name and short
[[registry.field]]
name = "d_long"
kind = "u32"
default = 0
[[registry.field]]
name = "d_short"
kind = "u32"
default = 0
[[registry.field]]
name = "f0"
kind = "u32"
default = 0
[[registry.field]]
name = "f1"
kind = "u32"
default = 0
[[registry.field]]
name = "f2"
kind = "u32"
default = 0
[[registry.field]]
name = "f3"
kind = "u32"
default = 0
[[registry.field]]
name = "f4"
kind = "u32"
default = 0
[[registry.field]]
name = "f5"
kind = "u32"
default = 0
[[registry.field]]
name = "f6"
kind = "u32"
default = 0
[[registry.field]]
name = "f7"
kind = "u32"
default = 0
[[registry.field]]
name = "f8"
kind = "u32"
default = 10
[[registry.field]]
name = "clone_of"
kind = "u32"
[[registry.field]]
name = "position"
kind = "u32"
default = 255
[[registry.field]]
name = "own_dsp"
kind = "u32"
default = 0
[[registry.field]]
name = "name"
kind = "cstr"
max_len = 23
[[registry.field]]
name = "short"
kind = "cstr"
max_len = 23

[[claim]]
resource = "cf.machines.sites"

# ---- own parameter pages (Digitone II) ---------------------------------------------------------------------------

# One row per page of a machine with its own parameter pages (the page table of the firmware has a page descriptor of 44
# bytes per page: two std::string characters pointers and nine parameter codes, the last one 10 = the track level).
# Content modules add pages with
#
#     [[entry]]
#     registry = "pages"
#     machine = "machines.pluck.index"   # the type the page belongs to (pages are numbered in entry order)
#     name = "PLUCK"                     # the short page name (SYN1 ...), at most 23 characters
#     title = "Pluck"                    # the title shown on the page
#     c0 = "params.pluck_decay.index"    # knob A .. H: a parameter code (a core/params code, or a stock code); 0 = no knob
#     s0 = 25                            # the sound-array slot (25 .. 64) of that code's row: slot -> code for the defaults
#     ...                                # c8 = 10 (track level) by default
#
# A machine with at least one page gets: its own page count and descriptors, its own slot -> code mapping, and the page
# and draw functions see its own type (not the clone's). A machine without a page row behaves as a clone.
[[registry]]
name = "pages"
devices = ["dn2"]
first = "0"
max = 32
region = "cf.expansion"

[[registry.field]]
name = "name"
kind = "cstr"
max_len = 23
[[registry.field]]
name = "title"
kind = "cstr"
max_len = 23
[[registry.field]]
name = "c0"
kind = "u32"
default = 0
[[registry.field]]
name = "c1"
kind = "u32"
default = 0
[[registry.field]]
name = "c2"
kind = "u32"
default = 0
[[registry.field]]
name = "c3"
kind = "u32"
default = 0
[[registry.field]]
name = "c4"
kind = "u32"
default = 0
[[registry.field]]
name = "c5"
kind = "u32"
default = 0
[[registry.field]]
name = "c6"
kind = "u32"
default = 0
[[registry.field]]
name = "c7"
kind = "u32"
default = 0
[[registry.field]]
name = "c8"
kind = "u32"
default = 10
[[registry.field]]
name = "machine"
kind = "u32"
[[registry.field]]
name = "s0"
kind = "u32"
default = 0
[[registry.field]]
name = "s1"
kind = "u32"
default = 0
[[registry.field]]
name = "s2"
kind = "u32"
default = 0
[[registry.field]]
name = "s3"
kind = "u32"
default = 0
[[registry.field]]
name = "s4"
kind = "u32"
default = 0
[[registry.field]]
name = "s5"
kind = "u32"
default = 0
[[registry.field]]
name = "s6"
kind = "u32"
default = 0
[[registry.field]]
name = "s7"
kind = "u32"
default = 0
[[registry.field]]
name = "s8"
kind = "u32"
default = 0

# ---- copies of the stock tables, one row appended per machine (the clone's row; names are ours) -------------------------

# the displayed order of the stock list (the run-time builder inserts the machines at their positions)
[[section]]
name = "mf_list_stock"
region = "cf.expansion"
from = { anchor = "cf.machine.data.list.table", len = "(image.u8(cf.machine.fn.dispatch + 1) + 1) * 4" }

# name table: {long, short, header hint} per type
[[section]]
name = "mf_names"
region = "cf.expansion"
from = { anchor = "cf.machine.data.name.table", len = "(image.u8(cf.machine.fn.dispatch + 1) + 1) * 12" }
append = { registry = "machines", row = ["$name", "$short", "image.u32(cf.machine.data.name.table + 12 * $clone_of + 8)"] }

# permission mask per type
[[section]]
name = "mf_permit"
region = "cf.expansion"
from = { anchor = "cf.machine.data.permit.table", len = "(image.u8(cf.machine.fn.dispatch + 1) + 1) * 4" }
append = { registry = "machines", row = ["image.u32(cf.machine.data.permit.table + 4 * $clone_of)"] }

# one byte per type (Digitakt II only)
[[section]]
name = "mf_pertype"
region = "cf.expansion"
devices = ["dt2"]
from = { anchor = "cf.machine.data.pertype.table", len = "(image.u8(cf.machine.fn.dispatch + 1) + 1)" }
append = { registry = "machines", row = ["u8:image.u8(cf.machine.data.pertype.table + $clone_of)"] }

# the type -> selector word table of the DSP's sample renderer chooser (Digitakt II only)
[[section]]
name = "mf_selector"
region = "dsp.l2"
devices = ["dt2"]
from = { anchor = "dsp.machine.data.selector.table", len = "(image.u8(cf.machine.fn.dispatch + 1) + 1) * 4" }
append = { registry = "machines", row = ["image.u32(dsp.machine.data.selector.table + 4 * $clone_of)"] }

# the type reader of the Digitone II, copied: its callers that want the real type call this copy
[[section]]
name = "mf_reader_real"
region = "cf.expansion"
devices = ["dn2"]
from = { anchor = "cf.machine.fn.type_reader", len = 48 }

# ---- code -----------------------------------------------------------------------------------------------------------

[[object]]
path = "build/machines-dt2.dko.json"
sources = ["src/cf/dt2/machines.s"]
place = "cf.expansion"
devices = ["dt2"]

[object.externs]
_mf_first = "machines.first"
_mf_count = "machines.count"
_mf_entries = "machines.entries"
_mf_rows = "machines.rows"
_mf_list_stock = "mf_list_stock"
_mf_t_dispatch = "hook.cf.machine.fn.dispatch.tail"
_mf_t_list = "hook.cf.machine.fn.list.entry.tail"
_mf_t_rank = "hook.cf.machine.site.list_rank_insert.tail"
_mf_t_typearg = "hook.cf.machine.site.param_code.args.tail"
_mf_x_typearg = "cf.machine.site.param_code.exit"
_mf_t_clone5 = "hook.cf.machine.site.clone.5.tail"
_mf_c0 = "cf.machine.site.clone.0"
_mf_c0a = "cf.machine.site.clone.0.alt"
_mf_c1 = "cf.machine.site.clone.1"
_mf_c1a = "cf.machine.site.clone.1.alt"
_mf_c2 = "cf.machine.site.clone.2"
_mf_c2a = "cf.machine.site.clone.2.alt"
_mf_c3 = "cf.machine.site.clone.3"
_mf_c3a = "cf.machine.site.clone.3.alt"
_mf_c4 = "cf.machine.site.clone.4"
_mf_c4a = "cf.machine.site.clone.4.alt"
_mf_c6 = "cf.machine.site.clone.6"
_mf_c6a = "cf.machine.site.clone.6.alt"
_mf_sp = "cf.machine.site.srcpage"
_mf_spa = "cf.machine.site.srcpage.alt"
_mf_spt = "cf.machine.fn.current_track_type"

[[object]]
path = "build/machines-dn2.dko.json"
sources = ["src/cf/dn2/machines.s"]
place = "cf.expansion"
devices = ["dn2"]

[object.externs]
_mf_first = "machines.first"
_mf_count = "machines.count"
_mf_entries = "machines.entries"
_mf_rows = "machines.rows"
_mf_list_stock = "mf_list_stock"
_mf_t_dispatch = "hook.cf.machine.fn.dispatch.tail"
_mf_t_list = "hook.cf.machine.fn.list.entry.tail"
_mf_t_group = "hook.cf.machine.site.group.tail"
_mf_t_typemap0 = "hook.cf.machine.fn.type_page.count.tail"
_mf_t_typemap1 = "hook.cf.machine.site.type_page.desc.tail"
_mf_t_typemap2 = "hook.cf.machine.site.param_code.map.tail"
_mf_ft = "cf.machine.site.frametype"
_mf_rd = "cf.machine.site.type_reader.load"
_mf_ow = "cf.machine.site.owner_type_load"
_mf_rc0 = "cf.machine.site.type_reader.call.0"
_mf_rc1 = "cf.machine.site.type_reader.call.1"
_mf_rc2 = "cf.machine.site.type_reader.call.2"
_mf_rc3 = "cf.machine.site.type_reader.call.3"
_mf_rc4 = "cf.machine.site.type_reader.call.4"
_mf_rc5 = "cf.machine.site.type_reader.call.5"
_mf_rc6 = "cf.machine.site.type_reader.call.6"
_mf_rc7 = "cf.machine.site.type_reader.call.7"
_mf_rc8 = "cf.machine.site.type_reader.call.8"
_mf_pgrows = "pages.rows"
_mf_pgn = "pages.count"

# ---- patches: hooks (code in the objects above), bound writes and repointed table references ------------------------

# dispatch: the descriptor of an added type is its registry row

[[op]]
op = "hook"
hook = "cf.machine.hook.dispatch"
to = "mf_dispatch"
devices = ["dt2"]

[[op]]
op = "hook"
hook = "cf.machine.hook.dispatch"
to = "mf_dispatch"
devices = ["dn2"]

# list builder: the tables exist before it runs; it copies mf_list_buf (stock order plus the machines at their positions)

[[op]]
op = "hook"
hook = "cf.machine.hook.list.entry"
to = "mf_list_entry"
devices = ["dt2"]

[[op]]
op = "hook"
hook = "cf.machine.hook.list.entry"
to = "mf_list_entry"
devices = ["dn2"]

[[op]]
op = "write"
anchor = "cf.machine.site.list.alloc"
offset = 0x2
value = "(machines.first + machines.entries) * 4"
width = 2
devices = ["dt2", "dn2"]

[[op]]
op = "write"
anchor = "cf.machine.site.list.operands"
offset = 0x8
value = "(machines.first + machines.entries) * 4"
width = 2
devices = ["dt2", "dn2"]

[[op]]
op = "write"
anchor = "cf.machine.site.list.operands"
offset = 0x2
value = "mf_list_buf + (machines.first + machines.entries) * 4"
width = 4
devices = ["dt2", "dn2"]

[[op]]
op = "write"
anchor = "cf.machine.site.list.operands"
offset = 0xc
value = "mf_list_buf"
width = 4
devices = ["dt2", "dn2"]

# rank (Digitakt II): the sort comparator's std::map gets (type, display position) pairs

[[op]]
op = "hook"
hook = "cf.machine.hook.list_rank_insert"
to = "mf_rank"
devices = ["dt2"]

# group (Digitakt II): SLICE and its clones; (Digitone II: a hook, below). Bound = the last type, branch `bne` -> `bcs`

[[op]]
op = "write"
anchor = "cf.machine.site.group"
offset = 0x1
value = "machines.first + machines.count - 1"
width = 1
devices = ["dt2"]

[[op]]
op = "write"
anchor = "cf.machine.site.group"
offset = 0x4
value = "0x65"
width = 1
devices = ["dt2"]

[[op]]
op = "hook"
hook = "cf.machine.hook.group"
to = "mf_group"
devices = ["dn2"]

# names: three accessors (long, short, header hint), each bounded by `moveq #last,D1`, each reading a column of the table

[[op]]
op = "write"
anchor = "cf.machine.fn.name.long"
offset = 0x1
value = "machines.first + machines.count - 1"
width = 1
devices = ["dt2", "dn2"]

[[op]]
op = "write"
anchor = "cf.machine.fn.name.long"
offset = 0x12
value = "mf_names + 0"
width = 4
devices = ["dt2", "dn2"]

[[op]]
op = "write"
anchor = "cf.machine.site.name.short"
offset = 0x1
value = "machines.first + machines.count - 1"
width = 1
devices = ["dt2", "dn2"]

[[op]]
op = "write"
anchor = "cf.machine.site.name.short"
offset = 0x14
value = "mf_names + 4"
width = 4
devices = ["dt2", "dn2"]

[[op]]
op = "write"
anchor = "cf.machine.site.name.hint"
offset = 0x1
value = "machines.first + machines.count - 1"
width = 1
devices = ["dt2", "dn2"]

[[op]]
op = "write"
anchor = "cf.machine.site.name.hint"
offset = 0x14
value = "mf_names + 8"
width = 4
devices = ["dt2", "dn2"]

# permission mask table (bound `moveq #last,D2`)

[[op]]
op = "write"
anchor = "cf.machine.fn.permit"
offset = 0x3
value = "machines.first + machines.count - 1"
width = 1
devices = ["dt2", "dn2"]

[[op]]
op = "write"
anchor = "cf.machine.fn.permit"
offset = 0x1a
value = "mf_permit"
width = 4
devices = ["dt2", "dn2"]

# persistence: the sound loader keeps a stored machine type when (u8)(type + 1) < the immediate

[[op]]
op = "write"
anchor = "cf.machine.site.sound_load_type_bound"
offset = 0x1
value = "image.u8(cf.machine.site.sound_load_type_bound + 1) + machines.count"
width = 1
devices = ["dt2", "dn2"]

# per-type byte (Digitakt II): six bounds and six table references

[[op]]
op = "write"
anchor = "cf.machine.site.pertype.0"
offset = 0x1
value = "machines.first + machines.count - 1"
width = 1
devices = ["dt2"]

[[op]]
op = "write"
anchor = "cf.machine.site.pertype.0"
offset = 0x8
value = "mf_pertype"
width = 4
devices = ["dt2"]

[[op]]
op = "write"
anchor = "cf.machine.site.pertype.1"
offset = 0x1
value = "machines.first + machines.count - 1"
width = 1
devices = ["dt2"]

[[op]]
op = "write"
anchor = "cf.machine.site.pertype.1"
offset = 0xc
value = "mf_pertype"
width = 4
devices = ["dt2"]

[[op]]
op = "write"
anchor = "cf.machine.site.pertype.2"
offset = 0x1
value = "machines.first + machines.count - 1"
width = 1
devices = ["dt2"]

[[op]]
op = "write"
anchor = "cf.machine.site.pertype.2"
offset = 0xc
value = "mf_pertype"
width = 4
devices = ["dt2"]

[[op]]
op = "write"
anchor = "cf.machine.site.pertype.3"
offset = 0x1
value = "machines.first + machines.count - 1"
width = 1
devices = ["dt2"]

[[op]]
op = "write"
anchor = "cf.machine.site.pertype.3"
offset = 0x10
value = "mf_pertype"
width = 4
devices = ["dt2"]

[[op]]
op = "write"
anchor = "cf.machine.site.pertype.4"
offset = 0x1
value = "machines.first + machines.count - 1"
width = 1
devices = ["dt2"]

[[op]]
op = "write"
anchor = "cf.machine.site.pertype.4"
offset = 0x8
value = "mf_pertype"
width = 4
devices = ["dt2"]

[[op]]
op = "write"
anchor = "cf.machine.site.pertype.5"
offset = 0x1
value = "machines.first + machines.count - 1"
width = 1
devices = ["dt2"]

[[op]]
op = "write"
anchor = "cf.machine.site.pertype.5"
offset = 0x22
value = "mf_pertype"
width = 4
devices = ["dt2"]

# clone tests (Digitakt II): `type == MANUAL SLICE` also holds for an added clone of it

[[op]]
op = "hook"
hook = "cf.machine.hook.clone.0"
to = "mf_clone0"
devices = ["dt2"]

[[op]]
op = "hook"
hook = "cf.machine.hook.clone.1"
to = "mf_clone1"
devices = ["dt2"]

[[op]]
op = "hook"
hook = "cf.machine.hook.clone.2"
to = "mf_clone2"
devices = ["dt2"]

[[op]]
op = "hook"
hook = "cf.machine.hook.clone.3"
to = "mf_clone3"
devices = ["dt2"]

[[op]]
op = "hook"
hook = "cf.machine.hook.clone.4"
to = "mf_clone4"
devices = ["dt2"]

[[op]]
op = "hook"
hook = "cf.machine.hook.clone.5"
to = "mf_clone5"
devices = ["dt2"]

[[op]]
op = "hook"
hook = "cf.machine.hook.clone.6"
to = "mf_clone6"
devices = ["dt2"]

# type argument of the parameter mapping (Digitakt II)

[[op]]
op = "hook"
hook = "cf.machine.hook.param_code.args"
to = "mf_typearg"
devices = ["dt2"]

# SRC page (Digitakt II): an added type has one page (the page vector is cut to it, page 0), see mf_srcpage in src/cf/dt2/machines.s

[[op]]
op = "hook"
hook = "cf.machine.hook.srcpage"
to = "mf_srcpage"
devices = ["dt2"]

# DSP (Digitakt II): the selector table moves to mf_selector; the literal that loads its address follows

[[op]]
op = "write"
anchor = "dsp.machine.value.selector.table_ref"
offset = 2
value = "(mf_selector >> 16) & 0xffff"
width = 2
devices = ["dt2"]

[[op]]
op = "write"
anchor = "dsp.machine.value.selector.table_ref"
offset = 4
value = "mf_selector & 0xffff"
width = 2
devices = ["dt2"]

# Digitone II: type maps, frame type, type reader (a hook that drops the load and does it itself), owner test

[[op]]
op = "hook"
hook = "cf.machine.hook.type_page.count"
to = "mf_typemap0"
devices = ["dn2"]

[[op]]
op = "hook"
hook = "cf.machine.hook.type_page.desc"
to = "mf_typemap1"
devices = ["dn2"]

[[op]]
op = "hook"
hook = "cf.machine.hook.param_code.map"
to = "mf_typemap2"
devices = ["dn2"]

[[op]]
op = "hook"
hook = "cf.machine.hook.frametype"
to = "mf_frametype"
devices = ["dn2"]

[[op]]
op = "hook"
hook = "cf.machine.hook.type_reader.load"
to = "mf_reader"
devices = ["dn2"]

[[op]]
op = "hook"
hook = "cf.machine.hook.owner_type_load"
to = "mf_owner"
devices = ["dn2"]

[[op]]
op = "write"
anchor = "cf.machine.site.type_reader.tail_jump"
offset = 0x2
value = "mf_reader_real"
width = 4
devices = ["dn2"]

# Opt-in native callback page v1. Ordinary machine rows and their ABI stay unchanged.
[[object]]
path = "build/native-page-dt2.dko.json"
sources = ["src/cf/native-page-dt2.c"]
place = "cf.expansion"
devices = ["dt2"]

[[object]]
path = "build/native-page-dn2.dko.json"
sources = ["src/cf/native-page-dn2.c"]
place = "cf.expansion"
devices = ["dn2"]

[[object]]
path = "build/native-page-hooks.dko.json"
sources = ["src/cf/native-page-hooks.s"]
place = "cf.expansion"
[object.externs]
mf_native_draw_next = "hook.cf.page.fn.source_draw.tail"
mf_native_code_next = "hook.cf.page.fn.source_code.tail"

[[op]]
op = "hook"
hook = "cf.page.hook.source_draw"
to = "mf_native_draw_hook"
[[claim]]
resource = "cf.page.fn.source_draw"

[[op]]
op = "hook"
hook = "cf.page.hook.source_code"
to = "mf_native_code_hook"
[[claim]]
resource = "cf.page.fn.source_code"
