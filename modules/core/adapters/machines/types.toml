# Permanent machine type numbers (core/machines, registry "machines"). A project stores only the number, so a number
# is never reused and never changed: a machine keeps its number whichever other modules are selected. Rules:
#
# - Key: "<module id>:<entry id>" (the module's directory under modules/, the `id` of its `[[entry]]`).
# - Numbers start at the first non-stock type (Digitakt II 7, Digitone II 5) and stop at `last`. Stock types are never
#   allocated. A number nobody selected is a gap row (not listed, plays as type 0).
# - Digitakt II `last` = 23: the DSP's type -> selector table was read to entry 23 (findings 06), the frame word of type t
#   is `0x94 + 2t` (finding 04), and the selector copy has one word per type up to the highest selected.
# - Digitone II `last` = 23: the same number, chosen. The firmware bounds that were read are the persistence byte
#   (`(u8)(type+1) < imm`, imm up to 255), the page tables (rows built per type by core/machines) and the FM engine, which
#   knows types 0..4 and treats the rest as MIDI; no firmware table caps it lower (finding 02, "Stable machine type
#   numbers"). Keeping it equal to the Digitakt's leaves one rule for both.
# - A new machine takes the next free number of its device (`mise run module:new` does that); a removed machine's number
#   stays retired, so an old project never loads as another machine.

# - Run-time machines (modules with `dynamic = true`, loaded by the digikit runtime from the card) have no number here: the runtime
#   assigns one in the range `dynamic_first ..= last` when it loads the module and remembers it on the card (the sticky map of the
#   selection record; docs/design/module-sdk.md 11.5 D7). `core/dynreg` reserves one row per number of that range (keys
#   "core/dynreg:dyn<N>" in `alloc`); a built-in machine never takes a number in it.

[dt2]
last = 23
dynamic_first = 16

[dt2.alloc]
# 10 is retired (test/twin-xslice:xslice_d, removed): gap row, never reused.
# Isolated patched-in DDR diagnostic only; absent from all default module sets.
"core/dsp-ddr-proof:ddr_proof" = 11
# 13, 14 and 15 are retired (analog, pd and bd are run-time modules now): gap rows, never reused.
"test/machine-clone:xclone" = 8
"test/patched-pluck:pluck" = 9
"core/dynreg:dyn16" = 16
"core/dynreg:dyn17" = 17
"core/dynreg:dyn18" = 18
"core/dynreg:dyn19" = 19
"core/dynreg:dyn20" = 20
"core/dynreg:dyn21" = 21
"core/dynreg:dyn22" = 22
"core/dynreg:dyn23" = 23


[dn2]
last = 23
dynamic_first = 16

[dn2.alloc]
# Private opt-in LP0 two-track diagnostic; DN2 only.
"core/dsp-lp0-proof:lp_sampler" = 12
# Isolated patched-in DDR diagnostic only; absent from all default module sets.
"core/dsp-ddr-proof:ddr_proof" = 11
# 13, 14 and 15 are retired (analog, pd and bd are run-time modules now): gap rows, never reused.
"test/dn2-clone:fmclone" = 5
"test/dn2-pages:pages" = 6
# 7 and 8 are retired (test/dn2-sine and test/dn2-edge, removed): a gap row, never reused (the next free number is above 10).
"test/patched-pluck:pluck" = 9
"test/twin-dn2:dyn_pluck" = 10
"core/dynreg:dyn16" = 16
"core/dynreg:dyn17" = 17
"core/dynreg:dyn18" = 18
"core/dynreg:dyn19" = 19
"core/dynreg:dyn20" = 20
"core/dynreg:dyn21" = 21
"core/dynreg:dyn22" = 22
"core/dynreg:dyn23" = 23

