[module]
id = "core/dyndsp"
version = "0.1.0"
name = "Run-time DSP machines"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "experimental"
summary = "Reserves the DSP side of run-time machines: free voice rows and the table of DSP addresses the digikit runtime uses (emulator only)"
requires = ["core/runtime", "core/dsp-link", "core/dsp-voice"]
conflicts = []
ports = ["dt2-1.17", "dn2-1.12"]

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# Patch-time half of the DSP side of run-time machines (docs/design/digikit-dkm.md "DSP section", docs/findings/32-runtime-dsp-machines.md).
# It adds no behaviour by itself:
#
# - 8 free rows in the voices registry of core/dsp-voice. A free row holds type 0xffffffff, which no machine type equals, and pc 0:
#   the render scan skips it. The runtime claims one for a module's voice: it writes the pc, then the type (one word per transfer
#   through window 1 of core/dsp-link, so the scan never sees a half-written row), and frees it the other way round.
# - `dyndsp_info` is the table of DSP addresses the runtime reads (core/runtime, optional link): the area, the free voice rows, and
#   the exported DSP symbols a run-time DSP object may import (the helpers of core/dsp-voice).

# Device id, area size and the number of reserved types from the device files and core/machines types.toml, written by
# `patchkit gen` (docs/design/device-data.md). This module reserves DYN_TYPES rows: keep the `[[entry]]` rows below at that number
# (packages/patchkit/tests/devdata.rs checks it).
[[gen]]
kind = "gas"
path = "build/gen/device-{dev}.inc"

[[object]]
path = "build/dyndsp-dt2.dko.json"
sources = ["src/cf/dyndsp-dt2.s"]
place = "cf.expansion"
devices = ["dt2"]

[object.externs]
_dd_area = "_dl_area"
_dd_vrows = "voices.rows"
_dd_vfirst = "voices.dv0.index"
_dd_vcount = "voices.count"
_dd_exp2 = "_dv_exp2"
_dd_frame_hw = "_dv_frame_hw"
_dd_frame_sw = "_dv_frame_sw"

[[object]]
path = "build/dyndsp-dn2.dko.json"
sources = ["src/cf/dyndsp-dn2.s"]
place = "cf.expansion"
devices = ["dn2"]

[object.externs]
_dd_area = "_dl_area"
_dd_vrows = "voices.rows"
_dd_vfirst = "voices.dv0.index"
_dd_vcount = "voices.count"
_dd_exp2 = "_dv_exp2"
_dd_frame_hw = "_dv_frame_hw"
_dd_frame_sw = "_dv_frame_sw"

[[entry]]
registry = "voices"
id = "dv0"
type = 0xffffffff
pc = 0

[[entry]]
registry = "voices"
id = "dv1"
type = 0xffffffff
pc = 0

[[entry]]
registry = "voices"
id = "dv2"
type = 0xffffffff
pc = 0

[[entry]]
registry = "voices"
id = "dv3"
type = 0xffffffff
pc = 0

[[entry]]
registry = "voices"
id = "dv4"
type = 0xffffffff
pc = 0

[[entry]]
registry = "voices"
id = "dv5"
type = 0xffffffff
pc = 0

[[entry]]
registry = "voices"
id = "dv6"
type = 0xffffffff
pc = 0

[[entry]]
registry = "voices"
id = "dv7"
type = 0xffffffff
pc = 0
