[module]
id = "core/dsp-link"
version = "0.1.0"
name = "DSP link"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "experimental"
summary = "Sends code and data to the DSP while it runs, through the unused end of the ColdFire's block frame."
ports = ["dt2-1.17", "dn2-1.12"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "untested"
"dn2-1.12" = "untested"

# Constants of the DSP objects (tail geometry, area size) from the device files, written by `patchkit gen`.
[[gen]]
kind = "sharc"
path = "build/gen/device-{dev}.inc"

# The contract's maximum area (the link's 17-bit word offset), a C header for the ColdFire object that both devices share.
[[gen]]
kind = "c-shared"
path = "build/gen/dl-limits.h"

# ColdFire: the hook on the frame sender and the sender's state (both devices; the anchors differ per device).
[[object]]
path = "build/dsp-link-cf.dko.json"
sources = ["src/cf/dsp-link.c", "src/cf/tramp.s"]
place = "cf.expansion"

[object.externs]
dl_stock_send = "cf.link.fn.frame"
dl_tx_lit = "cf.link.site.tx_queue_lit"
dl_rec_lit = "cf.link.site.reply_copy_lit"

[[object]]
path = "build/dsp-link-dt2.dko.json"
sources = ["src/dsp/dt2.s"]
place = "dsp.l2"
devices = ["dt2"]
# window 1 (the voices registry of core/dsp-voice) and window 2 (the effect rows of core/fx); 0 when that module is not in the image
optional = ["_dl_vrows", "_dl_vcount", "_dl_frows", "_dl_fcount", "_dv_diag", "_dv_rec", "_fx_diag", "_fx_rec"]

[object.externs]
_dl_back = "hook.dsp.link.site.block_tail.tail"
_dl_vrows = "voices.rows"
_dl_vcount = "voices.count"
_dl_frows = "fx.rows"
_dl_fcount = "fx.count"

[[object]]
path = "build/dsp-link-dn2.dko.json"
sources = ["src/dsp/dn2.s"]
place = "dsp.l2"
devices = ["dn2"]
# window 1 (the voices registry of core/dsp-voice) and window 2 (the effect rows of core/fx); 0 when that module is not in the image
# `_sp_tail`: the block work of core/sample-pool (the LP0 page receiver's acknowledgement), called at the end of the tail; 0 without that module
optional = ["_dl_vrows", "_dl_vcount", "_dl_frows", "_dl_fcount", "_dv_diag", "_dv_rec", "_fx_diag", "_fx_rec", "_sp_tail"]

[object.externs]
_dl_back = "hook.dsp.link.site.block_tail.tail"
_dl_vrows = "voices.rows"
_dl_vcount = "voices.count"
_dl_frows = "fx.rows"
_dl_fcount = "fx.count"

[[op]]
op = "hook"
hook = "cf.link.hook.block_isr.frame_call"
to = "dl_frame_hook"

[[op]]
op = "hook"
hook = "dsp.link.hook.block_tail"
to = "_dl_hook"

[[claim]]
resource = "dsp.link.site.block_tail"

[[claim]]
resource = "cf.link.site.block_isr.frame_call"
