# The C ABI of the digikit runtime (core/runtime): the exports that the DIGIKIT menu, core/ui and other callers link against, with the structs and
# constants they pass. `patchkit gen` writes from it:
#   modules/core/runtime/include/dkrt.h             the C header (structs with size and offset checks, constants, prototypes)
#   modules/core/runtime/sdk/src/gen_abi.rs         the same for Rust (`dkrt-sdk`), and one function type per export (`sig`)
#   modules/core/runtime/src/rs/src/gen_abi_check.rs  the runtime's functions checked against those types: a changed signature fails the build
# The result codes (`E_*`) and the CAPACITY kinds (`CAPK_*`) are in sdk/sdk.toml ([load.status], [capacity.kinds]) and `SEL_MAX` is
# [limits.max] modules there; the C header repeats them with the prefix DKRT_.
#
# A struct field is "<type> <name>[N][M] // doc"; <type> is u8, u16, u32, i32 or an earlier struct, N is a number, a `usize` const of this file or SEL_MAX.
# Every field lies at a multiple of its alignment and every struct has a size that is a multiple of 4 (no padding), so the layout is the
# same for ColdFire gcc (which aligns a u32 to 2) and for a host. A struct only grows at its end.
# A function is "<ret> <name>(<type> <name>, ...)"; <type> is a scalar, `usize`, a struct, `const` and `*`. `at` is the Rust module
# of the runtime crate that defines it (empty: the crate root).

[[const]]
name = "OK"
type = "i32"
value = 0
doc = "Result of a call that worked. The error codes are negative (`E_*` of sdk/sdk.toml [load.status])."

[[const]]
name = "LOADING"
type = "i32"
value = 1
doc = "The boot-time load of a module with DSP code answers LOADING: its ColdFire part is live, the DSP part follows over the first UI-loop passes. The final result is in DkrtBootInfo.results. A module whose DSP part is still going has state MOD_LOADING in dkrt_module."

[[const]]
name = "STATE_IDLE"
type = "u32"
value = 0
doc = "DkrtStatus.state: nothing is being sent."

[[const]]
name = "STATE_LOADING"
type = "u32"
value = 1
doc = "DkrtStatus.state: a module's DSP code is being sent."

[[const]]
name = "STATE_UNLOADING"
type = "u32"
value = 2
doc = "Archived with hot reload; never reported now."

[[const]]
name = "MOD_LOADED"
type = "u32"
value = 0
doc = "DkrtModule.state: the module is live."

[[const]]
name = "MOD_LOADING"
type = "u32"
value = 1
doc = "DkrtModule.state: its DSP part is still being sent."

[[const]]
name = "CAP_MAX"
type = "usize"
value = 16
doc = "Room for the entries a caller of dkrt_capacity gives (the runtime has 14 kinds; new kinds are appended)."

[[const]]
name = "HEALTH_MAGIC"
type = "u32"
value = 0x484c5448
doc = "DkrtHealth.magic, \"HLTH\"."

[[const]]
name = "HEALTH_MODULE"
type = "u32"
value = 1
doc = "DkrtHealth.flags: the image has core/health."

[[const]]
name = "HEALTH_CPU"
type = "u32"
value = 2
doc = "DkrtHealth.flags: the CPU load is valid (a second window closed)."

[[const]]
name = "HEALTH_DSP"
type = "u32"
value = 4
doc = "DkrtHealth.flags: the DSP figures are valid (a window with counts)."

[[const]]
name = "HEALTH_HEAP"
type = "u32"
value = 8
doc = "DkrtHealth.flags: the heap figures are valid."

[[const]]
name = "HEALTH_HEAP_CUT"
type = "u32"
value = 16
doc = "DkrtHealth.flags: the heap walk stopped at its bound (the free figure is a lower bound)."

[[const]]
name = "HEALTH_HEAP_BAD"
type = "u32"
value = 32
doc = "DkrtHealth.flags: the free lists looked corrupt (the walk stopped)."

[[const]]
name = "HEALTH_STORE"
type = "u32"
value = 64
doc = "DkrtHealth.flags: the store figures are valid (a store header was read; a card without a store has none)."

[[const]]
name = "SEL_PATH"
type = "usize"
value = 56
doc = "Bytes of one path of the selection, with the NUL: a store path has at most SEL_PATH - 1 characters."

[[const]]
name = "SAFE_NONE"
type = "u32"
value = 0
doc = "DkrtBootInfo.reason: this boot is not in safe mode."

[[const]]
name = "SAFE_COUNTER"
type = "u32"
value = 1
doc = "DkrtBootInfo.reason: two boots in a row did not reach the UI loop."

[[const]]
name = "SAFE_KEY"
type = "u32"
value = 2
doc = "DkrtBootInfo.reason: the safe-mode key was held at power-on."

[[const]]
name = "SAFE_FLAG"
type = "u32"
value = 3
doc = "DkrtBootInfo.reason: the selection record asked for it (DkrtSelection.flags bit 0)."

[[const]]
name = "SAFE_DSP"
type = "u32"
value = 4
doc = "DkrtBootInfo.reason: the boot before left a hang record because the DSP stopped (the watch found its heartbeat frozen)."

[[const]]
name = "SAFE_PANIC"
type = "u32"
value = 5
doc = "DkrtBootInfo.reason: the boot before left a panic record (the runtime's Rust code panicked)."

[[const]]
name = "FAULT_ROWS"
type = "usize"
value = 4
doc = "Rows of DkrtDiag.fault_text."

[[const]]
name = "SAFE_AFTER"
type = "u32"
value = 2
doc = "Boots in a row that did not stay up for STABLE_BLOCKS after which the next one is safe mode."

[[const]]
name = "STABLE_BLOCKS"
type = "u32"
value = 45000
doc = "The stable period: DSP blocks (1500 per second) of UI loop after which the boot counter is cleared (30 seconds)."

[[const]]
name = "CARD_UNKNOWN"
type = "u32"
value = 0
doc = "DkrtDiag.card_state: not checked."

[[const]]
name = "CARD_OURS"
type = "u32"
value = 1
doc = "DkrtDiag.card_state: a valid store header, or a valid selection copy: the area is ours."

[[const]]
name = "CARD_BLANK"
type = "u32"
value = 2
doc = "DkrtDiag.card_state: no structure of ours, and every sector of the range reads all 0x00 or all 0xFF: the first write may claim it."

[[const]]
name = "CARD_FOREIGN"
type = "u32"
value = 3
doc = "DkrtDiag.card_state: something else is there: the runtime never writes the card."

[[const]]
name = "CARD_UNREADABLE"
type = "u32"
value = 4
doc = "DkrtDiag.card_state: a read of the area failed: the runtime cannot tell, so it never writes the card."

[[const]]
name = "CARD_TOO_SMALL"
type = "u32"
value = 5
doc = "DkrtDiag.card_state: the card is smaller than the store area (its last sector cannot be read): there is no store."

[[const]]
name = "DIAG_MAGIC"
type = "u32"
value = 0x44494147
doc = "DkrtDiag.magic, \"DIAG\"."

[[const]]
name = "SCAN_MAX"
type = "usize"
value = 32
doc = "Entries of a dkrt_scan and rows of a dkrt_fit."

[[const]]
name = "SCAN_COMPAT"
type = "u32"
value = 1
doc = "DkrtScan.flags: the file's header does not refuse this runtime or device (a file that is not a .dkm or cannot be read passes: the runtime names the reason at boot)."

[[const]]
name = "SCAN_NEEDS"
type = "u32"
value = 2
doc = "DkrtScan.flags: the need_* fields are valid (a readable .dkm of this format)."

[[const]]
name = "SCAN_LOADED"
type = "u32"
value = 4
doc = "DkrtScan.flags: the runtime has the file loaded in this boot."

[[const]]
name = "SCAN_LOADING"
type = "u32"
value = 8
doc = "DkrtScan.flags: with SCAN_LOADED, its DSP part is still being sent."

[[const]]
name = "SCAN_TRACE"
type = "u32"
value = 16
doc = "DkrtScan.flags: the file was packed with `patchkit pack --trace` (bit 31 of the header word at 0x30). The loader does not look at it."

[[const]]
name = "FIT_LINE"
type = "usize"
value = 24
doc = "Bytes of DkrtFitOut.line, with the NUL."

[[const]]
name = "FIT_REASON"
type = "usize"
value = 40
doc = "Bytes of DkrtFitRow.reason, with the NUL."

[[const]]
name = "FIT_BRIEF"
type = "usize"
value = 32
doc = "Bytes of DkrtFitRow.brief, with the NUL."

[[const]]
name = "FIT_MEM"
type = "usize"
value = 8
doc = "Bytes of DkrtFitRow.mem, with the NUL."

# ---- structs ---------------------------------------------------------------------------------------------------------------

[[struct]]
name = "DkrtStatus"
doc = "dkrt_status result. The caller owns the memory; the layout only grows at the end."
fields = [
    "u32 magic // 'DKRT'",
    "u32 runtime // RUNTIME_VERSION, major << 16 | minor << 8 | patch",
    "u32 device // the digikit device id",
    "u32 arena_base // the module arena",
    "u32 arena_size",
    "u32 arena_free",
    "u32 arena_largest",
    "u32 modules // modules loaded",
    "u32 ticks // UI-loop passes seen",
    "i32 last_result // result of the last load",
    "u32 loads",
    "u32 slot_calls",
    "u32 state // STATE_IDLE or STATE_LOADING (a module's DSP code is being sent)",
    "u32 dsp_size // bytes of the DSP area (0: the image has none)",
    "u32 dsp_free // bytes of it free",
    "u32 dsp_largest // the largest free range",
]

[[struct]]
name = "DkrtCap"
doc = "One entry of dkrt_capacity (the CAPACITY command's entries; kind is a CAPK_* number). largest is 0 where a largest piece has no meaning. The layout only grows at the end."
derive = ["Clone", "Copy"]
fields = [
    "u32 kind // CAPK_*",
    "u32 limit",
    "u32 used",
    "u32 largest",
]

[[struct]]
name = "DkrtHealth"
doc = "dkrt_health result (finding 41). The caller owns the memory; the layout only grows at the end. A figure is valid when its flag is set; the others are 0. Loads are in tenths of a percent (0 to 1000)."
fields = [
    "u32 magic // HEALTH_MAGIC",
    "u32 version // 3",
    "u32 flags // HEALTH_*",
    "u32 blocks // DSP blocks seen since boot (1500 per second)",
    "u32 windows // windows (one second each) closed",
    "u32 cpu_x10 // CPU load of the last window, tenths of a percent, relative to the quietest window since boot (HEALTH_CPU)",
    "u32 idle_win // the idle-loop iterations in the last window",
    "u32 idle_ref // the best window so far (100 % idle)",
    "u32 dsp_avg // DSP block handler, cycles per block, average of the last window (the DSP's own EMUCLK difference)",
    "u32 dsp_max // maximum of the last window",
    "u32 dsp_period // the cycles a block has (DSP_BLOCK_CYCLES)",
    "u32 dsp_avg_x10 // dsp_avg as tenths of a percent of dsp_period, an assumed 1 GHz block (finding 100) (HEALTH_DSP)",
    "u32 dsp_max_x10 // dsp_max as tenths of a percent of dsp_period",
    "u32 heap_total // the firmware heap (HEALTH_HEAP): bytes in all",
    "u32 heap_free",
    "u32 heap_largest // the largest free block",
    "u32 heap_allocs // live allocations",
    "u32 heap_free_blocks // free blocks walked",
    "u32 arena_total // the runtime's module arena: bytes in all",
    "u32 arena_free",
    "u32 arena_largest",
    "u32 dsp_area_total // the DSP area (0: the image has none): bytes in all",
    "u32 dsp_area_free",
    "u32 dsp_area_largest",
    "u32 store_total // the module store (HEALTH_STORE), in KiB: the store may use in all (header, tables and files)",
    "u32 store_used // KiB the current header says are used",
    "u32 store_free // KiB a new file may still take in all (the room for the table's next entry kept back; not one contiguous piece)",
]

[[struct]]
name = "DkrtStoreEntry"
doc = "A store file for the DIGIKIT menu (dkrt_store_list): its path (at most 63 bytes, NUL-terminated), the first sector (relative to the store) and the size in bytes."
fields = [
    "u8 path[64]",
    "u32 first",
    "u32 size",
]

[[struct]]
name = "DkrtStoreFile"
doc = "A store file as dkrt_store_stat found it, for an adapter that streams it (dkrt_store_read): the first sector (relative to the store), the size in bytes and the sha256 of the table entry. The file's sectors are contiguous: sector n of the file is store sector first + n."
fields = [
    "u32 first",
    "u32 size",
    "u8 sha[32]",
]

[[struct]]
name = "DkrtModule"
doc = "dkrt_module result: one loaded module."
fields = [
    "u8 name[32]",
    "u32 version",
    "u32 base",
    "u32 size",
    "u32 slots // bit n = slot n bound",
    "u8 path[64] // store path the module was loaded from (NUL-terminated, at most 63 bytes kept), for example modules/dyn-demo.dkm",
    "u32 state // MOD_LOADED or MOD_LOADING",
    "u32 dsp_size // bytes of the module's range in the DSP area (0: none)",
    "u32 menu // address of the module's dkm_menu(dk_ui_menu *, void *) settings entry point (0: none)",
]

[[struct]]
name = "DkrtFx"
doc = "dkrt_fx result: one effect with a page (FX routing, finding 62 to 65). Routes are bit masks: 1 master, 2 send."
fields = [
    "u32 row // the effect's row in the chain",
    "u32 allowed // the routes the effect's record allows (routes of the manifest)",
    "u32 dflt // its default route (route)",
    "u32 running // the route it runs on in this boot",
    "u32 saved // the route the settings give it now (the stored one when allowed, else the default): differs from running after a change before the restart",
    "u8 tab[8] // the tab label of its page (NUL-terminated, up to 3 characters)",
    "u8 id[32] // the id of its module (NUL-terminated): the settings key is fx/route/<id>",
]

[[struct]]
name = "DkrtSelection"
doc = "The selection (what the next boot loads), the layout the menu passes to dkrt_selection_set and gets from dkrt_selection_get. Paths are store paths (modules/dyn-pluck.dkm), NUL terminated, at most SEL_PATH - 1 characters."
fields = [
    "u32 count // number of paths in use, 0 to SEL_MAX",
    "u32 flags // bit 0: start in safe mode once (the boot that honours it clears the bit)",
    "u8 paths[SEL_MAX][SEL_PATH]",
]

[[struct]]
name = "DkrtBootInfo"
doc = "dkrt_boot_info result: this boot."
fields = [
    "u32 magic // 'DKBT'",
    "u32 version",
    "u32 safe // 1 when this boot loaded nothing because of safe mode",
    "u32 reason // SAFE_* why",
    "u32 counter // the boot counter as the record held it at the start of this boot (before the runtime raised it)",
    "u32 seq // sequence number of the record in use (0: no valid record)",
    "u32 copy // which copy held it (0 = A, 1 = B)",
    "u32 count // modules selected",
    "u32 loaded // how many of them loaded without an error",
    "u32 ui_reached // 1 once the UI loop has run (the boot counter is back to 0)",
    "i32 results[SEL_MAX] // OK, a negative code, or LOADING (the CF part is live, the DSP part is still going) per selected module, in selection order",
    "u32 dsp_wait // reserved (0): the boot does not wait for DSP code",
    "u32 stable // 1 once the boot counter is back to 0: after STABLE_BLOCKS DSP blocks of UI loop in a normal boot, at the first UI-loop pass in a safe boot",
]

[[struct]]
name = "DkrtDiag"
doc = "dkrt_diag result (finding 46): what the debug log and the card check found. The caller owns the memory; the layout only grows at the end."
fields = [
    "u32 magic // DIAG_MAGIC",
    "u32 version",
    "u32 card_state // CARD_*",
    "u32 card_first_nonblank // the first sector (relative to the store) that was not blank (0xffffffff: none)",
    "u32 card_hash // a crc32 of it",
    "u32 card_refused // card writes refused (range or read-only)",
    "u32 card_read_errors // reads that failed in the check",
    "u32 debug_on // 1 while a debug module (the log sink) is loaded",
    "u32 log_oldest // 0 (the log ring is the debug module's; its LOG command has the range)",
    "u32 log_newest // 0",
    "u32 dsp_diag_ok // 1 when dl_diag is in the image and answered",
    "u32 dsp_stopped // 1 when the heartbeat watch decided the DSP stopped",
    "u32 dsp_heartbeat // the last heartbeat word",
    "u32 crash_found // a crash record from the boot before was found at this boot: 1",
    "u32 crash_pc // its program counter",
    "u32 crash_vec // its vector",
    "u32 ram_kept // 1 when the keep-probe word of the boot before was still in RAM at this boot (RAM survived the reset that led here)",
    "u32 dsp_crumb // the DSP's last breadcrumb when the watch decided it stopped (0 before): stage | voice << 8 | machine type << 16 (finding 48)",
    "u32 fault_rows // rows of fault_text that are filled: the last fault kept in the settings key dk/fault (0: none)",
    "u8 fault_text[FAULT_ROWS][24] // the ABOUT rows of that fault, upper case, at most 18 characters (the ABOUT page width on DT2) and a NUL",
]

[[struct]]
name = "DkrtModuleHeader"
doc = "dkrt_module_header result: what the DIGIKIT menu shows of a .dkm header. The layout only grows at the end."
fields = [
    "u32 version // the module's version, major << 16 | minor << 8 | patch",
]

[[struct]]
name = "DkrtScan"
doc = "One .dkm file of the store as dkrt_scan found it: where it is, what its header says and the needs inferred from its contents (dkneeds). The need_* fields are valid when SCAN_NEEDS is set."
derive = ["Clone", "Copy"]
fields = [
    "u8 path[64] // store path, NUL-terminated, for example modules/dyn-demo.dkm",
    "u32 first // first sector (relative to the store)",
    "u32 size // bytes",
    "u32 flags // SCAN_*",
    "u32 need_file_size // the file's size: it must fit the staging buffer",
    "u32 need_arena // the arena block of image and bss",
    "u32 need_arena_xfer // the arena block of the relocated DSP image, held while it is sent (0: no DSP section)",
    "u32 need_dsp_area // DSP area bytes: image, bss and voice states (0: no DSP section)",
    "u32 need_dsp_align",
    "u32 need_machine_rows",
    "u32 need_voice_rows",
    "u32 need_param_rows",
    "u32 need_page_rows",
    "u32 need_fx_slots",
]

[[struct]]
name = "DkrtFitRow"
doc = "The fit verdict of one DkrtScan entry. wont is 1 when the module does not fit next to the ticked ones; then short_* is the first short resource (a CAPK_* kind, what the module needs and what is free) and the texts say it. mem is the memory the module takes (arena and DSP area) as text."
derive = ["Clone", "Copy"]
fields = [
    "u32 wont",
    "u32 short_kind",
    "u32 short_need",
    "u32 short_free",
    "u8 reason[FIT_REASON] // upper case, for a popup: DSP 400K > 254K FREE",
    "u8 brief[FIT_BRIEF] // for a list row: DSP 400K>254K",
    "u8 mem[FIT_MEM] // <1K, 259K, 1.2M; empty without SCAN_NEEDS",
]

[[struct]]
name = "DkrtFitOut"
doc = "dkrt_fit result: one row per entry and the load line of the ticked set."
fields = [
    "u32 count // rows written",
    "u8 line[FIT_LINE] // DSP 52% CPU 1%; empty when nothing is ticked",
    "DkrtFitRow rows[SCAN_MAX]",
]

# ---- exports ---------------------------------------------------------------------------------------------------------------

[[fn]]
name = "dkrt_status"
sig = "void dkrt_status(DkrtStatus *out)"
doc = "Fill out: the runtime's own state."

[[fn]]
name = "dkrt_load"
sig = "i32 dkrt_load(const u8 *path)"
doc = "Load the module at store path (NUL-terminated). Only at boot: after it, E_BOOT_ONLY."

[[fn]]
name = "dkrt_module"
sig = "i32 dkrt_module(u32 index, DkrtModule *out)"
doc = "The index-th loaded module (in load-slot order); OK, or E_NOT_FOUND past the end."

[[fn]]
name = "dkrt_fx"
sig = "i32 dkrt_fx(u32 index, DkrtFx *out)"
doc = "The index-th loaded effect that has a page (row order): tab, module id, allowed routes, default, the route it runs on and the route the settings give it; OK, or E_NOT_FOUND past the end."

[[fn]]
name = "dkrt_health"
sig = "void dkrt_health(DkrtHealth *out)"
doc = "CPU load, the DSP's block time, the heap, the arena and the DSP area (finding 41). The heap walk is bounded: ask twice a second at most."

[[fn]]
name = "dkrt_capacity"
sig = "u32 dkrt_capacity(DkrtCap *out, u32 max)"
doc = "The CAPACITY command's entries (limit, used, largest per resource); how many were written, at most max."

[[fn]]
name = "dkrt_blocks"
sig = "u32 dkrt_blocks()"
doc = "DSP blocks since boot (a 1500 Hz clock); 0 without core/health."

[[fn]]
name = "dkrt_poll_set"
sig = "void dkrt_poll_set(usize f)"
doc = "Register (or, with 0, remove) a function that the UI loop calls once per pass, in the UI task. One caller only."

[[fn]]
name = "dkrt_diag"
sig = "void dkrt_diag(DkrtDiag *out)"
doc = "The card check, the debug log, the DSP watch and the crash record (finding 46)."

[[fn]]
name = "dkrt_store_list"
sig = "i32 dkrt_store_list(const u8 *prefix, DkrtStoreEntry *out, u32 max)"
doc = "The files of the module store whose path starts with prefix (NUL-terminated), sorted by path, at most max into out: the count, or a negative code (E_NOT_FOUND: no store)."

[[fn]]
name = "dkrt_poll_add"
sig = "i32 dkrt_poll_add(usize f)"
doc = "Add a function that the UI loop calls once per pass, in the UI task, next to the one of dkrt_poll_set (room for 4). Adding a function that is in the table is OK. E_NOMEM when the table is full. core/ui uses it for dk_ui_tick."

[[fn]]
name = "dkrt_poll_remove"
sig = "void dkrt_poll_remove(usize f)"
doc = "Remove a function added with dkrt_poll_add; no effect when it is not in the table."

[[fn]]
name = "dkrt_store_stat"
sig = "i32 dkrt_store_stat(const u8 *path, DkrtStoreFile *out)"
doc = "Look a store file up by path (NUL-terminated) and fill out: OK, E_NOT_FOUND (no store, no such file, a folder), or a card error. It reads the store headers and scans the table through the runtime's staging buffer, so call it only at the start of a load, not while a staged module read is in progress. A file of size 0 is found."
at = "store"

[[fn]]
name = "dkrt_store_read"
sig = "i32 dkrt_store_read(const DkrtStoreFile *f, u32 sector, u32 count, u8 *dst)"
doc = "Read count sectors of the file f, starting at its sector `sector`, into dst (512 bytes per sector). dst must be 16-byte aligned (E_CONTRACT otherwise). count is 1 to 128 and the range lies inside the file, rounded up to whole sectors (E_RANGE otherwise). No sha check, no staging buffer: the caller owns dst. OK or E_READ."
at = "store"

[[fn]]
name = "dkrt_module_header"
sig = "i32 dkrt_module_header(u32 first, DkrtModuleHeader *out)"
doc = "The header fields of the .dkm that starts at store sector first (DkrtScan.first) into out: OK, E_FORMAT when the file is not a .dkm, or E_READ / E_NOT_FOUND when its first sector cannot be read. The runtime does the card read itself."

[[fn]]
name = "dkrt_selection_get"
sig = "i32 dkrt_selection_get(DkrtSelection *out)"
doc = "The saved selection (what the next boot loads): count store paths. Always OK."

[[fn]]
name = "dkrt_selection_set"
sig = "i32 dkrt_selection_set(const DkrtSelection *sel)"
doc = "Save a selection (two copies in the card's store range); OK or an E_SEL_* code. No effect until the next boot."

[[fn]]
name = "dkrt_boot_info"
sig = "void dkrt_boot_info(DkrtBootInfo *out)"
doc = "This boot: safe mode and why, the modules selected and each one's result."

[[fn]]
name = "dkrt_restart"
sig = "i32 dkrt_restart()"
doc = "Write pending settings, then soft reset. Returns only when it refuses (E_CARD_BUSY, ...)."

[[fn]]
name = "dkrt_settings_put"
sig = "i32 dkrt_settings_put(const u8 *key, const u8 *value, u32 len)"
doc = "digikit's settings (finding 63): set key (NUL-terminated) to len bytes; written to the card 2 s later, or at once by the flush. OK or an E_SET_* code."
at = "settings"

[[fn]]
name = "dkrt_settings_flush"
sig = "i32 dkrt_settings_flush()"
doc = "Write the settings record now."
at = "settings"

[[fn]]
name = "dkrt_scan"
sig = "i32 dkrt_scan(DkrtScan *out, u32 max)"
doc = "The .dkm files of the store under modules/ in path order, at most max (up to SCAN_MAX) into out: the count, or a negative code (E_NOT_FOUND: no store, E_READ: the card). Per file: whether its header is accepted by this runtime and device (SCAN_COMPAT), the needs inferred from its contents (SCAN_NEEDS) and whether it is loaded (SCAN_LOADED, SCAN_LOADING). It reads the header words and the sectors the needs take, one sector at a time; the number of sector reads for the needs is dkrt_scan_reads."
at = "scan"

[[fn]]
name = "dkrt_scan_reads"
sig = "u32 dkrt_scan_reads()"
doc = "The sector reads the last dkrt_scan made to read the needs (the cost of opening a list of modules)."
at = "scan"

[[fn]]
name = "dkrt_fit"
sig = "i32 dkrt_fit(const DkrtScan *entries, u32 n, const u8 *ticked, DkrtFitOut *out)"
doc = "Which modules fit. The ticked set loads at the next boot into an empty runtime: start from the limits (nothing used) and take in the ticked entries (ticked[i] != 0) in list order; a ticked one that does not fit is flagged and not taken. Then each unticked entry is checked against what the ticked ones leave. An entry without SCAN_COMPAT or without SCAN_NEEDS has no verdict (wont 0). n is at most SCAN_MAX. OK."
at = "scan"

# The sample backing's events, called by the adapter core/sample-pool (plug-in point dkrt_pool.h, docs/design/sample-api-1.5.md 2.2).

[[fn]]
name = "dkrt_pool_done"
sig = "void dkrt_pool_done(u32 req, i32 result)"
doc = "Adapter to runtime: the load `req` of dkpool_load finished. result is OK (the handle `out` is filled), E_POOL, E_READ or E_FORMAT. Only from dkpool_tick."
at = "tracks"

[[fn]]
name = "dkrt_pool_lost"
sig = "void dkrt_pool_lost()"
doc = "Adapter to runtime: the backing was lost (a stock reset), every handle is invalid. Only from dkpool_tick."
at = "tracks"

[[fn]]
name = "dkrt_project_changed"
sig = "void dkrt_project_changed(u32 slot)"
doc = "Adapter to runtime: the current project slot changed. The runtime never reads the byte."
at = "tracks"
