# The Storage contract: what the core expects of `Storage` (modules/core/runtime/abi/src/storage.rs). One table, two checkers:
#   host    `FakeStorage` (src/rs/src/fake_storage.rs) answers every row; the real adapter answers the same rows
#   device  `storage.device.test.ts` runs the rows with `device = "list"` on the real adapter of each device, through the listing of test/files-proof
# A row with no device checker says why in `device_pending`. The rows are line based (`key = value`, one per line): the host test reads them without a
# TOML crate, and a row has no other lines.
#
# The tree is the same on both sides. A file holds the ramp: byte i is (i * 31 + 7) & 255. A `[[file]]` with `device = "no"` is for the host only.
# Order is not part of the contract: a listing is compared as a set. On the DT2 the samples root is the firmware file system, which adds a
# 16-byte trailer to the size that a listing reports (`dt2_samples_trailer`); the store route (DN2 samples, both store roots) reports the bytes sent.
#
# call     stat | read_head | stat_head | read_range | read_all | list | path_max
# root     samples | store | other (a root the core does not know)
# devices  (list rows only) the devices that run the row; absent: both
# path     root-relative; or `path_len` = N (N times "a"), "max" or "max+1" (the root's limit, and one more); or `path_nul` = "yes" (a path with a NUL)
# expect   the result: `dir`, `file size=N`, `file size=N head=H`, `ok`, `n=N` (bytes read; they are the ramp), `size=N`, `N`, `profile`
#          (path_max of samples: the device profile's), `list` (with `entries`: all `name:file:size` and `name:dir`; or `includes`: at least these), or `E_*` (the error)

dt2_samples_trailer = 16

[[file]]
root = "samples"
path = "KICKS/K1"
size = 100

[[file]]
root = "samples"
path = "KICKS/K2"
size = 64

[[file]]
root = "samples"
path = "KICKS/SUB/deep"
size = 10

[[file]]
root = "samples"
path = "SMALL"
size = 10
device = "no"

[[file]]
root = "samples"
path = "ZERO"
size = 0
device = "no"

[[file]]
root = "store"
path = "cases/a"
size = 100

[[file]]
root = "store"
path = "cases/sub/b"
size = 10

# ---- path_max

[[case]]
id = "path_max_store"
what = "the store root's longest path is the store path limit"
call = "path_max"
root = "store"
expect = "159"
device_pending = "no host-reachable call for stat/read_head/read_range/read_all/path_max"

[[case]]
id = "path_max_samples"
what = "the samples root's longest path is the device profile's sample path limit"
call = "path_max"
root = "samples"
expect = "profile"
device_pending = "no host-reachable call for stat/read_head/read_range/read_all/path_max"

[[case]]
id = "path_max_other"
what = "a root the core does not know has no path"
call = "path_max"
root = "other"
expect = "0"
device_pending = "no host-reachable call for stat/read_head/read_range/read_all/path_max"

