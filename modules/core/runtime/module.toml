[module]
id = "core/runtime"
version = "0.5.11"
name = "digikit runtime"
category = "core"
role = "runtime"
type = "framework"
author = "digikit"
status = "experimental"
summary = "Loads modules from the card module store into a private arena at run time (emulator only, no menu yet)"
requires = ["core/expansion"]
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.11" = "experimental"
"dn2-1.12" = "experimental"

# The runtime: Rust, built with rustc_codegen_gcc for -mcpu=54418 (finding 26). Its bss holds the module arena
# (DKRT_ARENA, 512 KiB) and the staging buffer (64 KiB), so patchkit reserves both together with the code and no other
# static object can overlap them. The Rust object has no externs table: it calls the firmware through the generated crate `dkfw`
# (modules/core/fw, from devices/fw/), whose symbols are the anchor names resolved at patch time.
[[object]]
path = "build/runtime.dko.json"
sources = ["src/rs/Cargo.toml"]
place = "cf.expansion"
# The run-time registry's table of addresses (core/dynreg), the DSP code channel (core/dsp-link: dl_send, dl_send_win, dl_poll) and
# the table of DSP addresses (core/dyndsp) and the effect chain's table (core/dynfx) and the effect pages' (core/fxpages); each is 0 when its module is not in the image.
# `input_key`, `input_turn`, `usb_bulk_*`, `dl_set_tick_cb`, the `dk_ui_*` calls and the service imports of the providers (`dk_input_*`, `dk_usb_bulk_*`, `dk_dsp_link_*`, `dk_ui_menu_*`, `dk_ui_item_*`) are the imports of sdk/sdk.toml with `requires` (the runtime links them to modules by name; `optional_imports!` in lib.rs).
optional = ["mf_native_register", "mf_native_register_v2", "mf_native_remove", "mf_native_turn", "dynreg_info", "dl_send", "dl_send_win", "dl_poll", "dl_diag", "dl_set_tick_cb", "dl_tick_cb_drop", "dyndsp_info", "dynfx_info", "fxpages_info", "dkpool_version", "dkpool_load", "dkpool_release", "dkpool_check", "dkpool_free_frames", "dkpool_tick", "dkpool_cancel", "dkpool_peaks", "dkpool_window_step", "dkpw_version", "dkpw_begin", "dkpw_write", "dkpw_close", "dkpw_abort", "dkpw_delete", "dkpw_recover", "dkpw_staging", "health_read", "health_heap", "introblank_table", "input_key", "input_turn", "usb_bulk_enable", "usb_bulk_disable", "usb_bulk_take", "usb_bulk_release", "usb_bulk_send", "usb_bulk_state", "usb_bulk_takeover", "usb_bulk_giveback", "dk_ui_has", "dk_ui_menu_new", "dk_ui_open", "dk_ui_close", "dk_ui_select", "dk_ui_is_open", "dk_ui_refresh", "dk_ui_action", "dk_ui_submenu", "dk_ui_text", "dk_ui_toggle", "dk_ui_value", "dk_ui_check", "dk_ui_checked", "dk_ui_confirm", "dk_ui_choice", "dk_ui_toast", "dk_ui_tick", "dk_ui_service_open", "dk_ui_menu_open", "dk_ui_menu_close", "dk_ui_menu_select", "dk_ui_menu_refresh", "dk_ui_menu_is_open", "dk_ui_item_text", "dk_ui_item_action", "dk_ui_item_submenu", "dk_ui_item_toggle", "dk_ui_item_value", "dk_ui_item_check", "dk_ui_item_checked", "dk_input_open", "dk_input_key", "dk_input_turn", "dk_usb_bulk_open", "dk_usb_bulk_enable", "dk_usb_bulk_disable", "dk_usb_bulk_take", "dk_usb_bulk_release", "dk_usb_bulk_send", "dk_usb_bulk_state", "dk_usb_bulk_takeover", "dk_usb_bulk_giveback", "dk_dsp_link_open", "dk_dsp_link_set_tick"]

# Constants from the device files (devices/*.toml, core/machines types.toml), written by `patchkit gen`; docs/design/device-data.md.
# The runtime is one image for all devices: `rust` and `gas-shared` hold what every device agrees on (gen refuses a difference), `gas`
# the per-device numbers of the device objects below.
[[gen]]
kind = "rust"
path = "sdk/src/device.rs"
uses = ["DYN_TYPE_FIRST", "DYN_TYPE_LAST", "DYN_TYPES", "DDR_CACHED_BASE", "DDR_BYTES", "ESDHC_BASE", "SAFE_KEY_CODE",
    "DSP_BLOCK_CYCLES", "KEEP_BASE", "KEEP_BYTES", "LIMIT_MODULES", "LIMIT_MACHINE_ROWS", "LIMIT_ARENA_BYTES",
    "LIMIT_STAGE_BYTES"]

[[gen]]
kind = "gas-shared"
path = "build/gen/device.inc"
uses = ["CONSOLE_UART_BASE", "DDR_UNCACHED_ALIAS"]

[[gen]]
kind = "gas"
path = "build/gen/device-{dev}.inc"
uses = ["DEVICE_ID", "DEVICE_NAME_WORD", "STORE_FIRST", "STORE_SECTORS", "PEEK_N", "FX_SOUND_WORDS", "PEEK_LO_*", "PEEK_HI_*"]

# The UI-loop hook trampoline and the cache flush (assembly).
[[object]]
path = "build/tramp.dko.json"
sources = ["src/cf/tramp.s"]
place = "cf.expansion"

[object.externs]
fw_queue_pop = "cf.rtos.fn.queue_pop"
dkrt_boot_next = "hook.cf.rtos.site.main_os_task.tail"
dkrt_midi_next = "hook.cf.midi.site.rx.tail"
dkrt_midi_ret = "hook.cf.midi.site.rx.return"
dkrt_pagekey_next = "hook.cf.page.fn.source_key.tail"
dkrt_pageturn_next = "hook.cf.page.fn.source_turn.tail"

[[object]]
path = "build/device-dt2.dko.json"
sources = ["src/cf/dt2/device.s"]
place = "cf.expansion"
devices = ["dt2"]

[[object]]
path = "build/device-dn2.dko.json"
sources = ["src/cf/dn2/device.s"]
place = "cf.expansion"
devices = ["dn2"]

# The call at the top of the UI task's event loop that pops the next event from the UI queue
# (`pea queue; jsr pop; addq.l #4,sp; moveq #0x29,d1; ...`) goes to the trampoline, which runs the runtime's tick and
# continues in the stock pop.
[[op]]
op = "hook"
hook = "cf.view.hook.ui_loop"
to = "dkrt_loop_hook"

[[claim]]
resource = "cf.view.site.ui_loop"

# Boot-time loading (finding 37): the entry of the main-OS task jumps to the boot hook, which reads the selection record and loads
# the selected modules (src/cf/tramp.s dkrt_boot_hook), then runs the displaced prologue and continues in the task. That is before the
# task builds its singletons, and the MainScreenView (and with it the machine selection view, which reads the machine list once) is
# built by one of them well before the call that the first design hooked (measured: the view existed at that call).
[[op]]
op = "hook"
hook = "cf.rtos.hook.main_os_task"
to = "dkrt_boot_hook"

[[claim]]
resource = "cf.rtos.site.main_os_task"

# Module upload (docs/design/digikit-upload.md): the MIDI task's dispatch of a gathered USB (cable 0) SysEx message. The two displaced
# instructions `movea.l (0,A2,D1*4),A0; jsr (A0)` call the router with (msg, len, source) already pushed. The hook runs the runtime's
# dkrt_midi_rx first: it returns 1 for a message of ours (continue after the call: the tail that frees the gathered blocks), 0 to run the
# displaced router call unchanged (docs/findings/43-digikit-upload.md). The same 428-byte task function is on all four ports.
[[op]]
op = "hook"
hook = "cf.midi.hook.rx"
to = "dkrt_midi_hook"

[[claim]]
resource = "cf.midi.site.rx"

# The encoder click on a machine's page (docs/design/machine-page-click.md): hooks at the entry of the page's key handler and turn handler,
# on both devices. They call dkrt_page_key and dkrt_page_turn (src/rs/src/pageclick.rs) and then run the stock handler; they never consume an
# event, and cost one test of a flag while no loaded module declares a click action.
[[op]]
op = "hook"
hook = "cf.page.hook.source_key"
to = "dkrt_pagekey_hook"

[[claim]]
resource = "cf.page.fn.source_key"

[[op]]
op = "hook"
hook = "cf.page.hook.source_turn"
to = "dkrt_pageturn_hook"

[[claim]]
resource = "cf.page.fn.source_turn"
