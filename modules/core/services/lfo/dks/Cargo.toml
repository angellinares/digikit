[package]
name = "dkrt-svc-lfo-dks"
version = "0.1.0"
edition = "2021"
publish = false
description = "The lfo service as a service file (.dks): the crate dkrt-svc-lfo behind the glue of dkrt-svc-rt"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
dkrt-sdk = { path = "../../../runtime/sdk" }
dkrt-svc-rt = { path = "../../../runtime/svc-rt" }
dkrt-svc-lfo = { path = ".." }

# This crate sits inside the repository's cargo workspace tree but is built on its own (`patchkit build`).
[workspace]

[profile.release]
opt-level = "s"
panic = "abort"
lto = false
codegen-units = 1
debug = false
