[module]
id = "core/services/lfo"
version = "0.8.2"
name = "lfo service"
category = "core"
role = "service"
service = "lfo"
type = "raw"
author = "digikit"
status = "experimental"
summary = "The lfo service of the runtime as a service file: it owns the lfo_shape record kind"
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# Rust, built with rustc_codegen_gcc for -mcpu=54418 (`patchkit build`). Packed as a .dks (`patchkit pack core/services/lfo`): the file is `lfo.dks`.
[[object]]
path = "build/lfo.dko.json"
sources = ["Cargo.toml"]
place = "cf.expansion"
