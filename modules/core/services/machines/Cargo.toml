[package]
name = "dkrt-svc-machines"
version = "0.1.0"
edition = "2021"
publish = false
description = "The machines service of the digikit runtime: machine types, parameters, pages, page clicks and native pages, linked into the runtime object (interface B handlers over CoreApi)"

[lib]
path = "src/lib.rs"

[dependencies]
dkrt-abi = { path = "../../runtime/abi" }
dkrt-sdk = { path = "../../runtime/sdk" }
dkneeds = { path = "../../../../packages/dkneeds" }

[dev-dependencies]
dkrt-test-support = { path = "../../runtime/test-support" }
