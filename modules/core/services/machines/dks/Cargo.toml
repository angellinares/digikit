[package]
name = "dkrt-svc-machines-dks"
version = "0.1.0"
edition = "2021"
publish = false
description = "The machines service as a service file (.dks): the crate dkrt-svc-machines behind the glue of dkrt-svc-rt, with the hooks of the machine framework"

[lib]
crate-type = ["staticlib", "rlib"]
# the library holds assembler for the ColdFire: the host tests are the integration tests in tests/ (they include image.rs by path)
test = false

[dependencies]
dkrt-abi = { path = "../../../runtime/abi" }
dkrt-sdk = { path = "../../../runtime/sdk" }
dkrt-svc-rt = { path = "../../../runtime/svc-rt" }
dkrt-svc-machines = { path = ".." }

[dev-dependencies]
dkrt-test-support = { path = "../../../runtime/test-support" }

# This crate sits inside the repository's cargo workspace tree but is built on its own (`patchkit build`).
[workspace]

[profile.release]
opt-level = "s"
panic = "abort"
lto = false
codegen-units = 1
debug = false
