[[case]]
name = "the output stays below the level bound: amplitude 1, shift 30.0"

[case.input]
kind = "square-noise"
amp = 1.0

[[case.step]]
params_f32 = [30.0]
blocks = 150

[[case.check]]
# the routine clamps at 7.9; the adapter refuses nothing (the implicit rules)
kind = "peak"
channel = "both"
max = 7.900000095367432

[[case]]
name = "the output stays below the level bound: amplitude 8, shift -45.0"

[case.input]
kind = "square-noise"
amp = 8.0

[[case.step]]
params_f32 = [-45.0]
blocks = 150

[[case.check]]
# the routine clamps at 7.9; the adapter refuses nothing (the implicit rules)
kind = "peak"
channel = "both"
max = 7.900000095367432

[[case.check]]
# an input at the level bound does reach the clamp's neighbourhood
kind = "peak"
channel = "both"
min = 3.0

[[case]]
name = "the output stays below the level bound: amplitude 8, shift 0.0"

[case.input]
