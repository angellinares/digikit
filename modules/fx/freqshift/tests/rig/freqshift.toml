[[case]]
name = "writes stay in the state, the description is right and the cost matches"

[case.input]
kind = "sin-index"

[[case.step]]
params_f32 = [25.0]
blocks = 6

[[case.check]]
kind = "description"
words = [0x444B4658, 1, 1, 664, 1, 0]

[[case.check]]
# core/fx around one call is about 520 instructions
kind = "instructions"
of = "idle"
min = 3001
max = 4799

[[case]]
name = "the state is the description state and nothing else"

[case.input]
kind = "table"
file = "ref/mixed-in-9.f32"

[[case.step]]
params_f32 = [25.0]
blocks = 1

[[case.check]]
kind = "state-untouched-beyond"

[[case]]
name = "the oscillator does not drift in a run of 1,500 blocks"

[case.input]
kind = "sine"
freq = 1000.0
amp = 0.5

[[case.step]]
params_f32 = [33.3]
blocks = 1500

[[case.check]]
# the tone at the exact frequency (inc 3690415) keeps its level and phase over eight windows
kind = "tone-stable"
freq = 1041.243601590395
windows = 8
window_blocks = 400
amp = 0.5
tol = 0.002
amp_spread = 1e-4
phase_drift = 1e-3

[[case.check]]
# the phase word is the closed form 528 d + (N - 1) 32 inc after any number of blocks
kind = "state-word"
index = 0
equals = 989059184

[[case.check]]
kind = "peak"
max = 0.8

# The shifter's PCM oracles of the retired device test (a sine moved by the SHIFT word; the image down; level; no clip). SHIFT 40 is
# 96.79035 Hz (the routine's mapping, `target_inc` of freqshift_ref.py). A tone of 440 Hz at 0.5 comes out at 536.79035 Hz (up) or 343.20965 Hz (down).

[[case]]
name = "a sine at 440 Hz moves up by the shift of 40: level, image and no clip"

[case.input]
kind = "sine"
freq = 440.0
amp = 0.5

[[case.step]]
params_f32 = [40.0]
blocks = 1500

[[case.check]]
kind = "tone"
freq = 536.79035
amp = 0.5
tol = 0.0025
image_freq = 343.20965
image_db_min = 40.0
skip_blocks = 300

[[case.check]]
kind = "no-clip"
limit = 1.0

[[case.check]]
kind = "peak"
min = 0.45
max = 0.55
blocks = [300, 1500]

[[case]]
name = "a sine at 440 Hz moves down by the shift of -40: level, image and no clip"

[case.input]
kind = "sine"
freq = 440.0
amp = 0.5

[[case.step]]
params_f32 = [-40.0]
blocks = 1500

[[case.check]]
kind = "tone"
freq = 343.20965
amp = 0.5
tol = 0.0025
image_freq = 536.79035
image_db_min = 40.0
skip_blocks = 300

[[case.check]]
kind = "no-clip"
limit = 1.0

[[case]]
name = "the shift 0 keeps the tone at 440 Hz and its level"

[case.input]
kind = "sine"
freq = 440.0
amp = 0.5

[[case.step]]
params_f32 = [0.0]
blocks = 1500

[[case.check]]
kind = "tone"
freq = 440.0
amp = 0.5
tol = 0.0025
skip_blocks = 300

# The output does not depend on what the state held at the start: the same input after two different fills of the declared state
# gives the same words (the pin is the hash of the output words; pending Em's review, like every new rig pin).

[[case]]
name = "state independence: the state starts at zero"
state_fill = 0

[case.input]
kind = "table"
file = "ref/mixed-in-3.f32"

[[case.step]]
params_f32 = [40.0]
blocks = 36

[[case.check]]
kind = "same-as"
channel = "both"
sha256 = "b7f01e7360fd6fd87bcd64baa4b9641b53c636b8355e09760984099202b0b6d0"

[[case]]
name = "state independence: the state starts at one word of 1.0"
state_fill = 0x3f800000

[case.input]
kind = "table"
file = "ref/mixed-in-3.f32"

[[case.step]]
params_f32 = [40.0]
blocks = 36

[[case.check]]
kind = "same-as"
channel = "both"
sha256 = "b7f01e7360fd6fd87bcd64baa4b9641b53c636b8355e09760984099202b0b6d0"
