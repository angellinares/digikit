# digikit/freqshift on the SHARC-only rig (replaces modules/fx/freqshift/tests/test_freqshift.py; the adapter legs are core/fxpages fx-bipolar).
# The tables ref/*.f32 are the inputs (numpy generators) and the output of the float32 model freqshift_ref.py that the Python tests compared the routine with
# (tools/devtools/rig_refs.py). Effect cases run once: the Python tests run the effect behind the DT2 adapter only. Inputs are 64 floats a block, left then right.

[[case]]
name = "the routine matches the model: shift 0.0"

[case.input]
kind = "table"
file = "ref/mixed-in-3.f32"

[[case.step]]
params_f32 = [0.0]
blocks = 36

[[case.check]]
# the last bit of a float32 near 1.0 (0 where the SHARC+ FLOAT and TRUNC agree with numpy)
kind = "matches-table"
file = "ref/model-v0.f32"
channel = "both"
atol = 2e-7

