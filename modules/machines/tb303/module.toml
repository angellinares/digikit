[module]
id = "tom/tb303"
version = "0.1.0"
name = "TB303"
category = "machines"
type = "machine"
author = "tom"
status = "experimental"
summary = "Open303: the 303 saw or square through its TB-303 filter, filter envelope, accent (velocity above 100, amount on knob C) and amp envelope; overlapping notes slide."
dynamic = true
ports = ["dt2-1.17"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"

# The machine declaration (DK_MACHINE and DK_PARAM in src/module.c). It holds only .dk.desc records.
[[object]]
path = "build/tb303-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

# src/dsp/tables.inc (included by tb303.s) is generated by src/dsp/gen_tables.py: Open303's SAW303 and SQUARE303 levels (83 KB) and
# the routine's constants.
[[object]]
path = "build/tb303-dsp.dko.json"
sources = ["src/dsp/tb303.s"]
place = "dsp.l2"
