# tom/tb303 on the SHARC-only rig (replaces modules/machines/tb303/tests/test_tb303.py; DT2 only, the module has no DN2 port).
# The tables ref/*.f32 are the output of the float32 model tb303_ref.py that the Python tests compared the routine with (tools/devtools/rig_refs.py).

[[case]]
name = "the routine matches the model: saw"
device = ["dt2"]

[[case.step]]
note = 36
vel = 80
params = { tune = 16384, wave = 0, cutoff = 9754, resonance = 22758, env_mod = 19507, decay = 13005, accent = 32512 }
blocks = 60

[[case.check]]
kind = "matches-table"
file = "ref/model-saw.f32"
atol = 1e-5

[[case.check]]
kind = "peak"
min = 0.05

