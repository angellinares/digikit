# digikit/shot on the SHARC-only rig (replaces modules/machines/shot/tests/test_shot_playback.py).
# The tables ref/*.f32 are the output of the Python reader model of that test for the same scenarios (tools/devtools/rig_refs.py shot); the PCM of
# the pool entries is ref/pcm-*.i16 (the numpy generator's int16 words). The count word of the pool's control set is checked after every block.

[[case]]
name = "default parameters play the whole sample (dt2)"
device = ["dt2"]
context = "friendly"
pool_ctl = "_shot_sample_ctl"
right = true

[[case.pool]]
index = 0
frames = 200
rate = 48000
channels = 2
token = 7
planes = "ref/pcm-1-2.i16"


[[case.step]]
note = 60
vel = 100
params = { sample = 0, start = 0, end = 32512, play = 768, pitch = 16384 }
blocks = 8

[[case.check]]
kind = "matches-table"
file = "ref/default-dt2-l.f32"
blocks = [0, 8]
atol = 0

[[case.check]]
kind = "peak"
min = 0.04

[[case.check]]
kind = "cursor"
block = 7
index = 4
equals = 65536
tol = 2
signed = true

[[case.check]]
kind = "matches-table"
file = "ref/default-dt2-r.f32"
channel = "right"
atol = 0


