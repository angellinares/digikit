[module]
id = "fadedlimes/bd"
version = "0.1.0"
name = "Bass Drum"
category = "machines"
type = "machine"
author = "fadedlimes"
status = "experimental"
summary = "An FM bass drum: a decaying modulator index turns a clang into a sine, over a carrier that punches down."
dynamic = true
ports = ["dt2-1.17", "dn2-1.12"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# The machine is declared by builder calls in init (src/module.c).
[[machine]]
id = "bd"

[[object]]
path = "build/bd-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

[[object]]
path = "build/bd-dsp.dko.json"
sources = ["src/dsp/bd.s"]
place = "dsp.l2"

[uses.dt2]
machine_rows = 1
param_rows = 4
page_rows = 0
record_bytes = 444
dsp_cost_voice = 4408

[uses.dn2]
machine_rows = 1
param_rows = 4
page_rows = 1
record_bytes = 540
dsp_cost_voice = 4562
