# fadedlimes/bd loaded at boot as a run-time machine: voice row claimed, the note plays. The module has no patched-in twin any more, so the PCM
# of a note (from its onset, DT2 1.17 and DN2 1.12) is pinned by SHA-256. "record" fails and prints the hash.
# Before the twin was removed, the DT2 note equalled the patched-in machine's (finding 76).
[scenario]
name = "equiv-dyn-bd"
kind = "equiv"
devices = ["dt2", "dn2"]
tier = "quick"

[equiv]
modules = ["fadedlimes/bd"]
play = "bd"
play_module = "fadedlimes/bd"
play_machine = "bd"
hint = 7
voices = 1
ignore_run_machines = ["Bass Drum"]
pcm_sha256 = "8de331fb3fec4648ef530b0f56e1fd8cf2634c094e7dd4631b472c2942f5dceb"   # onset 194, 24000 samples (DT2 1.17, note 60); approved by Em 2026-11-01 (exact RECIPS, finding 102)


[equiv.dn2]
pcm_sha256 = "5838f6e275cc21b45d6c97b43e1b48e1e6876517b18b07c527dae611b1325622"   # onset 270, 24000 samples (DN2 1.12, note 60); approved by Em 2026-11-01 (exact RECIPS, finding 102)
hint = 4
hint_run = 5    # the run-time machine follows MIDI
trig_frame = 7000
