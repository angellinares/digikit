# fadedlimes/analog loaded at boot as a run-time machine: voice row claimed, the note plays. The module has no patched-in twin any more, so the PCM
# of a note (from its onset, DT2 1.17 and DN2 1.12) is pinned by SHA-256. "record" fails and prints the hash.
# Before the twin was removed, the DT2 note equalled the patched-in machine's (finding 76).
[scenario]
name = "equiv-dyn-analog"
kind = "equiv"
devices = ["dt2", "dn2"]
tier = "quick"

[equiv]
modules = ["fadedlimes/analog"]
play = "analog"
play_module = "fadedlimes/analog"
play_machine = "analog"
hint = 7
voices = 1
ignore_run_machines = ["Analog"]
pcm_sha256 = "427c8f33e23779303e4a2161e77c168f9b5e4833522fba23d901f3442ffeeb8a"   # onset 256, 24000 samples (DT2 1.17, note 60); approved by Em 2026-11-01 (exact RECIPS, finding 102)

# the voice state is uninitialised L2 (a run-time module gets no zeroed state): read the model of the device, not zeros
[equiv.env_run]
SHARC_UNINIT = "5eed1234"

[equiv.dn2]
pcm_sha256 = "44db3540cf67de6e20ef5cda8e15f5a45bef5bbdc6c86213a7f6ea1dbf8f651e"   # onset 328, 24000 samples (DN2 1.12, note 60); approved by Em 2026-11-01 (exact RECIPS, finding 102)
hint = 4
hint_run = 5    # the run-time machine follows MIDI
trig_frame = 7000
