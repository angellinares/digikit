[module]
id = "fadedlimes/pd"
version = "0.1.0"
name = "Phase Dist"
category = "machines"
type = "machine"
author = "fadedlimes"
status = "experimental"
summary = "One continuous slider warps the phase a sine is read through: saw, pulse, or a resonant formant."
dynamic = true
ports = ["dt2-1.17", "dn2-1.12"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# The machine is declared by builder calls in init (src/module.c).
[[machine]]
id = "pd"

[[object]]
path = "build/pd-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

[[object]]
path = "build/pd-dsp.dko.json"
sources = ["src/dsp/pd.s"]
place = "dsp.l2"

[uses.dt2]
machine_rows = 1
param_rows = 4
page_rows = 0
record_bytes = 444
dsp_cost_voice = 5248

[uses.dn2]
machine_rows = 1
param_rows = 4
page_rows = 1
record_bytes = 540
dsp_cost_voice = 5402
