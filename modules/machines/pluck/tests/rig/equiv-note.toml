# pluck (digikit/pluck): the note pin on the SHARC-only rig. It replaces the PCM pin of tests/equiv.device.test.ts (that file's note, retired after the R12-6 gate and review).
# Each case plays note 60, velocity 100, every parameter at its manifest default, for 375 blocks (0.25 s, as long as the device pin), then a second note 67 for 375 blocks (state after running a while; it replaces the device full-tier equiv-mixed case) in a friendly context,
# and runs twice with all module state filled differently (NaN words, then a seeded integer pattern) and fails when the outputs differ (the output does not depend on the initial state), and pins the SHA-256 of the machine's float32 output words (750 blocks of 32 samples, both notes). The device pin hashed the same note through the whole firmware
# path (track filter, mixer, output); this pin sees only the machine's own DSP. One case per device: the sha256 differs per device.
# The pins are written by the rig, never by hand: DIGI_RIG_PIN=1 pnpm exec vitest run --config vitest.host.config.ts --project module-rig modules/machines/pluck/tests/
# A changed pin is a re-pin and needs Em's review (docs/plans/ledgers/t2-machine-rig-refs.md).

[[case]]
name = "note 60 at the default parameters is pinned: dt2"
device = ["dt2"]
context = "friendly"

[[case.step]]
note = 60
vel = 100
blocks = 375

[[case.step]]
note = 67
vel = 100
blocks = 375

[[case.check]]
kind = "same-as"
sha256 = "65f2c9d932449430d967f2a748b888b5217c862d882db49b69ffbad1f85cfff8"

[[case.check]]
kind = "peak"
min = 0.01

[[case.check]]
kind = "no-clip"

[[case]]
name = "note 60 at the default parameters is pinned: dn2"
device = ["dn2"]
context = "friendly"

[[case.step]]
note = 60
vel = 100
blocks = 375

[[case.step]]
note = 67
vel = 100
blocks = 375

[[case.check]]
kind = "same-as"
sha256 = "7cb2a7f0b53d52be338b7823c0d2d3f15020227aefe5b2621f7e23e7d0e18a17"

[[case.check]]
kind = "peak"
min = 0.01

[[case.check]]
kind = "no-clip"
