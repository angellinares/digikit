# digikit/pluck on the SHARC-only rig (replaces test_pluck.py, test_pluck_range.py and test_pluck_tune.py with pluck_rig.py).
# The tables ref/*.f32 are the output of the float32 model pluck_ref.py that the Python tests compared the routine with (tools/devtools/rig_refs.py).
# The tolerance is the Python one: 2e-5 * max(1, model peak); every model peak is below 1.

[[case]]
name = "the routine matches the model: default"
device = ["dt2"]

[[case.step]]
note = 60.0
vel = 100
params = { tune = 16384, decay = 16384, pick_position = 0, brightness = 16384, excitation_colour = 0 }
blocks = 40

[[case.check]]
kind = "matches-table"
file = "ref/model-default.f32"
atol = 2e-5

[[case.check]]
kind = "peak"
min = 0.05

[[case]]
name = "the routine matches the model: low"
device = ["dt2"]

[[case.step]]
note = 48
vel = 100
params = { tune = 16384, decay = 28672, pick_position = 8192, brightness = 8192, excitation_colour = 12288 }
blocks = 40

[[case.check]]
kind = "matches-table"
file = "ref/model-low.f32"
atol = 2e-5

[[case.check]]
kind = "peak"
min = 0.05

[[case]]
name = "the routine matches the model: high-tuned"
device = ["dt2"]

[[case.step]]
note = 84
vel = 127
params = { tune = 16896, decay = 16384, pick_position = 0, brightness = 32512, excitation_colour = 32512 }
blocks = 40

[[case.check]]
kind = "matches-table"
file = "ref/model-high-tuned.f32"
atol = 2e-5

[[case.check]]
kind = "peak"
min = 0.05

[[case]]
name = "the routine matches the model: pick-max"
device = ["dt2"]

[[case.step]]
note = 33
vel = 100
params = { tune = 16384, decay = 4096, pick_position = 32512, brightness = 0, excitation_colour = 0 }
blocks = 40

[[case.check]]
kind = "matches-table"
file = "ref/model-pick-max.f32"
atol = 2e-5

[[case.check]]
kind = "peak"
min = 0.05

[[case]]
name = "the string stays finite and matches the model at the corner note0"
device = ["dt2"]

[[case.step]]
note = 0
vel = 100
params = { tune = 0, decay = 16384, pick_position = 0, brightness = 16384, excitation_colour = 0 }
blocks = 8

[[case.check]]
kind = "matches-table"
file = "ref/model-note0.f32"
atol = 2e-5

