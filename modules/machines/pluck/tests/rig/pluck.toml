[[case]]
name = "the string stays finite and matches the model at the corner note127"
device = ["dt2"]

[[case.step]]
note = 127
vel = 100
params = { tune = 32512, decay = 16384, pick_position = 0, brightness = 16384, excitation_colour = 0 }
blocks = 8

[[case.check]]
kind = "matches-table"
file = "ref/model-note127.f32"
atol = 2e-5

[[case]]
name = "the string stays finite and matches the model at the corner note127-max-word"
