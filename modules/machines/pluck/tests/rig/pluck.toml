[[case.step]]
note = 127
vel = 100
params = { tune = 65535, decay = 16384, pick_position = 0, brightness = 16384, excitation_colour = 0 }
blocks = 8

[[case.check]]
kind = "matches-table"
file = "ref/model-note127-max-word.f32"
atol = 2e-5

[[case]]
name = "instruction counts per block"
device = ["dt2"]

[[case.step]]
note = 48
vel = 100
params = { tune = 16384, decay = 16384, pick_position = 0, brightness = 16384, excitation_colour = 0 }
blocks = 2

[[case.check]]
kind = "instructions"
of = "first"
max = 59999

[[case.check]]
kind = "instructions"
of = "steady"
max = 2199

[[case]]
name = "an idle voice costs little"
device = ["dt2"]

[[case.step]]
note = 48
vel = 100
params = { tune = 16384, decay = 16384, pick_position = 0, brightness = 16384, excitation_colour = 0 }
blocks = 2

[[case.step]]
record_word = 0
trigger = false
blocks = 1

[[case.check]]
# wrapper (saves, pins and restores the context registers, writes four breadcrumbs) + 32 stores + the guard
kind = "instructions"
of = "idle"
max = 749

[[case]]
name = "the voice ends when it is quiet and clears its flags"
device = ["dt2"]

[[case.step]]
note = 84
vel = 100
params = { tune = 16384, decay = 0, pick_position = 0, brightness = 0, excitation_colour = 0 }
blocks = 1500

# the next block, with the voice record idle, is silent
[[case.step]]
record_word = 0
trigger = false
blocks = 1

[[case.check]]
kind = "voice-ends"
after = 5
within = 1499

[[case.check]]
kind = "peak"
blocks = [1500, 1501]
max = 0

[[case]]
name = "a new note restarts the string"
device = ["dt2"]

[[case.step]]
note = 60
vel = 100
params = { tune = 16384, decay = 16384, pick_position = 0, brightness = 16384, excitation_colour = 0 }
blocks = 6

# the arm routine: ACTIVE = 1, mark cleared
[[case.step]]
trigger = true
blocks = 1

[[case.check]]
kind = "peak"
blocks = [6, 7]
min = 0.05

[[case.check]]
kind = "differs"
blocks = [6, 7]
other = [0, 1]

[[case]]
name = "the string is in tune: note 24"
device = ["dt2"]

[[case.step]]
note = 24
vel = 100
params = { tune = 16384, decay = 32512, pick_position = 0, brightness = 32512, excitation_colour = 28672 }
blocks = 1839

[[case.check]]
# the phase slope of the first partial after four periods, within the model's analytic error plus the measurement's
kind = "pitch-hz"
note = 24
method = "bandpass"
skip_periods = 4
cents = 1.5

